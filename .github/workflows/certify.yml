name: T1 L040 V9.2 Explicit V Basis

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  explicit-v-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Extract priority rows
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run
          L=0.40; N=1200; TARGETS=[341,326,396]
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])
          A=np.vstack(rows+[np.ones_like(r)])
          b=np.concatenate([caps,[1.0]])
          lp=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          y=-np.asarray(lp.ineqlin.marginals[:-1],float)
          out={"L":L,"N":N,"pilot":float(val),"targets":{}}
          for idx in TARGETS:
              row=rows[idx]
              out["targets"][str(idx)]={
                  "cap":float(caps[idx]),
                  "dual_weight":float(y[idx]),
                  "theta":abs(float(np.min(row))),
                  "row_min":float(np.min(row)),
                  "row_max":float(np.max(row))
              }
              print(idx,out["targets"][str(idx)])
          with open("../../../v92-targets.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("TARGET EXTRACTION: PASS")
          PY

      - name: Build explicit orthonormal basis of V
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.linalg import null_space
          from sharp_floor import build_operator

          L=0.40; n=1000
          u,w,v1,v2,K=build_operator(L,n)

          U=np.column_stack([v1,v2])
          # V = ker(U^T). Q has n-2 orthonormal columns.
          Q=null_space(U.T)

          orth=np.linalg.norm(Q.T@Q-np.eye(Q.shape[1]),2)
          annih=np.linalg.norm(U.T@Q,2)
          P=np.eye(n)-U@U.T
          proj=np.linalg.norm(Q@Q.T-P,2)

          print("Q shape =",Q.shape)
          print("||Q^TQ-I|| =",orth)
          print("||U^TQ|| =",annih)
          print("||QQ^T-P|| =",proj)

          if Q.shape != (n,n-2): raise RuntimeError("wrong V dimension")
          if max(orth,annih,proj)>1e-10:
              raise RuntimeError("explicit V basis verification failed")

          with open("../../../v92-basis-check.json","w") as f:
              json.dump({
                  "n":n,
                  "dimV":int(Q.shape[1]),
                  "orth_error":float(orth),
                  "annihilation_error":float(annih),
                  "projector_error":float(proj)
              },f,indent=2)

          print("EXPLICIT V BASIS: PASS")
          PY

      - name: Verify exact shift identity inside V
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.linalg import null_space, eigvalsh
          from sharp_floor import build_operator
          from sigma_lp import project_constraints

          L=0.40; n=700
          u,w,v1,v2,K=build_operator(L,n)
          U=np.column_stack([v1,v2])
          Q=null_space(U.T)

          cases=[
              (0.2,5,10),(0.2,10,20),
              (1.5,5,10),(1.5,10,20),
              (4.0,5,10),(4.0,10,20)
          ]
          report=[]; maxerr=0.0

          for theta,R1,R2 in cases:
              K1,_=K(R1); K2,_=K(R2)
              K1=project_constraints(K1,v1,v2)
              K2=project_constraints(K2,v1,v2)

              # Compress literally to V.
              K1V=Q.T@K1@Q
              K2V=Q.T@K2@Q
              CV=K1V+theta*K2V
              AV=CV-theta*np.eye(Q.shape[1])

              lamA=float(eigvalsh(AV,subset_by_index=[AV.shape[0]-1,AV.shape[0]-1])[0])
              lamC=float(eigvalsh(CV,subset_by_index=[CV.shape[0]-1,CV.shape[0]-1])[0])
              err=abs(lamA-(lamC-theta))
              maxerr=max(maxerr,err)

              item={"theta":theta,"R1":R1,"R2":R2,
                    "lambda_A_V":lamA,"lambda_C_V":lamC,
                    "lambda_C_minus_theta":lamC-theta,"error":err}
              report.append(item); print(item)

          if maxerr>1e-10:
              raise RuntimeError("explicit-V shift identity failed")

          with open("../../../v92-shift-identity.json","w") as f:
              json.dump({"max_error":maxerr,"cases":report},f,indent=2)

          print("EXPLICIT-V SHIFT IDENTITY: PASS")
          PY

      - name: Projected shifted k2 feasibility scan
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.linalg import null_space, eigvalsh
          from sharp_floor import build_operator
          from sigma_lp import project_constraints

          L=0.40; n=500
          u,w,v1,v2,K=build_operator(L,n)
          U=np.column_stack([v1,v2]); Q=null_space(U.T)
          cache={}

          def KV(R):
              if R not in cache:
                  KR,_=K(R)
                  KR=project_constraints(KR,v1,v2)
                  cache[R]=Q.T@KR@Q
              return cache[R]

          thetas=[0.2,1.5,4.0]
          Rs=[4,5,6,7,8,9,10,12,15,18,20,22]
          report={}

          for theta in thetas:
              cand=[]
              for R1 in Rs:
                  for R2 in Rs:
                      if R2<=R1: continue
                      C=KV(R1)+theta*KV(R2)
                      A=C-theta*np.eye(C.shape[0])
                      lam=float(eigvalsh(A,subset_by_index=[A.shape[0]-1,A.shape[0]-1])[0])
                      m2=float(np.linalg.norm(C,"fro"))
                      bound=m2-theta
                      cand.append({
                          "R1":R1,"R2":R2,"lambda_A":lam,
                          "sqrt_Tr_C2":m2,
                          "shifted_k2_bound":bound,
                          "slack":bound-lam
                      })
              cand.sort(key=lambda z:z["slack"])
              report[str(theta)]=cand[:30]
              print("\nTHETA",theta)
              for z in cand[:10]: print(z)

          with open("../../../v92-k2-scan.json","w") as f:
              json.dump(report,f,indent=2,sort_keys=True)
          print("EXPLICIT-V k2 SCAN: PASS")
          PY

      - name: Compare k2 feasibility with dual budget
        run: |
          python - <<'PY'
          import json
          with open("v92-targets.json") as f: d=json.load(f)
          with open("v92-k2-scan.json") as f: s=json.load(f)
          pilot=float(d["pilot"])
          out={}
          print("pilot =",pilot)

          for row in ["341","326","396"]:
              t=d["targets"][row]
              theta=str(float(t["theta"]))
              cap=float(t["cap"]); y=float(t["dual_weight"])
              allowance=pilot/6/y
              target=cap+allowance
              best=s[theta][0]
              out[row]={
                  "theta":theta,"float_cap":cap,
                  "dual_weight":y,"allowed_inflation":allowance,
                  "engineering_target":target,
                  "best_prototype":best
              }
              print("\nROW",row)
              print("target rigorous cap <",target)
              print("best prototype shifted k2 =",best["shifted_k2_bound"])
              print("prototype slack =",best["slack"])

          with open("v92-budget.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("\nBUDGET COMPARISON: PASS")
          PY

      - name: Verify continuum sinc cross moments with Arb
        run: |
          python - <<'PY'
          from flint import arb,ctx
          ctx.prec=192
          ell=arb("0.8"); pi=arb.pi()

          def verified_inner(R0,S0,M=10000):
              R=arb(str(R0)); S=arb(str(S0)); dx=ell/arb(M)
              first=2*ell*R*S/(pi*pi)*dx
              total=arb("0 +/- "+str(float(first)))
              for i in range(1,M):
                  a=ell*arb(i)/arb(M); b=ell*arb(i+1)/arb(M)
                  X=(a+b)/2 + arb("0 +/- "+str(float((b-a)/2)))
                  total += 2*(ell-X)*((R*X).sin()/(pi*X))*((S*X).sin()/(pi*X))*(b-a)
              return total

          for R,S in [(5,10),(8,15),(10,20),(15,22)]:
              print(R,S,verified_inner(R,S))
          print("ARB CONTINUUM CROSS-MOMENTS: PASS")
          PY

      - name: Write V9.2 ledger
        run: |
          cat > V92-LEDGER.txt <<'EOF'
          V9.2 — EXPLICIT CONSTRAINED-SPACE AUDIT

          V9 and V9.1 exposed a genuine numerical representation issue:
          projected n x n matrices retain two null modes belonging to V-perp.

          V9.2 removes those modes literally by constructing an orthonormal
          basis Q of V = ker(U^T), and compressing every operator as Q^T A Q.

          The identity tested is therefore exactly

              A_V = C_V - theta I_(n-2),

          and hence

              lambda_max(A_V) = lambda_max(C_V) - theta.

          The k=2 feasibility bound is

              lambda_max(A_V)
              <= sqrt(Tr(C_V^2)) - theta.

          This remains a numerical feasibility audit. It is not a proof of
          T1 or RH. Exact reconstruction of rows 341/326/396 as continuum
          operators, verified rank-2 corrections, rigorous moment enclosures,
          and a complete dual certificate are still required.
          EOF
          cat V92-LEDGER.txt

      - name: Upload V9.2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v92-explicit-v
          path: |
            v92-targets.json
            v92-basis-check.json
            v92-shift-identity.json
            v92-k2-scan.json
            v92-budget.json
            V92-LEDGER.txt