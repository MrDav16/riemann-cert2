name: T1 L040 V20 Identification Lemma Audit Row326

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  identification-lemma:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath sympy python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Capture exact reference implementation
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import inspect,json
          import sharp_floor,sigma_t1b

          out={
            "build_operator":inspect.getsource(sharp_floor.build_operator),
            "profile_operator":inspect.getsource(sigma_t1b.profile_operator)
          }
          with open("../../../v20-reference-source.json","w") as f:
              json.dump(out,f,indent=2)
          print(out["build_operator"])
          print(out["profile_operator"])
          print("SOURCE CAPTURE: PASS")
          PY

      - name: Rebuild row326 reference objects
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigh
          from sigma_t1c import run
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          L=.4; N=1200; ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          sig=rows[ROW]; theta=abs(float(sig.min())); c=sig+theta

          u,w,v1,v2,K=build_operator(L,N)
          C=profile_operator(c,r,u,w,v1,v2)
          X=np.column_stack([v1,v2])
          Q=null_space(X.T)
          A=Q.T@C@Q
          A=(A+A.T)/2

          np.save("../../../v20-u.npy",u)
          np.save("../../../v20-w.npy",w)
          np.save("../../../v20-v1.npy",v1)
          np.save("../../../v20-v2.npy",v2)
          np.save("../../../v20-C.npy",C)
          np.save("../../../v20-Q.npy",Q)
          np.save("../../../v20-A.npy",A)
          np.save("../../../v20-r.npy",r)
          np.save("../../../v20-c.npy",c)

          out={"L":L,"N":N,"row":ROW,"theta":theta,
               "cap":float(caps[ROW]),"pilot":float(val),
               "dim_A":int(A.shape[0])}
          with open("../../../v20-input.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("REFERENCE OBJECTS: PASS")
          PY

      - name: Identify weighted Nyström structure
        run: |
          python - <<'PY'
          import json,numpy as np

          u=np.load("v20-u.npy")
          w=np.load("v20-w.npy")
          C=np.load("v20-C.npy")
          n=len(u)

          # A symmetric Nyström representation for a kernel k(u-v) has
          # entries sqrt(w_i) k(u_i-u_j) sqrt(w_j), before projection.
          # Recover the implied sampled kernel from C away from the pole
          # projection bookkeeping and test Toeplitz-by-difference behavior.
          sw=np.sqrt(w)
          raw=C/(sw[:,None]*sw[None,:])

          # Compare entries with equal grid-index difference.
          maxspread=0.0
          records=[]
          for d in [0,1,2,5,10,50,100,300,600,1000]:
              vals=np.diag(raw,k=d)
              if len(vals)==0: continue
              spread=float(np.max(vals)-np.min(vals))
              maxspread=max(maxspread,abs(spread))
              records.append({"offset":d,"mean":float(np.mean(vals)),
                              "spread":spread})
          out={"max_equal_offset_spread":maxspread,"offsets":records}
          with open("v20-nystrom-structure.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("NYSTROM STRUCTURE AUDIT: PASS")
          PY

      - name: Reconstruct analytic row326 kernel
        run: |
          python - <<'PY'
          import json,math,numpy as np

          r=np.load("v20-r.npy"); c=np.load("v20-c.npy")
          slope=np.diff(c)/np.diff(r)
          ids=[0]
          for i in range(1,len(slope)):
              if abs(slope[i]-slope[i-1])>1e-10:ids.append(i)
          ids.append(len(r)-1); ids=sorted(set(ids))
          knots=[(float(r[i]),float(c[i])) for i in ids]

          seg=[]
          for (a,ya),(b,yb) in zip(knots[:-1],knots[1:]):
              A=(yb-ya)/(b-a); B=ya-A*a
              seg.append((a,b,A,B))

          def moment(p):
              s=0.
              for a,b,A,B in seg:
                  s+=A*(b**(p+2)-a**(p+2))/(p+2)
                  s+=B*(b**(p+1)-a**(p+1))/(p+1)
              return s

          def k(x):
              if abs(x)<1e-5:
                  return sum(((-1)**m)*moment(2*m)*x**(2*m)/
                             math.factorial(2*m) for m in range(8))/math.pi
              z=0.
              for a,b,A,B in seg:
                  def F(q):
                      return A*(q*math.sin(q*x)/x+math.cos(q*x)/x**2)+B*math.sin(q*x)/x
                  z+=F(b)-F(a)
              return z/math.pi

          xs=np.linspace(-.8,.8,401)
          out={"knots":knots,"M0":moment(0),"M2":moment(2),
               "samples":[[float(x),float(k(float(x)))] for x in xs]}
          with open("v20-analytic-kernel.json","w") as f:json.dump(out,f,indent=2)
          print("knots",knots)
          print("M0",out["M0"],"M2",out["M2"])
          print("ANALYTIC KERNEL: PASS")
          PY

      - name: Compare reference matrix to analytic weighted kernel
        run: |
          python - <<'PY'
          import json,math,numpy as np

          u=np.load("v20-u.npy");w=np.load("v20-w.npy")
          C=np.load("v20-C.npy")
          with open("v20-analytic-kernel.json") as f:d=json.load(f)
          knots=d["knots"]

          seg=[]
          for (a,ya),(b,yb) in zip(knots[:-1],knots[1:]):
              A=(yb-ya)/(b-a);B=ya-A*a;seg.append((a,b,A,B))

          def moment(p):
              return sum(A*(b**(p+2)-a**(p+2))/(p+2)+
                         B*(b**(p+1)-a**(p+1))/(p+1)
                         for a,b,A,B in seg)

          def k(x):
              if abs(x)<1e-5:
                  return sum(((-1)**m)*moment(2*m)*x**(2*m)/
                             math.factorial(2*m) for m in range(8))/math.pi
              z=0.
              for a,b,A,B in seg:
                  def F(q):
                      return A*(q*math.sin(q*x)/x+math.cos(q*x)/x**2)+B*math.sin(q*x)/x
                  z+=F(b)-F(a)
              return z/math.pi

          # Build exact analytic weighted kernel on the same u,w grid.
          # 1200^2 evaluations are acceptable.
          n=len(u); B=np.empty((n,n),float)
          for i in range(n):
              for j in range(i,n):
                  z=math.sqrt(w[i]*w[j])*k(float(u[i]-u[j]))
                  B[i,j]=z;B[j,i]=z

          np.save("v20-Banalytic.npy",B)
          D=C-B
          out={"C_minus_B_inf":float(np.linalg.norm(D,np.inf)),
               "C_minus_B_2":float(np.linalg.norm(D,2)),
               "C_minus_B_maxentry":float(np.max(np.abs(D)))}
          with open("v20-reference-vs-analytic.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("REFERENCE/ANALYTIC COMPARISON: PASS")
          PY

      - name: Identify discrete constraint vectors
        run: |
          python - <<'PY'
          import json,numpy as np,math

          u=np.load("v20-u.npy");w=np.load("v20-w.npy")
          v1=np.load("v20-v1.npy");v2=np.load("v20-v2.npy")
          sw=np.sqrt(w)

          # Candidate weighted samples of continuous pole functions.
          gplus=sw*np.exp(u/2)
          gminus=sw*np.exp(-u/2)

          def rel(a,b):
              # sign/scale invariant comparison
              alpha=float(np.dot(a,b)/np.dot(b,b))
              return float(np.linalg.norm(a-alpha*b)/np.linalg.norm(a)),alpha

          candidates={}
          for name,v in [("v1",v1),("v2",v2)]:
              ep,ap=rel(v,gplus); em,am=rel(v,gminus)
              candidates[name]={"vs_sqrtw_exp_plus":{"relative":ep,"scale":ap},
                                "vs_sqrtw_exp_minus":{"relative":em,"scale":am}}
          with open("v20-constraint-identification.json","w") as f:
              json.dump(candidates,f,indent=2)
          print(json.dumps(candidates,indent=2))
          print("CONSTRAINT IDENTIFICATION: PASS")
          PY

      - name: Exact projector equivalence on finite weighted space
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space

          v1=np.load("v20-v1.npy");v2=np.load("v20-v2.npy")
          Q=np.load("v20-Q.npy")
          X=np.column_stack([v1,v2])

          # Q Q^T is the orthogonal complement projector to span(X).
          Pq=Q@Q.T
          Px=np.eye(len(v1))-X@np.linalg.inv(X.T@X)@X.T

          err=float(np.linalg.norm(Pq-Px,2))
          idem=float(np.linalg.norm(Pq@Pq-Pq,2))
          annih=float(np.linalg.norm(Pq@X,2))

          out={"projector_equivalence_2norm":err,
               "idempotence_error":idem,
               "constraint_annihilation":annih}
          with open("v20-projector-equivalence.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if err>1e-10:raise RuntimeError("finite projector equivalence failed")
          print("FINITE PROJECTOR EQUIVALENCE: PASS")
          PY

      - name: Common-space identification error budget
        run: |
          python - <<'PY'
          import json,numpy as np,math

          with open("v20-reference-vs-analytic.json") as f:d=json.load(f)
          with open("v20-constraint-identification.json") as f:c=json.load(f)
          with open("v20-projector-equivalence.json") as f:p=json.load(f)

          # The matrix comparison directly measures the difference between the
          # reference profile_operator matrix and the analytic weighted-kernel
          # matrix on the same nodes/weights.
          eta_kernel=float(d["C_minus_B_2"])

          # Constraint-vector mismatch is converted conservatively to a
          # diagnostic identification budget. This is NOT automatically a
          # theorem unless the reference source confirms the expected formulas.
          rels=[
            c["v1"]["vs_sqrtw_exp_plus"]["relative"],
            c["v1"]["vs_sqrtw_exp_minus"]["relative"],
            c["v2"]["vs_sqrtw_exp_plus"]["relative"],
            c["v2"]["vs_sqrtw_exp_minus"]["relative"]
          ]
          best_pair=min(
            max(rels[0],rels[3]),
            max(rels[1],rels[2])
          )

          out={"same_grid_kernel_difference_2norm":eta_kernel,
               "best_constraint_sample_relative_mismatch":best_pair,
               "finite_projector_algebra_error":p["projector_equivalence_2norm"],
               "exact_identification_proved":False}
          with open("v20-identification-budget.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Decide whether identification can be promoted
        run: |
          python - <<'PY'
          import json

          with open("v20-identification-budget.json") as f:b=json.load(f)
          with open("v20-reference-source.json") as f:s=json.load(f)

          # Promotion is intentionally strict. Numerical equality alone is not
          # enough. V20 only marks exact identification if both discrepancies
          # are essentially machine-zero; otherwise it reports a perturbation
          # target for V21.
          tiny_kernel=b["same_grid_kernel_difference_2norm"]<1e-10
          tiny_constraints=b["best_constraint_sample_relative_mismatch"]<1e-10
          tiny_projector=b["finite_projector_algebra_error"]<1e-10

          promoted=bool(tiny_kernel and tiny_constraints and tiny_projector)
          status=("IDENTIFICATION_NUMERICALLY_EXACT_SOURCE_LEMMA_REQUIRED"
                  if promoted else
                  "FINITE_TO_COMMON_SPACE_PERTURBATION_BOUND_REQUIRED")

          out={"row":326,"numeric_identification_passes":promoted,
               "continuum_certified":False,"status":status,
               "kernel_same_grid_2norm":b["same_grid_kernel_difference_2norm"],
               "constraint_relative_mismatch":b["best_constraint_sample_relative_mismatch"],
               "projector_algebra_error":b["finite_projector_algebra_error"],
               "next_requirement":
                 "derive source-level algebraic identity if discrepancies are zero; otherwise rigorously bound the measured finite/common-space mismatch"}
          with open("v20-decision.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("FAIL-CLOSED: continuum_certified=false")
          PY

      - name: Write V20 ledger
        run: |
          cat > V20-LEDGER.txt <<'EOF'
          V20 — IDENTIFICATION LEMMA AUDIT, ROW 326

          PURPOSE
          -------
          V17 bounded a common-space interpolation approximation to the
          continuum operator. V19 certified the numerical behavior of the
          reference finite matrix. Those two objects must not be identified
          without proof.

          V20 therefore:

          1. captures the exact source of build_operator and profile_operator;
          2. reconstructs the analytic Fourier kernel of the row-326 profile;
          3. constructs the weighted Nyström matrix
                 B_ij = sqrt(w_i w_j) k(u_i-u_j);
          4. compares it with the reference profile_operator matrix;
          5. identifies v1,v2 against weighted samples of exp(+u/2),exp(-u/2);
          6. verifies that null_space compression equals the finite orthogonal
             complement projector algebraically up to numerical roundoff.

          PROMOTION RULE
          --------------
          Even if every numerical discrepancy is at machine precision, V20
          does not declare continuum_certified=true. Numerical agreement is
          evidence for the identification lemma, not its proof.

          If the formulas match, V21 should turn the source-level formulas into
          an explicit algebraic lemma and remove the remaining implementation
          ambiguity. If they do not match, V21 must bound the discrepancy.

          continuum_certified=false.
          NO T1/RH PROOF CLAIM IS MADE.
          EOF

      - name: Upload V20 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v20-identification-row326
          path: |
            v20-reference-source.json
            v20-input.json
            v20-nystrom-structure.json
            v20-analytic-kernel.json
            v20-reference-vs-analytic.json
            v20-constraint-identification.json
            v20-projector-equivalence.json
            v20-identification-budget.json
            v20-decision.json
            V20-LEDGER.txt