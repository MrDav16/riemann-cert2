name: T1 L040 V25 Extract Minimal Dual Certificate

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  extract-dual:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install numpy==2.5.3 scipy==1.18.1 mpmath==1.4.1

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Patch instrumented V25 extractor
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          cat > v25_extract.py <<'PY'
          import json, numpy as np
          from scipy.optimize import linprog
          from scipy.sparse.linalg import eigsh
          from itertools import combinations

          from sharp_floor import Omega, build_operator, LOG2
          from sigma_lp import sigma_pair_vals, project_constraints
          from sigma_rich import rich_centers
          from sigma_t1 import omega_w, S2L2
          from sigma_t1b import profile_operator, lam_max_profile, clusters_of, tent

          L=.4; N=1200; Rmax=22.; dR=.25; dr=.05; rounds=14
          thetas=(.1,.2,.35,.5,.75,1.,1.5,2.,3.,4.)

          u,w,v1,v2,K=build_operator(L,N)
          nI=len(u)
          r=np.arange(0.,Rmax+1e-9,dr)
          cost=np.array([omega_w(x) for x in r])
          tail=float(Omega(Rmax)-S2L2)

          rows=[];caps=[];meta=[];band_ops={}

          def add(sig,cap,kind,label,extra=None):
              j=len(rows)
              rows.append(np.asarray(sig,float))
              caps.append(float(cap))
              d={"index":j,"kind":kind,"label":label,"cap":float(cap)}
              if extra:d.update(extra)
              meta.append(d)

          def band_op(R):
              if R not in band_ops:
                  KR,_=K(R)
                  band_ops[R]=project_constraints(KR,v1,v2)
              return band_ops[R]

          # Indicator caps.
          for R in np.arange(dR,Rmax+1e-9,dR):
              RR=round(float(R),6)
              A=band_op(RR)
              lam=min(1.,float(np.max(eigsh(A,k=6,which="LA",return_eigenvectors=False))))
              add((r<=R+1e-12).astype(float),lam,"indicator",f"ind_{R:.2f}",{"R":float(R)})

          # Fejer dictionary.
          for cc in rich_centers():
              for a in (1.5,3.,6.):
                  sig=sigma_pair_vals(r,cc,a)
                  lam=lam_max_profile(sig,r,u,w,v1,v2)
                  add(sig,lam,"fejer",f"fejer_c{cc:.6g}_a{a:.6g}",
                      {"center":float(cc),"width":float(a)})

          # Cosine-modulated caps.
          for cc in (7.,8.,9.,10.,12.,17.,18.,19.):
              for sgn in (1.,-1.):
                  sig=sigma_pair_vals(r,cc,3.)*(1.+sgn*np.cos(r*LOG2))
                  lam=lam_max_profile(sig,r,u,w,v1,v2)
                  add(sig,lam,"cos_mod",f"cos_c{cc:g}_sgn{sgn:+g}",
                      {"center":cc,"sign":sgn,"width":3.})

          sig=np.clip(1.-r/21.,0.,None)*(1.+np.cos(r*LOG2))
          add(sig,lam_max_profile(sig,r,u,w,v1,v2),"cos_taper","cos_taper_plus")
          sig=np.clip(1.-r/21.,0.,None)*(1.-np.cos(r*LOG2))
          add(sig,lam_max_profile(sig,r,u,w,v1,v2),"cos_taper","cos_taper_minus")

          def solve():
              A=np.vstack(rows+[np.ones_like(r)])
              b=np.array(caps+[1.])
              res=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
              if not res.success: raise RuntimeError(res.message)
              return res

          res=solve()

          # Oracle rows.
          for cor in (.05,.15,.30,.60):
              sig=np.maximum(cor-cost,0.)
              add(sig,lam_max_profile(sig,r,u,w,v1,v2),
                  "oracle",f"oracle_{cor:g}",{"c_oracle":cor})
          res=solve()

          Ppole=np.eye(nI)
          for v in (v1,v2):Ppole-=np.outer(v,v)

          round_history=[]
          stalls=0
          val=float(res.fun+tail)

          for rd in range(1,rounds+1):
              x=res.x
              cl=sorted(clusters_of(x,r),key=lambda t:-t[2])
              if not cl:break
              before=len(rows)

              unions=[cl[:k] for k in range(2,len(cl)+1)]
              unions += [list(p) for p in combinations(cl[:4],2)]
              for ui,un in enumerate(unions):
                  sig=np.zeros_like(r)
                  for lo,hi,m in un:sig=np.maximum(sig,tent(r,lo,hi))
                  add(sig,lam_max_profile(sig,r,u,w,v1,v2),
                      "union",f"r{rd}_union_{ui}",
                      {"round":rd,"slots":[[float(a),float(b),float(m)] for a,b,m in un]})

              for si,(lo,hi,mass) in enumerate(cl[:4]):
                  if mass<.05:continue
                  sb=tent(r,lo,hi)
                  Kb=profile_operator(sb,r,u,w,v1,v2)
                  cut=hi+2.
                  if cut<Rmax-1.:
                      Rc=round(float(np.ceil(cut/dR)*dR),6)
                      Bc=band_op(Rc)
                      for th in thetas:
                          A=Kb-th*(Ppole-Bc)
                          lam=float(np.max(eigsh(A,k=6,which="LA",return_eigenvectors=False)))
                          add(sb-th*(r>cut).astype(float),lam,
                              "signed_tail",f"r{rd}_slot{si}_tail_th{th:g}",
                              {"round":rd,"slot":[float(lo),float(hi),float(mass)],
                               "theta":th,"cut":float(cut),"band_cap_R":Rc})
                  swide=tent(r,max(lo-2.,0.),min(hi+2.,Rmax))
                  Kw=profile_operator(swide,r,u,w,v1,v2)
                  for th in thetas:
                      A=Kb-th*(Ppole-Kw)
                      lam=float(np.max(eigsh(A,k=6,which="LA",return_eigenvectors=False)))
                      add(sb-th*(1.-swide),lam,
                          "signed_wide",f"r{rd}_slot{si}_wide_th{th:g}",
                          {"round":rd,"slot":[float(lo),float(hi),float(mass)],
                           "theta":th})

              if len(cl)>=2:
                  (lo1,hi1,m1),(lo2,hi2,m2)=cl[0],cl[1]
                  sab=np.maximum(tent(r,lo1,hi1),tent(r,lo2,hi2))
                  Kab=profile_operator(sab,r,u,w,v1,v2)
                  wab=np.maximum(tent(r,max(lo1-2,0),min(hi1+2,Rmax)),
                                 tent(r,max(lo2-2,0),min(hi2+2,Rmax)))
                  Kwab=profile_operator(wab,r,u,w,v1,v2)
                  for th in thetas:
                      A=Kab-th*(Ppole-Kwab)
                      lam=float(np.max(eigsh(A,k=6,which="LA",return_eigenvectors=False)))
                      add(sab-th*(1.-wab),lam,
                          "signed_joint",f"r{rd}_joint_th{th:g}",
                          {"round":rd,"theta":th,
                           "slots":[[float(lo1),float(hi1),float(m1)],
                                    [float(lo2),float(hi2),float(m2)]]})

              res2=solve()
              val2=float(res2.fun+tail)
              round_history.append({"round":rd,"rows_before":before,"rows_after":len(rows),
                                    "value":val2,
                                    "clusters":[[float(a),float(b),float(m)] for a,b,m in cl]})
              stalls=stalls+1 if abs(val2-val)<1e-4 else 0
              val=val2;res=res2
              if stalls>=3 or val>=.03:break

          # HiGHS inequality marginals are derivatives w.r.t. b_ub.
          # For a minimization problem with A x <= b they are <=0.
          # Our nonnegative dual weights are therefore y=-marginal.
          marg=np.asarray(res.ineqlin.marginals,float)
          residual=np.asarray(res.ineqlin.residual,float)
          y=-marg[:-1]
          y_mass=float(-marg[-1])
          tol=1e-9
          active=np.flatnonzero(y>tol)

          # Pointwise dual lower envelope on the sampled r-grid:
          # cost-tail objective has constraints rows*x <= caps and mass<=1.
          # Dual identity gives a lower bound tail - sum y_j cap_j - y_mass
          # provided cost-tail + sum y_j row_j + y_mass >=0 pointwise.
          dual_slack=(cost-tail)+np.sum(
              np.asarray([y[j]*rows[j] for j in range(len(rows))]),axis=0
          )+y_mass

          dual_floor=float(tail-np.dot(y,np.asarray(caps))-y_mass)
          primal_floor=float(res.fun+tail)

          active_rows=[]
          for j in active:
              d=dict(meta[int(j)])
              d.update({"dual_weight":float(y[j]),
                        "constraint_slack":float(residual[j]),
                        "weighted_cap":float(y[j]*caps[j]),
                        "sigma_min":float(np.min(rows[j])),
                        "sigma_max":float(np.max(rows[j]))})
              active_rows.append(d)

          # Save exact active sigma arrays for later batch certification.
          np.savez("../../../v25-active-sigmas.npz",
                   r=r,indices=active.astype(int),
                   sigmas=np.asarray([rows[j] for j in active]),
                   caps=np.asarray([caps[j] for j in active]),
                   dual_weights=np.asarray([y[j] for j in active]))

          out={
              "L":L,"N":N,"Rmax":Rmax,"dr":dr,
              "total_dictionary_rows":len(rows),
              "active_cap_count":int(len(active)),
              "active_indices":[int(j) for j in active],
              "mass_dual_weight":y_mass,
              "primal_floor":primal_floor,
              "dual_floor_reconstructed":dual_floor,
              "primal_dual_gap":float(primal_floor-dual_floor),
              "sampled_dual_slack_min":float(np.min(dual_slack)),
              "sampled_dual_slack_max":float(np.max(dual_slack)),
              "active_rows":active_rows,
              "round_history":round_history
          }
          with open("../../../v25-dual-certificate.json","w") as f:
              json.dump(out,f,indent=2)

          # Human-readable table.
          with open("../../../V25-ACTIVE-CAPS.txt","w") as f:
              f.write("V25 MINIMAL DUAL SUPPORT - L=0.40\n\n")
              f.write(f"primal floor: {primal_floor:.17g}\n")
              f.write(f"dual reconstructed floor: {dual_floor:.17g}\n")
              f.write(f"gap: {primal_floor-dual_floor:.3e}\n")
              f.write(f"dictionary rows: {len(rows)}\n")
              f.write(f"active cap rows (y>1e-9): {len(active)}\n")
              f.write(f"mass dual weight: {y_mass:.17g}\n")
              f.write(f"sampled dual slack min: {np.min(dual_slack):.3e}\n\n")
              f.write("index | y | cap | y*cap | kind | label\n")
              for d in active_rows:
                  f.write(f"{d['index']:5d} | {d['dual_weight']:.12g} | "
                          f"{d['cap']:.12g} | {d['weighted_cap']:.12g} | "
                          f"{d['kind']} | {d['label']}\n")

          print(json.dumps(out,indent=2))

          if primal_floor<=0: raise RuntimeError("pilot LP no longer positive")
          if abs(primal_floor-dual_floor)>1e-7:
              raise RuntimeError("primal/dual reconstruction mismatch")
          if np.min(dual_slack)<-1e-7:
              raise RuntimeError("sampled dual feasibility reconstruction failed")
          if len(active)==0:
              raise RuntimeError("no active cap rows extracted")
          print("V25 MINIMAL DUAL EXTRACTION: PASS")
          PY

      - name: Run V25 extractor
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python v25_extract.py

      - name: Analyze support concentration
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v25-dual-certificate.json"))
          rows=d["active_rows"]
          rows=sorted(rows,key=lambda x:-x["weighted_cap"])
          total=sum(abs(x["weighted_cap"]) for x in rows)
          cum=0.
          summary=[]
          for k,x in enumerate(rows,1):
              cum+=abs(x["weighted_cap"])
              summary.append({"rank":k,"index":x["index"],"kind":x["kind"],
                              "label":x["label"],"dual_weight":x["dual_weight"],
                              "weighted_cap":x["weighted_cap"],
                              "cumulative_abs_weighted_cap_fraction":
                                (cum/total if total else 0.)})
          out={"active_count":len(rows),"ranked_active_rows":summary}
          open("v25-support-ranking.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Fail-closed V25 decision
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v25-dual-certificate.json"))
          decision={
            "stage":"V25",
            "T1_certified":False,
            "continuum_caps_certified":False,
            "active_cap_count":d["active_cap_count"],
            "active_indices":d["active_indices"],
            "status":"MINIMAL_DUAL_SUPPORT_EXTRACTED",
            "next_requirement":
              "certify ValidCap for every active row, then certify pointwise dual feasibility off-grid and Parseval/integrability hypotheses"
          }
          open("v25-decision.json","w").write(json.dumps(decision,indent=2))
          print(json.dumps(decision,indent=2))
          PY

      - name: Write V25 ledger
        run: |
          cat > V25-LEDGER.txt <<'EOF'
          V25 — MINIMAL DUAL CERTIFICATE EXTRACTION

          Purpose:
          determine which dictionary caps actually carry nonzero dual weight
          in the final L=0.40 sigma-LP certificate.

          Why:
          T1_of_certificate requires ValidCap for every row used by the dual
          certificate, not merely row 326. Rows with zero dual weight can be
          omitted from a reduced certificate.

          Method:
          reproduce sigma_t1c's dictionary/cutting-plane construction while
          retaining metadata for every generated row. Solve the final HiGHS LP,
          extract inequality marginals, and convert them to nonnegative dual
          weights y=-marginal. Reconstruct the dual floor and sampled pointwise
          feasibility as consistency checks.

          Outputs:
          - exact list of active row indices and metadata;
          - dual weights and weighted caps;
          - exact active sigma arrays on the r-grid;
          - primal/dual consistency diagnostics;
          - support-concentration ranking.

          Important:
          V25 is extraction only. It does NOT certify T1 and does NOT claim that
          sampled dual feasibility implies continuum pointwise feasibility.

          NO RH PROOF CLAIM IS MADE.
          EOF

      - name: Hash V25 evidence
        run: |
          sha256sum \
            v25-dual-certificate.json \
            v25-active-sigmas.npz \
            v25-support-ranking.json \
            v25-decision.json \
            V25-ACTIVE-CAPS.txt \
            V25-LEDGER.txt \
            > V25-MANIFEST.sha256
          sha256sum -c V25-MANIFEST.sha256

      - name: Upload V25 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v25-minimal-dual
          path: |
            v25-dual-certificate.json
            v25-active-sigmas.npz
            v25-support-ranking.json
            v25-decision.json
            V25-ACTIVE-CAPS.txt
            V25-LEDGER.txt
            V25-MANIFEST.sha256