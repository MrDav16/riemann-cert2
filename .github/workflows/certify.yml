name: T1 L040 V16.1 Rank2 Projector Perturbation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rank2-projector:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Extract row 326 and operator scale
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run

          L=.40; N=1200; ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])
          A=np.vstack(rows+[np.ones_like(r)])
          b=np.concatenate([caps,[1.]])
          lp=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          dual=-np.asarray(lp.ineqlin.marginals[:-1],float)

          sig=rows[ROW]; theta=abs(float(sig.min())); c=sig+theta
          # Positive convolution operator norm is safely bounded by k(0)*2L
          # via Schur, with k(0)=1/pi int c(r)dr.
          integral=float(np.trapezoid(c,r))
          B_schur=2*L*integral/np.pi

          out={"L":L,"row":ROW,"pilot":float(val),"cap":float(caps[ROW]),
               "dual":float(dual[ROW]),"theta":theta,
               "B_schur_old_r_quadrature":B_schur}
          with open("../../../v16-input.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Exact continuous Gram matrix with Arb
        run: |
          python - <<'PY'
          import json
          from flint import arb,ctx
          ctx.prec=192
          with open("v16-input.json") as f:d=json.load(f)
          L=arb(str(d["L"]))

          # Constraint columns g1=e^(u/2), g2=e^(-u/2).
          # Continuous Gram:
          # <g1,g1> = int e^u du = 2 sinh(L)
          # <g2,g2> = same
          # <g1,g2> = int 1 du = 2L.
          a=2*L.sinh(); b=2*L
          det=a*a-b*b
          # python-flint 0.9 arb has no is_positive() method.
          # The exact identity det = 4*(sinh(L)^2-L^2) is positive for L>0.
          # Here L=0.4 is fixed; also record a high-precision midpoint check.
          det_mid=float(det.mid())
          if det_mid <= 0:
              raise RuntimeError("Gram determinant midpoint not positive")

          # Eigenvalues for [[a,b],[b,a]].
          lam_min=a-b; lam_max=a+b
          out={"a":str(a),"b":str(b),"det":str(det),
               "lambda_min":str(lam_min),"lambda_max":str(lam_max)}
          with open("v16-continuous-gram.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("CONTINUOUS GRAM: PASS")
          PY

      - name: Rigorous trapezoid Gram error bound
        run: |
          python - <<'PY'
          import json,math
          with open("v16-input.json") as f:d=json.load(f)
          L=float(d["L"]); length=2*L

          # Composite trapezoid:
          # |I-T| <= length*h^2/12 sup|f''|.
          # Gram entries use e^u, e^-u, 1.
          sup2=math.exp(L)
          out={"N":{}}
          for N in [20,40,60,80,100,150,200,300,400,600,800,1200]:
              h=length/(N-1)
              e_diag=length*h*h*sup2/12
              # off diagonal is integral of 1 and trapezoid is exact.
              # Spectral norm of error diag(e1,e2) <= max entry bound.
              gram_op=e_diag
              out["N"][str(N)]={"h":h,"diag_entry_error_bound":e_diag,
                                "gram_operator_error_bound":gram_op}
              print(N,out["N"][str(N)])
          with open("v16-gram-error.json","w") as f:json.dump(out,f,indent=2)
          print("GRAM ERROR: PASS")
          PY

      - name: Projector perturbation bound
        run: |
          python - <<'PY'
          import json,math
          with open("v16-input.json") as f:d=json.load(f)
          with open("v16-gram-error.json") as f:g=json.load(f)
          L=float(d["L"])
          # Continuous synthesis T: R^2 -> L2 has ||T||=sqrt(lambda_max(G)).
          a=2*math.sinh(L); b=2*L
          lmin=a-b; lmax=a+b
          if lmin<=0: raise RuntimeError("bad continuous Gram")

          out={"lambda_min_continuous_gram":lmin,
               "lambda_max_continuous_gram":lmax,"N":{}}

          # We use a conservative subspace/projector perturbation proxy.
          # If the Gram perturbation eta < lmin/2, the discrete constraint
          # system remains uniformly independent. The normalized synthesis
          # perturbation is budgeted by delta=sqrt(eta), and
          #
          # ||P-P_N|| <= 2 delta / (sqrt(lmin)-delta)
          #
          # is recorded as a conservative engineering bound. V16.1 remains
          # fail-closed: V17 must replace/verify this proxy with a formally
          # stated Hilbert-space sampling/interpolation theorem before it can
          # be called a continuum certificate.
          for N,x in g["N"].items():
              eta=x["gram_operator_error_bound"]
              delta=math.sqrt(eta)
              denom=math.sqrt(lmin)-delta
              pp=float("inf") if denom<=0 else 2*delta/denom
              out["N"][N]={"eta":eta,"delta_proxy":delta,
                           "projector_error_proxy":pp,
                           "stable":eta<lmin/2}
              print(N,out["N"][N])
          with open("v16-projector-bound.json","w") as f:json.dump(out,f,indent=2)
          print("PROJECTOR PERTURBATION PROXY: PASS")
          PY

      - name: Combine kernel and projector budgets
        run: |
          python - <<'PY'
          import json,math
          with open("v16-input.json") as f:d=json.load(f)
          with open("v16-projector-bound.json") as f:p=json.load(f)
          L=float(d["L"]); target=0.009985144429060205

          # Reuse exact-profile M2/pi from V15 value.
          K2=37.407263223336415
          # Safe scale for B: use a generous 1.0 upper bound, larger than
          # the observed Schur scale. This avoids depending on a tight float.
          Bnorm=1.0
          out={"target":target,"Bnorm_budget":Bnorm,"N":{}}

          for N in [20,40,60,80,100,150,200,300,400,600,800,1200]:
              h=2*L/(N-1)
              kernel=2*L*(h*h*K2/8)
              pp=p["N"][str(N)]["projector_error_proxy"]

              # For orthogonal projections P,Q:
              # ||PBP-QBQ|| <= 2 ||B|| ||P-Q||,
              # plus kernel discretization.
              proj=2*Bnorm*pp
              total=kernel+proj
              out["N"][str(N)]={"kernel_error":kernel,
                                "projector_proxy_contribution":proj,
                                "combined_proxy":total,
                                "beats_target":bool(total<target)}
              print(N,out["N"][str(N)])

          viable=[n for n,x in out["N"].items() if x["beats_target"]]
          out["first_tested_proxy_viable_N"]=int(viable[0]) if viable else None
          with open("v16-combined-budget.json","w") as f:json.dump(out,f,indent=2)
          print("FIRST PROXY-VIABLE N",out["first_tested_proxy_viable_N"])
          PY

      - name: Direct numerical projector sanity check
        run: |
          python - <<'PY'
          import json,numpy as np
          L=.4
          out={}
          # Compare discrete Gram against exact continuous Gram.
          G=np.array([[2*np.sinh(L),2*L],[2*L,2*np.sinh(L)]])
          for N in [20,40,80,100,200,400,800,1200]:
              u=np.linspace(-L,L,N); h=u[1]-u[0]
              w=np.full(N,h);w[0]*=.5;w[-1]*=.5
              X=np.column_stack([np.exp(u/2),np.exp(-u/2)])
              Gn=X.T@(w[:,None]*X)
              err=float(np.linalg.norm(Gn-G,2))
              out[str(N)]={"actual_gram_error":err}
              print(N,err)
          with open("v16-numerical-sanity.json","w") as f:json.dump(out,f,indent=2)
          print("NUMERICAL SANITY ONLY: PASS")
          PY

      - name: Fail-closed decision
        run: |
          python - <<'PY'
          import json
          with open("v16-combined-budget.json") as f:c=json.load(f)
          n=c["first_tested_proxy_viable_N"]
          decision={
            "row":326,
            "continuum_certified":False,
            "status":"PROJECTOR_PROXY_QUANTIFIED",
            "proxy_viable_N":n,
            "V14_target":c["target"],
            "meaning":"V16 quantifies the rank-2 Gram/projector scale and tests whether a conservative proxy fits the remaining error budget.",
            "remaining_gap":[
              "replace projector proxy by a formally proved continuous-to-discrete subspace theorem",
              "certify the finite spectral upper bound with interval arithmetic",
              "combine theorem-level projector and kernel errors"
            ]
          }
          with open("v16-decision.json","w") as f:json.dump(decision,f,indent=2)
          print(json.dumps(decision,indent=2))
          print("FAIL-CLOSED: continuum_certified=false")
          PY

      - name: Write ledger
        run: |
          cat > V16-LEDGER.txt <<'EOF'
          V16.1 — RANK-2 PROJECTOR PERTURBATION

          Continuous pole constraints:
              g1(u)=exp(u/2), g2(u)=exp(-u/2).

          Their exact continuous Gram matrix is
              [[2 sinh(L), 2L],
               [2L,       2 sinh(L)]].

          V16.1 rigorously bounds composite-trapezoid errors in these Gram
          entries and quantifies the conditioning of the 2D constraint space.

          It then evaluates a conservative projector perturbation proxy and
          combines it with the V15 unprojected kernel error budget.

          IMPORTANT:
          the proxy is not promoted to a theorem. A formal Hilbert-space
          sampling/interpolation subspace perturbation result is still needed
          before ||P-P_N|| can be called rigorously certified.

          Therefore continuum_certified=false.
          NO T1/RH PROOF CLAIM IS MADE.
          EOF

      - name: Upload V16.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v161-rank2-projector
          path: |
            v16-input.json
            v16-continuous-gram.json
            v16-gram-error.json
            v16-projector-bound.json
            v16-combined-budget.json
            v16-numerical-sanity.json
            v16-decision.json
            V16-LEDGER.txt