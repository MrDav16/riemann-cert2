name: T1 L040 V11 Higher Moment Feasibility

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  higher-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Extract exact active rows and dual
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run
          L=.40; N=1200; targets=[341,326,396]
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])
          A=np.vstack(rows+[np.ones_like(r)])
          b=np.concatenate([caps,[1.]])
          lp=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          y=-np.asarray(lp.ineqlin.marginals[:-1],float)
          out={"pilot":float(val),"r":r.tolist(),"targets":{}}
          for j in targets:
              s=rows[j]; th=abs(float(s.min()))
              out["targets"][str(j)]={"cap":float(caps[j]),"dual":float(y[j]),"theta":th,"sigma":s.tolist()}
              print(j,out["targets"][str(j)]["cap"],out["targets"][str(j)]["dual"],th)
          with open("../../../v11-input.json","w") as f: json.dump(out,f,indent=2)
          PY

      - name: Compute exact shifted spectra and moments
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigvalsh
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          with open("../../../v11-input.json") as f: d=json.load(f)
          r=np.asarray(d["r"],float)
          n=1200
          u,w,v1,v2,K=build_operator(.40,n)
          Q=null_space(np.column_stack([v1,v2]).T)
          ks=[2,4,6,8,10,12,16,20,24,32]
          out={}

          for row,item in d["targets"].items():
              th=float(item["theta"])
              c=np.asarray(item["sigma"],float)+th
              if c.min() < -1e-12: raise RuntimeError("negative shifted profile")
              C=profile_operator(c,r,u,w,v1,v2)
              CV=Q.T@C@Q
              ev=eigvalsh(CV)

              # Numerical PSD check. Tiny roundoff negatives are tolerated,
              # but a material negative eigenvalue invalidates the moment route.
              emin=float(ev[0]); emax=float(ev[-1])
              if emin < -1e-9:
                  raise RuntimeError(f"row {row}: C is not PSD, min={emin}")
              ep=np.maximum(ev,0.0)

              rec={
                  "theta":th,
                  "reference_cap":float(item["cap"]),
                  "lambda_C":emax,
                  "lambda_C_minus_theta":emax-th,
                  "min_eigenvalue":emin,
                  "moments":{}
              }

              for k in ks:
                  # Stable power-sum computation by scaling with emax.
                  if emax<=0:
                      root=0.0
                  else:
                      root=emax*float(np.sum((ep/emax)**k)**(1.0/k))
                  bound=root-th
                  rec["moments"][str(k)]={
                      "root_trace_Ck":root,
                      "shifted_bound":bound,
                      "inflation":max(bound-float(item["cap"]),0.0)
                  }
                  print("ROW",row,"k",k,"bound",bound,"infl",rec["moments"][str(k)]["inflation"])

              out[row]=rec

          with open("../../../v11-moments.json","w") as f: json.dump(out,f,indent=2,sort_keys=True)
          print("HIGHER MOMENTS: PASS")
          PY

      - name: Compute dual margin by moment order
        run: |
          python - <<'PY'
          import json
          with open("v11-input.json") as f: inp=json.load(f)
          with open("v11-moments.json") as f: mom=json.load(f)

          pilot=float(inp["pilot"])
          ks=[2,4,6,8,10,12,16,20,24,32]
          out={"pilot":pilot,"orders":{}}
          first_viable=None

          for k in ks:
              total=0.; rows={}
              for row in ["341","326","396"]:
                  y=float(inp["targets"][row]["dual"])
                  infl=float(mom[row]["moments"][str(k)]["inflation"])
                  loss=y*infl
                  total+=loss
                  rows[row]={"inflation":infl,"dual_weight":y,"weighted_loss":loss}
              rem=pilot-total
              viable=rem>0
              out["orders"][str(k)]={"total_loss":total,"remaining_margin":rem,"viable":viable,"rows":rows}
              print("k =",k,"loss =",total,"remaining =",rem,"viable =",viable)
              if viable and first_viable is None: first_viable=k

          out["first_viable_order"]=first_viable
          with open("v11-dual-by-order.json","w") as f: json.dump(out,f,indent=2,sort_keys=True)

          print()
          print("FIRST VIABLE ORDER =",first_viable)
          if first_viable is None:
              print("NO TESTED MOMENT ORDER PRESERVES THE PILOT MARGIN.")
          else:
              print("HIGHER-MOMENT ROUTE IS NUMERICALLY VIABLE AT k =",first_viable)
          PY

      - name: Cross-n stability at selected orders
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigvalsh
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          with open("../../../v11-input.json") as f: d=json.load(f)
          r=np.asarray(d["r"],float)
          ns=[400,600,800]
          ks=[4,8,12,20]
          out={}

          for n in ns:
              u,w,v1,v2,K=build_operator(.40,n)
              Q=null_space(np.column_stack([v1,v2]).T)
              out[str(n)]={}
              for row,item in d["targets"].items():
                  th=float(item["theta"])
                  c=np.asarray(item["sigma"],float)+th
                  CV=Q.T@profile_operator(c,r,u,w,v1,v2)@Q
                  ev=eigvalsh(CV)
                  ep=np.maximum(ev,0.)
                  emax=float(ev[-1])
                  rr={}
                  for k in ks:
                      root=emax*float(np.sum((ep/emax)**k)**(1/k))
                      rr[str(k)]=root-th
                  out[str(n)][row]=rr
                  print("n",n,"row",row,rr)

          with open("../../../v11-cross-n.json","w") as f: json.dump(out,f,indent=2,sort_keys=True)
          print("CROSS-N AUDIT: PASS")
          PY

      - name: Decision ledger
        run: |
          python - <<'PY'
          import json
          with open("v11-dual-by-order.json") as f: d=json.load(f)
          k=d["first_viable_order"]
          with open("V11-LEDGER.txt","w") as f:
              f.write("V11 — HIGHER MOMENT FEASIBILITY\n\n")
              f.write("For each exact shifted positive finite operator C_j, V11 tests\n")
              f.write("lambda_max(C_j) <= Tr(C_j^k)^(1/k), for even k.\n\n")
              f.write("Pilot margin: %.17g\n" % d["pilot"])
              f.write("First tested viable order: %s\n\n" % str(k))
              for kk,x in d["orders"].items():
                  f.write("k=%s loss=%.17g remaining=%.17g viable=%s\n" %
                          (kk,x["total_loss"],x["remaining_margin"],x["viable"]))
              f.write("\nThis is finite-dimensional numerical feasibility only.\n")
              f.write("It is not a rigorous continuum certificate and not a proof of T1/RH.\n")
              f.write("A viable order must next be converted into rigorously bounded continuum moments,\n")
              f.write("including the constrained-space/rank-2 corrections.\n")
          print(open("V11-LEDGER.txt").read())
          PY

      - name: Upload V11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v11-higher-moments
          path: |
            v11-input.json
            v11-moments.json
            v11-dual-by-order.json
            v11-cross-n.json
            V11-LEDGER.txt