name: T1 L040 V5 Convergence Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = \
            "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Run multi-resolution convergence audit
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from sigma_t1c import run

          L = 0.40

          TARGETS = [341, 326, 396]

          NS = [
              300,
              600,
              1200,
              2400
          ]

          out = {
              "L": L,
              "reference_commit":
                  "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf",
              "targets": TARGETS,
              "runs": []
          }

          for n in NS:

              print()
              print("=" * 78)
              print("RUN n =", n)
              print("=" * 78)

              val, st = run(
                  L,
                  n=n,
                  verbose=True
              )

              caps = np.asarray(
                  st["caps"],
                  dtype=float
              )

              rows = [
                  np.asarray(x, dtype=float)
                  for x in st["rows"]
              ]

              if len(caps) <= max(TARGETS):
                  raise RuntimeError(
                      f"n={n}: insufficient rows "
                      f"({len(caps)})"
                  )

              target_data = {}

              for idx in TARGETS:

                  target_data[
                      str(idx)
                  ] = {
                      "cap":
                          float(caps[idx]),

                      "row_min":
                          float(
                              np.min(rows[idx])
                          ),

                      "row_max":
                          float(
                              np.max(rows[idx])
                          )
                  }

                  print(
                      "target",
                      idx,
                      "cap =",
                      repr(
                          float(caps[idx])
                      )
                  )

              out["runs"].append({
                  "n":
                      n,

                  "pilot_floor":
                      float(val),

                  "row_count":
                      int(len(caps)),

                  "targets":
                      target_data
              })

          print()
          print("=" * 78)
          print("CONVERGENCE TABLE")
          print("=" * 78)

          for idx in TARGETS:

              print()
              print("ROW", idx)

              prev = None

              for run_data in out["runs"]:

                  n = run_data["n"]

                  cap = (
                      run_data["targets"]
                      [str(idx)]
                      ["cap"]
                  )

                  if prev is None:
                      delta = None
                  else:
                      delta = abs(
                          cap - prev
                      )

                  print(
                      f"n={n:5d}",
                      "cap=",
                      f"{cap:.15g}",
                      "delta_prev=",
                      (
                          "-"
                          if delta is None
                          else
                          f"{delta:.6g}"
                      )
                  )

                  prev = cap

          # -----------------------------------------
          # Estimate observed convergence only.
          #
          # This is NOT used as a rigorous bound.
          # -----------------------------------------

          observed = {}

          for idx in TARGETS:

              vals = [
                  x["targets"]
                  [str(idx)]
                  ["cap"]
                  for x in out["runs"]
              ]

              diffs = [
                  abs(
                      vals[i] - vals[i - 1]
                  )
                  for i in range(
                      1,
                      len(vals)
                  )
              ]

              ratios = []

              for i in range(
                  1,
                  len(diffs)
              ):

                  if diffs[i] > 0:
                      ratios.append(
                          diffs[i - 1]
                          / diffs[i]
                      )

              observed[
                  str(idx)
              ] = {
                  "values":
                      vals,

                  "successive_differences":
                      diffs,

                  "difference_ratios":
                      ratios
              }

          out[
              "observed_convergence"
          ] = observed

          with open(
              "../../../v5-convergence.json",
              "w"
          ) as f:

              json.dump(
                  out,
                  f,
                  indent=2,
                  sort_keys=True
              )

          print()
          print(
              "IMPORTANT: convergence is "
              "empirical, not a proof."
          )
          PY

      - name: Compare against error targets
        run: |
          python - <<'PY'
          import json

          with open(
              "v5-convergence.json"
          ) as f:
              d = json.load(f)

          targets = {
              "341":
                  0.0156846161434,

              "326":
                  0.0185525631047,

              "396":
                  0.0479955923013
          }

          print(
              "ENGINEERING TARGET COMPARISON"
          )

          print(
              "(diagnostic only; "
              "NOT rigorous)"
          )

          for row, limit in targets.items():

              diffs = (
                  d[
                      "observed_convergence"
                  ]
                  [row]
                  [
                      "successive_differences"
                  ]
              )

              last = diffs[-1]

              print()
              print(
                  "row",
                  row
              )

              print(
                  "last |cap_2400-cap_1200| =",
                  last
              )

              print(
                  "target delta =",
                  limit
              )

              print(
                  "ratio target/observed =",
                  (
                      limit / last
                      if last > 0
                      else float("inf")
                  )
              )
          PY

      - name: Test projected-HS algebra
        run: |
          python - <<'PY'
          import numpy as np

          rng = np.random.default_rng(
              20260916
          )

          for n in [
              20,
              50,
              100
          ]:

              X = rng.normal(
                  size=(n, n)
              )

              K = (
                  X + X.T
              ) / 2

              U, _ = np.linalg.qr(
                  rng.normal(
                      size=(n, 2)
                  )
              )

              P = (
                  np.eye(n)
                  - U @ U.T
              )

              direct = np.linalg.norm(
                  P @ K @ P,
                  "fro"
              )

              K2 = K @ K

              M = (
                  U.T
                  @ K
                  @ U
              )

              rhs2 = (
                  np.trace(K2)
                  - 2
                  * np.trace(
                      U.T
                      @ K2
                      @ U
                  )
                  + np.trace(
                      M @ M
                  )
              )

              formula = np.sqrt(
                  max(
                      float(rhs2),
                      0.0
                  )
              )

              err = abs(
                  direct - formula
              )

              print(
                  n,
                  direct,
                  formula,
                  err
              )

              if err > 1e-9:
                  raise RuntimeError(
                      "Projected HS identity failed"
                  )

          print(
              "PROJECTED HS ALGEBRA: PASS"
          )
          PY

      - name: Verify Arb precision
        run: |
          python - <<'PY'
          from flint import arb, ctx

          ctx.prec = 192

          x = arb("0.4")

          print(
              "precision bits =",
              ctx.prec
          )

          print(
              "sin(0.4) =",
              x.sin()
          )

          print(
              "ARB 192-BIT: PASS"
          )
          PY

      - name: Write V5 interpretation
        run: |
          cat > V5-STATUS.txt <<'EOF'
          V5 CONVERGENCE AUDIT

          PURPOSE

          Measure finite-dimensional convergence
          of the priority signed spectral caps at

              n = 300, 600, 1200, 2400.

          Priority rows:

              341
              326
              396

          This experiment answers:

          Is the numerical discretization error
          plausibly far below the available dual
          margin?

          IT DOES NOT PROVE THIS.

          A rigorous continuum certificate still
          requires a theorem of the form

              lambda_max(A)
              <=
              lambda_max(A_N)
              + delta_N

          where delta_N is an analytically or
          interval-arithmetically VERIFIED upper
          bound.

          TWO CANDIDATE ROUTES

          Route A:
              Nystrom eigenvalue
              + rigorous quadrature/operator
                perturbation remainder.

          Route B:
              projected Hilbert-Schmidt /
              second-moment upper bound
              + verified one-dimensional
                integrals
              + rank-2 pole corrections.

          V5 is intended to determine which route
          has enough numerical slack before the
          rigorous derivation is implemented.
          EOF

          cat V5-STATUS.txt

      - name: Upload V5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v5-convergence
          path: |
            v5-convergence.json
            V5-STATUS.txt