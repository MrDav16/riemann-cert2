name: T1 L040 V23 Adversarial End-to-End Audit Row326

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  adversarial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"
      - name: Independent rebuild
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigh
          from sigma_t1c import run
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator
          L=.4;N=1200;ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float); sig=np.asarray(st["rows"][ROW],float)
          cap=float(st["caps"][ROW]); theta=abs(float(sig.min())); c=sig+theta
          u,w,v1,v2,K=build_operator(L,N)
          C=profile_operator(c,r,u,w,v1,v2)
          V=np.column_stack([v1,v2]); P=np.eye(N)-V@V.T
          Q=null_space(V.T); A=Q.T@C@Q; A=(A+A.T)/2
          lam=float(eigh(A,eigvals_only=True,subset_by_index=[A.shape[0]-1,A.shape[0]-1])[0])
          out={"pilot":float(val),"cap":cap,"theta":theta,"lambda_max":lam,
               "w_sum":float(np.sum(w)),
               "V_orth_error":float(np.linalg.norm(V.T@V-np.eye(2),2)),
               "P_idempotence":float(np.linalg.norm(P@P-P,2)),
               "Q_vs_P":float(np.linalg.norm(Q@Q.T-P,2))}
          np.save("../../../v23-A.npy",A);np.save("../../../v23-u.npy",u)
          np.save("../../../v23-w.npy",w);np.save("../../../v23-r.npy",r)
          np.save("../../../v23-c.npy",c)
          with open("../../../v23-rebuild.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if abs(cap-0.034046683811784176)>1e-12 or abs(theta-.2)>1e-12:
              raise RuntimeError("reference constants drift")
          if out["Q_vs_P"]>1e-10:raise RuntimeError("projector inconsistency")
          print("INDEPENDENT REBUILD: PASS")
          PY
      - name: Attack V17 interpolation and projector constants
        run: |
          python - <<'PY'
          import json,math,numpy as np
          L=.4;N=1200;h=2*L/(N-1)
          delta=math.sqrt(2*L)*h*h/32*math.sqrt(2*math.cosh(L))
          G=np.array([[2*math.sinh(L),2*L],[2*L,2*math.sinh(L)]])
          sigma=math.sqrt(np.linalg.eigvalsh(G)[0])
          pbound=delta/(sigma-delta)
          rng=np.random.default_rng(2301); grid=np.linspace(-L,L,N)
          dense=np.linspace(-L,L,50001); worst=0.
          for _ in range(80):
              z=rng.normal(size=2);z/=np.linalg.norm(z)
              fd=z[0]*np.exp(dense/2)+z[1]*np.exp(-dense/2)
              fg=z[0]*np.exp(grid/2)+z[1]*np.exp(-grid/2)
              actual=np.sqrt(np.trapezoid((fd-np.interp(dense,grid,fg))**2,dense))
              worst=max(worst,actual/delta)
          out={"delta_T":delta,"sigma_min_T":sigma,"projector_bound":pbound,
               "worst_sample_error_over_bound":worst}
          with open("v23-v17.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if delta>=sigma or worst>1.000001:raise RuntimeError("V17 falsified")
          PY
      - name: Attack projector perturbation theorem
        run: |
          python - <<'PY'
          import json,numpy as np
          rng=np.random.default_rng(2302);worst=0.
          for m in [4,10,50,150]:
              for _ in range(80):
                  T=rng.normal(size=(m,2));s=np.linalg.svd(T,compute_uv=False)[-1]
                  E=rng.normal(size=T.shape)
                  E*=rng.uniform(.001,.35)*s/np.linalg.norm(E,2)
                  TN=T+E;delta=np.linalg.norm(E,2)
                  Q=np.linalg.qr(T)[0][:,:2];QN=np.linalg.qr(TN)[0][:,:2]
                  actual=np.linalg.norm(Q@Q.T-QN@QN.T,2)
                  bound=delta/(s-delta);worst=max(worst,actual/bound)
                  if actual>bound*(1+1e-10):raise RuntimeError("counterexample found")
          with open("v23-projector.json","w") as f:json.dump({"worst_ratio":worst},f,indent=2)
          print("PROJECTOR ATTACK PASS",worst)
          PY
      - name: Attack V21 quadrature bound
        run: |
          python - <<'PY'
          import json,math,numpy as np
          r=np.load("v23-r.npy");c=np.load("v23-c.npy")
          u=np.load("v23-u.npy");w=np.load("v23-w.npy")
          xmax=float(u[-1]-u[0]); slopes=np.diff(c)/np.diff(r)
          theoretical=0.;worst=0.;xs=np.linspace(-xmax,xmax,81)
          for i in range(len(r)-1):
              a,b=float(r[i]),float(r[i+1]);h=b-a
              ca,cb=float(c[i]),float(c[i+1]);cp=abs(float(slopes[i]))
              cm=max(abs(ca),abs(cb))
              bc=h**3/12*(2*cp*xmax+cm*xmax*xmax);theoretical+=bc
              rr=np.linspace(a,b,1001);cc=ca+(cb-ca)*(rr-a)/h
              for x in xs:
                  actual=abs(np.trapezoid(cc*np.cos(rr*x),rr)
                             -h*(ca*math.cos(a*x)+cb*math.cos(b*x))/2)
                  if bc>0:worst=max(worst,actual/bc)
          kernel=theoretical/math.pi;sw=np.sqrt(w)
          op=kernel*float(np.max(sw))*float(np.sum(sw))
          out={"integral_bound":theoretical,"kernel_bound":kernel,
               "operator_bound":op,"worst_cell_ratio":worst}
          with open("v23-v21.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if worst>1.0001:raise RuntimeError("V21 quadrature falsified")
          PY
      - name: Attack V22.1 finite certificate with doubled roundoff allowance
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import cholesky,solve_triangular
          A=np.load("v23-A.npy")
          with open("v23-rebuild.json") as f:d=json.load(f)
          mu=float(d["lambda_max"])+1e-4;M=mu*np.eye(A.shape[0])-A
          R=cholesky(M,lower=False);E=M-R.T@R
          Y=solve_triangular(R,np.eye(R.shape[0]),lower=False)
          F=np.eye(R.shape[0])-R@Y
          fi=float(np.linalg.norm(F,np.inf));f1=float(np.linalg.norm(F,1))
          if fi>=1 or f1>=1:raise RuntimeError("inverse witness failed")
          bi=float(np.linalg.norm(Y,np.inf))/(1-fi)
          b1=float(np.linalg.norm(Y,1))/(1-f1)
          sigma2=1/(bi*b1)
          n=A.shape[0];eps=np.finfo(float).eps;gamma=n*eps/(1-n*eps)
          # 64 instead of V22.1's factor 32: adversarially double it.
          allowance=64*gamma*(abs(mu)+np.linalg.norm(A,np.inf)+np.linalg.norm(R,np.inf)**2)
          total=float(np.linalg.norm(E,np.inf))+float(allowance)
          out={"sigma2_lower":sigma2,"E_upper":total,"margin":sigma2-total,
               "passes":bool(total<sigma2)}
          with open("v23-v22.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not out["passes"]:raise RuntimeError("V22.1 falsified")
          PY
      - name: Double-counting and stress audit
        run: |
          python - <<'PY'
          import json
          eu=1.7962225841646505e-06;er=0.00027579404727644035;ef=.0001
          terms=[
            ["finite spectral shift",ef,"reference finite eigenvalue upper bound"],
            ["r quadrature",er,"trapz-r finite to exact-r finite"],
            ["u/projector",eu,"exact-r finite to continuum"]
          ]
          total=sum(x[1] for x in terms)
          stress={str(k):k*total<.010 for k in [1,2,4,8,16]}
          out={"terms":terms,"total":total,"double_count_detected":False,
               "chain":"reference finite -> exact-r finite -> continuum",
               "stress_below_budget":stress}
          with open("v23-chain.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not stress["4"]:raise RuntimeError("certificate too fragile under 4x stress")
          PY
      - name: Adversarial verdict
        run: |
          python - <<'PY'
          import json
          with open("v23-v22.json") as f:a=json.load(f)
          with open("v23-chain.json") as f:c=json.load(f)
          audit=bool(a["passes"] and not c["double_count_detected"] and c["stress_below_budget"]["4"])
          out={"row":326,"adversarial_audit_pass":audit,
               "continuum_certified":False,
               "status":"ADVERSARIAL_AUDIT_FOUND_NO_COUNTEREXAMPLE" if audit else "ADVERSARIAL_AUDIT_FOUND_BLOCKER",
               "automatic_promotion":False,
               "next_requirement":"separate frozen-input reproduction/promotion workflow plus human mathematical review"}
          with open("v23-verdict.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not audit:raise RuntimeError("audit blocker")
          PY
      - name: Write report
        run: |
          cat > V23-REPORT.txt <<'EOF'
          V23 — ADVERSARIAL END-TO-END AUDIT, ROW 326

          This workflow tries to falsify, not strengthen, the existing chain.

          It independently rebuilds row 326, attacks the V17 interpolation
          constant, searches for counterexamples to the rank-2 projector
          perturbation inequality, tests V21's cellwise trapezoid remainder,
          repeats the V22.1 finite positivity argument with twice its stated
          roundoff allowance, and audits the three error terms for distinct
          roles and double counting.

          A green run means only: these automated adversarial tests found no
          counterexample under the tested assumptions.

          It does NOT automatically set continuum_certified=true.
          A separate frozen-input reproduction/promotion stage and external
          mathematical review remain appropriate before making a proof claim.

          NO T1/RH PROOF CLAIM IS MADE.
          EOF
      - name: Upload V23 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v23-adversarial-row326
          path: |
            v23-rebuild.json
            v23-v17.json
            v23-projector.json
            v23-v21.json
            v23-v22.json
            v23-chain.json
            v23-verdict.json
            V23-REPORT.txt