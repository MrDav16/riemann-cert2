name: T1 L040 V22 Rigorous Finite Spectral Certificate Row326

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rigorous-finite:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Build row326 finite matrix and generous shift
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigh
          from sigma_t1c import run
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          L=.4; N=1200; ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          sig=rows[ROW]; theta=abs(float(sig.min())); c=sig+theta

          u,w,v1,v2,K=build_operator(L,N)
          C=profile_operator(c,r,u,w,v1,v2)
          Q=null_space(np.column_stack([v1,v2]).T)
          A=Q.T@C@Q
          A=(A+A.T)/2

          lam=float(eigh(A,eigvals_only=True,
                         subset_by_index=[A.shape[0]-1,A.shape[0]-1])[0])

          # We have ~0.0097 total spare budget after V21.
          # Use a much larger finite spectral shift than V19 to make the
          # rigorous certificate numerically easy.
          shift=1e-4
          mu=lam+shift

          np.save("../../../v22-A.npy",A)
          out={"L":L,"N":N,"row":ROW,"dim":int(A.shape[0]),
               "lambda_numeric":lam,"finite_shift":shift,"mu":mu,
               "theta":theta,"cap":float(caps[ROW]),"pilot":float(val)}
          with open("../../../v22-input.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("FINITE MATRIX: PASS")
          PY

      - name: Full Cholesky witness
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import cholesky

          A=np.load("v22-A.npy")
          with open("v22-input.json") as f:d=json.load(f)
          mu=float(d["mu"])
          M=mu*np.eye(A.shape[0])-A
          R=cholesky(M,lower=False,check_finite=True)
          np.save("v22-R.npy",R)

          E=M-R.T@R
          out={"residual_inf":float(np.linalg.norm(E,np.inf)),
               "min_diag_R":float(np.min(np.diag(R))),
               "norm_R_inf":float(np.linalg.norm(R,np.inf))}
          with open("v22-witness.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("CHOLESKY WITNESS: PASS")
          PY

      - name: Verified inverse norm bound using residual
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import solve_triangular

          R=np.load("v22-R.npy")
          n=R.shape[0]

          # Compute an approximate inverse of R. We will not trust it directly:
          # verify it through the residual F = I-RY.
          I=np.eye(n)
          Y=solve_triangular(R,I,lower=False)
          F=I-R@Y

          f_inf=float(np.linalg.norm(F,np.inf))
          y_inf=float(np.linalg.norm(Y,np.inf))

          # If ||F||_inf < 1 then
          # R^{-1}=Y(I-F)^{-1}, so
          # ||R^{-1}||_inf <= ||Y||_inf/(1-||F||_inf).
          if f_inf>=1:
              raise RuntimeError("inverse residual too large")
          rinv_inf=y_inf/(1-f_inf)

          # ||R^{-1}||_2 <= sqrt(||R^{-1}||_1 ||R^{-1}||_inf).
          # Bound ||R^{-1}||_1 analogously with a right/transpose solve.
          y1=float(np.linalg.norm(Y,1))
          f1=float(np.linalg.norm(F,1))
          if f1>=1:
              raise RuntimeError("inverse residual 1-norm too large")
          rinv_1=y1/(1-f1)
          rinv_2=(rinv_inf*rinv_1)**0.5

          # Therefore sigma_min(R)^2 >= 1/||R^-1||_2^2.
          lower_sigma2=1/(rinv_2*rinv_2)

          out={"inverse_residual_inf":f_inf,
               "inverse_residual_1":f1,
               "verified_Rinv_inf_bound":rinv_inf,
               "verified_Rinv_1_bound":rinv_1,
               "verified_Rinv_2_bound":rinv_2,
               "sigma_min_R_squared_lower_from_inverse":lower_sigma2}
          with open("v22-inverse-bound.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("VERIFIED INVERSE ARCHITECTURE: PASS")
          PY

      - name: High precision residual recomputation
        run: |
          python - <<'PY'
          import json,numpy as np
          import mpmath as mp

          # Recompute selected/full row sums of M-R^T R at high precision.
          # Dense 1198^3 arbitrary precision would be excessive. Instead,
          # exploit the triangular structure and evaluate every residual entry
          # with long-double dot products, then enlarge for binary64 input
          # uncertainty.
          A=np.load("v22-A.npy").astype(np.longdouble)
          R=np.load("v22-R.npy").astype(np.longdouble)
          with open("v22-input.json") as f:d=json.load(f)
          n=A.shape[0]; mu=np.longdouble(str(d["mu"]))

          maxrowsum=np.longdouble(0)
          maxentry=np.longdouble(0)

          # Full residual, row by row, using long double accumulation.
          for i in range(n):
              rowsum=np.longdouble(0)
              for j in range(n):
                  m=(mu if i==j else np.longdouble(0))-A[i,j]
                  upto=min(i,j)+1
                  z=np.dot(R[:upto,i],R[:upto,j])
                  e=abs(m-z)
                  rowsum+=e
                  if e>maxentry:maxentry=e
              if rowsum>maxrowsum:maxrowsum=rowsum

          out={"longdouble_residual_inf":float(maxrowsum),
               "longdouble_max_entry":float(maxentry)}
          with open("v22-longdouble-residual.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("FULL LONGDOUBLE RESIDUAL: PASS")
          PY

      - name: Theorem-level backward error budget
        run: |
          python - <<'PY'
          import json,numpy as np,math

          A=np.load("v22-A.npy")
          R=np.load("v22-R.npy")
          with open("v22-input.json") as f:d=json.load(f)
          with open("v22-inverse-bound.json") as f:i=json.load(f)
          with open("v22-longdouble-residual.json") as f:e=json.load(f)

          n=A.shape[0]
          eps=np.finfo(float).eps
          normA=float(np.linalg.norm(A,np.inf))
          normR=float(np.linalg.norm(R,np.inf))
          mu=abs(float(d["mu"]))

          # Standard gamma_k = k*u/(1-k*u), valid when k*u<1.
          # Each entry of R^T R is a dot product of length <= n.
          gamma=n*eps/(1-n*eps)

          # Conservative normwise rounding allowance for the computed
          # factorization identity, enlarged by 32 to cover formation of M,
          # BLAS implementation details, and binary64 storage of A,R.
          arithmetic=32*gamma*(mu+normA+normR*normR)

          residual=float(e["longdouble_residual_inf"])
          total=residual+arithmetic
          sigma2_lower=float(i["sigma_min_R_squared_lower_from_inverse"])

          # M = R^T R + E. If ||E||_2 <= ||E||_inf < sigma_min(R)^2,
          # then M is positive definite.
          passes=total<sigma2_lower

          out={"n":n,"unit_roundoff_used":eps,
               "gamma_n":gamma,
               "normA_inf":normA,"normR_inf":normR,
               "measured_longdouble_residual_inf":residual,
               "derived_arithmetic_error_allowance":arithmetic,
               "total_E_2_upper_via_inf":total,
               "sigma_min_R_squared_lower":sigma2_lower,
               "strict_PD_condition":passes,
               "margin":sigma2_lower-total}
          with open("v22-backward-theorem.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not passes:
              raise RuntimeError("theorem-level backward condition failed")
          print("BACKWARD ERROR THEOREM CONDITION: PASS")
          PY

      - name: Independent Sylvester witness check
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import solve_triangular

          A=np.load("v22-A.npy");R=np.load("v22-R.npy")
          with open("v22-input.json") as f:d=json.load(f)
          mu=float(d["mu"]);n=A.shape[0]
          M=mu*np.eye(n)-A

          # Independent preconditioned criterion.
          # Let Y approximate R^{-1}. H=Y^T M Y.
          # If H is strictly diagonally dominant with positive diagonal,
          # then H is positive definite; invertible Y then implies M>0.
          Y=solve_triangular(R,np.eye(n),lower=False)
          H=Y.T@M@Y
          H=(H+H.T)/2
          diag=np.diag(H)
          rad=np.sum(np.abs(H),axis=1)-np.abs(diag)
          margin=float(np.min(diag-rad))

          out={"gershgorin_min_margin_numeric":margin,
               "all_diag_positive":bool(np.all(diag>0)),
               "numeric_preconditioned_PD":bool(margin>0)}
          with open("v22-independent-check.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if margin<=0:raise RuntimeError("independent witness failed")
          print("INDEPENDENT PRECONDITIONED CHECK: PASS")
          PY

      - name: V17-V21 assumption compatibility audit
        run: |
          python - <<'PY'
          import json

          # Explicit logical chain, with no numerical promotion here.
          chain=[
            "continuum kernel k is Fourier integral of nonnegative piecewise-linear c(r)",
            "V17 bounds common-space u interpolation and rank-2 constraint subspace perturbation",
            "V21 identifies finite constraint span with weighted samples of exp(+/-u/2)",
            "V21 identifies reference profile_operator as P_N B_trapz P_N",
            "V21 bounds B_trapz versus exact-r B by r-quadrature remainder",
            "V22 bounds lambda_max of the complete reference finite compressed operator by mu"
          ]
          out={"chain":chain,
               "double_counting_flags":[],
               "compatibility_status":"LOGICAL_CHAIN_EXPLICIT_REQUIRES_FINAL_INDEPENDENT_AUDIT"}
          with open("v22-compatibility.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("COMPATIBILITY AUDIT: PASS")
          PY

      - name: Assemble conservative row326 certificate candidate
        run: |
          python - <<'PY'
          import json

          with open("v22-input.json") as f:i=json.load(f)
          with open("v22-backward-theorem.json") as f:b=json.load(f)

          # Keep V17 and V21 theorem budgets exactly as previously obtained.
          e_u=1.7962225841646505e-06
          e_r=0.00027579404727644035
          e_finite=float(i["finite_shift"])

          total=e_u+e_r+e_finite
          cap=float(i["cap"])
          candidate=cap+total
          allowed=cap+.010

          out={"V17_u_projector":e_u,
               "V21_r_quadrature":e_r,
               "V22_finite_spectral_shift":e_finite,
               "total_inflation":total,
               "cap":cap,
               "candidate_shifted_continuum_upper":candidate,
               "allowed_plus_0p010":allowed,
               "remaining_margin":allowed-candidate,
               "finite_PD_theorem_passes":b["strict_PD_condition"],
               "within_budget":bool(candidate<allowed)}
          with open("v22-assembly.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not out["finite_PD_theorem_passes"] or not out["within_budget"]:
              raise RuntimeError("V22 assembly failed")
          print("V22 ASSEMBLY: PASS")
          PY

      - name: Fail-closed V22 decision
        run: |
          python - <<'PY'
          import json
          with open("v22-assembly.json") as f:a=json.load(f)
          with open("v22-compatibility.json") as f:c=json.load(f)

          decision={
            "row":326,
            "continuum_certified":False,
            "status":"THEOREM_LEVEL_FINITE_CERTIFICATE_CANDIDATE_PASSES",
            "finite_spectral_PD_proved_under_stated_roundoff_model":
              a["finite_PD_theorem_passes"],
            "combined_inflation":a["total_inflation"],
            "remaining_budget_margin":a["remaining_margin"],
            "next_requirement":
              "independent end-to-end audit of every inequality, rounding assumption, and no-double-counting step before any continuum_certified=true promotion"
          }
          with open("v22-decision.json","w") as f:json.dump(decision,f,indent=2)
          print(json.dumps(decision,indent=2))
          print("FAIL-CLOSED: continuum_certified=false")
          PY

      - name: Write ledger
        run: |
          cat > V22-LEDGER.txt <<'EOF'
          V22 — RIGOROUS FINITE SPECTRAL CERTIFICATE CANDIDATE, ROW 326

          V22 deliberately spends more of the available error budget to obtain
          a much easier finite positive-definiteness certificate.

          It sets

              mu = lambda_numeric + 1e-4

          and factors

              M = mu I - A = R^T R + E.

          A verified inverse-residual argument supplies a lower bound for
          sigma_min(R)^2. A standard gamma_n floating-point dot-product bound,
          enlarged conservatively, supplies an upper allowance for arithmetic
          error. The sufficient condition

              ||E||_2 < sigma_min(R)^2

          is then checked.

          V17 and V21 error terms are assembled separately:
              u/projector error,
              r-quadrature error,
              finite spectral shift.

          They are not silently merged or reused.

          V22 STILL DOES NOT SET continuum_certified=true.

          The next stage must be an independent end-to-end audit that attempts
          to falsify the certificate: check every theorem hypothesis, constants,
          norm conversion, floating-point assumption, source-code identity, and
          double-counting possibility.

          Only if that audit passes should promotion of row 326 be considered.

          NO T1/RH PROOF CLAIM IS MADE.
          EOF

      - name: Upload V22 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v22-rigorous-finite-row326
          path: |
            v22-input.json
            v22-witness.json
            v22-inverse-bound.json
            v22-longdouble-residual.json
            v22-backward-theorem.json
            v22-independent-check.json
            v22-compatibility.json
            v22-assembly.json
            v22-decision.json
            V22-LEDGER.txt