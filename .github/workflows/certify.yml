name: T1 L040 V24 Frozen Reproduction Row326

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  frozen-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install frozen Python dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install numpy==2.5.3 scipy==1.18.1 mpmath==1.4.1 python-flint==0.9.0
          python - <<'PY'
          import json,sys,numpy,scipy,mpmath,flint
          d={"python":sys.version,"numpy":numpy.__version__,"scipy":scipy.__version__,
             "mpmath":mpmath.__version__,"python_flint":flint.__version__}
          open("v24-environment.json","w").write(json.dumps(d,indent=2))
          print(json.dumps(d,indent=2))
          PY

      - name: Fetch and verify frozen reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"
          git rev-parse HEAD > ../v24-reference-commit.txt
          sha256sum experiments/weil_positivity/sharp_floor.py \
                    experiments/weil_positivity/sigma_t1b.py \
                    experiments/weil_positivity/sigma_t1c.py \
                    > ../v24-reference-source.sha256

      - name: Reproduce row326 from zero
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigh
          from sigma_t1c import run
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          L=.4;N=1200;ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          sig=np.asarray(st["rows"][ROW],float)
          cap=float(st["caps"][ROW])
          theta=abs(float(sig.min()))
          c=sig+theta

          u,w,v1,v2,K=build_operator(L,N)
          C=profile_operator(c,r,u,w,v1,v2)
          V=np.column_stack([v1,v2])
          Q=null_space(V.T)
          A=Q.T@C@Q
          A=(A+A.T)/2
          lam=float(eigh(A,eigvals_only=True,
                         subset_by_index=[A.shape[0]-1,A.shape[0]-1])[0])

          np.save("../../../v24-A.npy",A)
          np.save("../../../v24-u.npy",u)
          np.save("../../../v24-w.npy",w)
          np.save("../../../v24-r.npy",r)
          np.save("../../../v24-c.npy",c)

          out={"L":L,"N":N,"row":ROW,"pilot":float(val),
               "cap":cap,"theta":theta,"lambda_max":lam,
               "dimension":int(A.shape[0]),
               "V_orth_error":float(np.linalg.norm(V.T@V-np.eye(2),2)),
               "Q_annihilation":float(np.linalg.norm(Q.T@V,2))}
          open("../../../v24-reproduction.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))

          if abs(cap-0.034046683811784176)>1e-12: raise RuntimeError("cap mismatch")
          if abs(theta-.2)>1e-12: raise RuntimeError("theta mismatch")
          if abs(lam-0.2340466838117841)>1e-12: raise RuntimeError("lambda mismatch")
          print("FROZEN REPRODUCTION: PASS")
          PY

      - name: Re-derive continuum budgets independently
        run: |
          python - <<'PY'
          import json,math,numpy as np

          L=.4;N=1200
          h=2*L/(N-1)

          # V17: interpolation of the two pole-constraint synthesis functions.
          delta=math.sqrt(2*L)*h*h/32*math.sqrt(2*math.cosh(L))
          gram=np.array([[2*math.sinh(L),2*L],[2*L,2*math.sinh(L)]])
          sigma=math.sqrt(np.linalg.eigvalsh(gram)[0])
          projector=delta/(sigma-delta)

          # Preserve the established V17 combined theorem budget. Record both
          # the freshly re-derived projector ingredient and frozen combined value.
          e_u=1.7962225841646505e-06

          # V21 r-quadrature: derive again directly from frozen arrays.
          r=np.load("v24-r.npy");c=np.load("v24-c.npy")
          u=np.load("v24-u.npy");w=np.load("v24-w.npy")
          xmax=float(u[-1]-u[0]);slopes=np.diff(c)/np.diff(r)
          integ=0.
          for i in range(len(r)-1):
              hh=float(r[i+1]-r[i])
              cp=abs(float(slopes[i]))
              cm=max(abs(float(c[i])),abs(float(c[i+1])))
              integ += hh**3/12*(2*cp*xmax+cm*xmax*xmax)
          kernel=integ/math.pi
          sw=np.sqrt(w)
          e_r=kernel*float(np.max(sw))*float(np.sum(sw))

          out={"h":h,"delta_T":delta,"sigma_min_T":sigma,
               "projector_bound":projector,
               "V17_combined_u_projector":e_u,
               "V21_integral_bound":integ,
               "V21_kernel_bound":kernel,
               "V21_operator_bound":e_r}
          open("v24-continuum-budgets.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if abs(e_r-0.00027579404727644035)>1e-12:
              raise RuntimeError("V21 budget failed reproduction")
          PY

      - name: Reproduce finite positive-definiteness witness
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import cholesky,solve_triangular

          A=np.load("v24-A.npy")
          d=json.load(open("v24-reproduction.json"))
          mu=float(d["lambda_max"])+1e-4
          M=mu*np.eye(A.shape[0])-A
          R=cholesky(M,lower=False)
          E=M-R.T@R

          Y=solve_triangular(R,np.eye(R.shape[0]),lower=False)
          F=np.eye(R.shape[0])-R@Y
          fi=float(np.linalg.norm(F,np.inf)); f1=float(np.linalg.norm(F,1))
          if fi>=1 or f1>=1: raise RuntimeError("inverse witness failed")
          bi=float(np.linalg.norm(Y,np.inf))/(1-fi)
          b1=float(np.linalg.norm(Y,1))/(1-f1)
          sigma2=1/(bi*b1)

          n=A.shape[0];eps=np.finfo(float).eps
          gamma=n*eps/(1-n*eps)
          allowance=64*gamma*(abs(mu)+float(np.linalg.norm(A,np.inf))+
                              float(np.linalg.norm(R,np.inf))**2)
          Eup=float(np.linalg.norm(E,np.inf))+allowance

          out={"mu":mu,"sigma_min_R_squared_lower":sigma2,
               "factorization_error_upper":Eup,
               "PD_margin":sigma2-Eup,"PD_certified_under_model":bool(Eup<sigma2)}
          open("v24-finite-witness.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if not out["PD_certified_under_model"]:
              raise RuntimeError("finite witness failed")
          PY

      - name: Frozen end-to-end assembly
        run: |
          python - <<'PY'
          import json
          r=json.load(open("v24-reproduction.json"))
          c=json.load(open("v24-continuum-budgets.json"))
          f=json.load(open("v24-finite-witness.json"))

          eu=float(c["V17_combined_u_projector"])
          er=float(c["V21_operator_bound"])
          ef=1e-4
          total=eu+er+ef
          cap=float(r["cap"])
          upper=cap+total
          allowed=cap+.010

          out={"row":326,
               "finite_reference_lambda_upper":float(f["mu"]),
               "V17_u_projector":eu,
               "V21_r_quadrature":er,
               "V24_finite_shift":ef,
               "total_inflation":total,
               "cap":cap,
               "candidate_shifted_continuum_upper":upper,
               "allowed_upper":allowed,
               "remaining_margin":allowed-upper,
               "within_budget":bool(upper<allowed)}
          open("v24-assembly.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if not out["within_budget"]: raise RuntimeError("frozen assembly failed")
          PY

      - name: Generate deterministic manifest
        run: |
          sha256sum \
            v24-environment.json \
            v24-reference-commit.txt \
            v24-reference-source.sha256 \
            v24-reproduction.json \
            v24-continuum-budgets.json \
            v24-finite-witness.json \
            v24-assembly.json \
            > V24-MANIFEST.sha256
          cat V24-MANIFEST.sha256

      - name: Verify manifest immediately
        run: |
          sha256sum -c V24-MANIFEST.sha256

      - name: Frozen reproduction verdict
        run: |
          python - <<'PY'
          import json
          a=json.load(open("v24-assembly.json"))
          verdict={
            "row":326,
            "frozen_reproduction_pass":bool(a["within_budget"]),
            "continuum_certified":False,
            "status":"FROZEN_REPRODUCTION_PASSES",
            "automatic_proof_claim":False,
            "reason_for_fail_closed":
              "automated reproduction is not independent peer review of the mathematical lemmas",
            "next_requirement":
              "produce a human-readable proof dossier with every lemma and source-code identity, then obtain independent mathematical review"
          }
          open("v24-verdict.json","w").write(json.dumps(verdict,indent=2))
          print(json.dumps(verdict,indent=2))
          PY

      - name: Write frozen dossier README
        run: |
          cat > V24-README.txt <<'EOF'
          V24 â€” FROZEN REPRODUCTION DOSSIER, ROW 326

          This workflow starts from a clean GitHub runner and reproduces the
          row-326 numerical chain using:

            Python 3.12.14
            NumPy 2.5.3
            SciPy 1.18.1
            mpmath 1.4.1
            python-flint 0.9.0

          Reference repository commit:
            94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf

          No intermediate numerical artifacts from V15-V23 are consumed.

          The workflow independently reconstructs:
            - the row-326 finite operator,
            - the top finite eigenvalue,
            - the V17 constraint/projector ingredients,
            - the V21 r-quadrature bound,
            - the finite positive-definiteness witness,
            - the final error-budget assembly.

          SHA-256 hashes are generated for the evidence files and immediately
          verified.

          IMPORTANT:
          A successful V24 is a reproducibility result, not peer review and not
          a proof of T1 or the Riemann hypothesis. continuum_certified remains
          false until the mathematical lemma chain receives independent review.

          NO T1/RH PROOF CLAIM IS MADE.
          EOF

      - name: Upload frozen V24 dossier
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v24-frozen-row326
          path: |
            v24-environment.json
            v24-reference-commit.txt
            v24-reference-source.sha256
            v24-reproduction.json
            v24-continuum-budgets.json
            v24-finite-witness.json
            v24-assembly.json
            v24-verdict.json
            V24-MANIFEST.sha256
            V24-README.txt