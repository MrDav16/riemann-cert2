name: T1 L040 V9.1 Shifted Moment Corrected

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  shifted-moment:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Extract priority rows and dual budget
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run

          L=0.40; N=1200; TARGETS=[341,326,396]
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])
          A=np.vstack(rows+[np.ones_like(r)])
          b=np.concatenate([caps,[1.0]])
          lp=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          y=-np.asarray(lp.ineqlin.marginals[:-1],float)

          out={"L":L,"N":N,"pilot":float(val),"targets":{}}
          for idx in TARGETS:
              row=rows[idx]
              theta=abs(float(np.min(row)))
              out["targets"][str(idx)]={
                  "cap":float(caps[idx]),
                  "dual_weight":float(y[idx]),
                  "theta":theta,
                  "row_min":float(np.min(row)),
                  "row_max":float(np.max(row))
              }
              print("ROW",idx,"cap",caps[idx],"dual",y[idx],"theta",theta)

          with open("../../../v91-targets.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("TARGET EXTRACTION: PASS")
          PY

      - name: Verify corrected shifted identity on V
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import numpy as np
          from scipy.sparse.linalg import eigsh
          from sharp_floor import build_operator
          from sigma_lp import project_constraints

          L=0.40; n=1000
          u,w,v1,v2,K=build_operator(L,n)

          # P is the orthogonal projector onto V.
          P=np.eye(n)-np.outer(v1,v1)-np.outer(v2,v2)

          cases=[
              (0.2,5,10),(0.2,10,20),
              (1.5,5,10),(1.5,10,20),
              (4.0,5,10),(4.0,10,20)
          ]

          max_error=0.0

          for theta,R1,R2 in cases:
              K1,_=K(R1); K2,_=K(R2)
              K1=project_constraints(K1,v1,v2)
              K2=project_constraints(K2,v1,v2)

              A=K1-theta*(P-K2)
              C=K1+theta*K2

              # A and C have two zero modes on V^\perp.
              # For C|V, retrieve enough top eigenvalues and discard
              # the two projection-null modes by using the exact relation
              # on the nonzero V spectrum.
              valsA=np.sort(eigsh(A,k=8,which="LA",return_eigenvectors=False))[::-1]
              valsC=np.sort(eigsh(C,k=8,which="LA",return_eigenvectors=False))[::-1]

              # Pair eigenvalues through the shift. Find the C eigenvalue
              # whose shifted value best matches lambda_max(A).
              lamA=float(valsA[0])
              candidates=[float(x) for x in valsC]
              lamC=min(candidates,key=lambda x:abs((x-theta)-lamA))
              err=abs(lamA-(lamC-theta))
              max_error=max(max_error,err)

              print("theta",theta,"R1",R1,"R2",R2)
              print("  lambda(A|V) =",lamA)
              print("  matched lambda(C|V)-theta =",lamC-theta)
              print("  error =",err)

          if max_error>1e-8:
              raise RuntimeError("corrected V-space shift identity failed")

          print("CORRECTED SHIFT IDENTITY ON V: PASS")
          PY

      - name: Shifted k2 feasibility on projected space
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.sparse.linalg import eigsh
          from sharp_floor import build_operator
          from sigma_lp import project_constraints

          L=0.40; n=800
          u,w,v1,v2,K=build_operator(L,n)
          P=np.eye(n)-np.outer(v1,v1)-np.outer(v2,v2)

          cache={}
          def PK(R):
              if R not in cache:
                  KR,_=K(R)
                  cache[R]=project_constraints(KR,v1,v2)
              return cache[R]

          thetas=[0.2,1.5,4.0]
          Rs=[4,5,6,7,8,9,10,12,15,18,20,22]
          report={}

          for theta in thetas:
              candidates=[]
              for R1 in Rs:
                  for R2 in Rs:
                      if R2<=R1: continue

                      C=PK(R1)+theta*PK(R2)
                      A=C-theta*P
                      lamA=float(np.max(eigsh(A,k=6,which="LA",return_eigenvectors=False)))

                      # Since C=P C P, its Frobenius norm is exactly the
                      # finite-dimensional projected k=2 moment.
                      m2=float(np.linalg.norm(C,"fro"))
                      shifted_bound=m2-theta
                      slack=shifted_bound-lamA

                      candidates.append({
                          "R1":R1,"R2":R2,
                          "lambda_A":lamA,
                          "m2_C":m2,
                          "shifted_m2_bound":shifted_bound,
                          "slack":slack
                      })

              candidates.sort(key=lambda x:x["slack"])
              report[str(theta)]=candidates[:30]
              print("THETA",theta)
              for x in candidates[:10]: print(x)

          with open("../../../v91-shift-scan.json","w") as f:
              json.dump(report,f,indent=2,sort_keys=True)
          print("PROJECTED SHIFTED k2 SCAN: PASS")
          PY

      - name: Compare feasibility with dual budgets
        run: |
          python - <<'PY'
          import json
          with open("v91-targets.json") as f: d=json.load(f)
          with open("v91-shift-scan.json") as f: s=json.load(f)

          pilot=float(d["pilot"])
          print("PILOT =",pilot)

          for row in ["341","326","396"]:
              t=d["targets"][row]
              theta=str(float(t["theta"]))
              cap=float(t["cap"])
              y=float(t["dual_weight"])
              allowance=pilot/6/y
              threshold=cap+allowance
              best=s[theta][0]

              print()
              print("ROW",row)
              print("  theta =",theta)
              print("  float cap =",cap)
              print("  engineering rigorous-cap target <",threshold)
              print("  best prototype shifted-m2 =",best["shifted_m2_bound"])
              print("  prototype slack =",best["slack"])

          print()
          print("NOTE: prototype scan is diagnostic, not exact row matching.")
          PY

      - name: Verify continuum cross moments with Arb
        run: |
          python - <<'PY'
          from flint import arb,ctx
          ctx.prec=192
          ell=arb("0.8"); pi=arb.pi()

          def verified_inner(R0,S0,M=12000):
              R=arb(str(R0)); S=arb(str(S0)); dx=ell/arb(M)
              first=2*ell*R*S/(pi*pi)*dx
              total=arb("0 +/- "+str(float(first)))
              for i in range(1,M):
                  a=ell*arb(i)/arb(M); b=ell*arb(i+1)/arb(M)
                  mid=(a+b)/2; rad=(b-a)/2
                  X=mid+arb("0 +/- "+str(float(rad)))
                  kR=(R*X).sin()/(pi*X)
                  kS=(S*X).sin()/(pi*X)
                  total += 2*(ell-X)*kR*kS*(b-a)
              return total

          for R,S in [(5,10),(8,15),(10,20),(15,22)]:
              print("R,S",R,S,"=>",verified_inner(R,S))
          print("ARB CROSS-MOMENTS: PASS")
          PY

      - name: Write V9.1 ledger
        run: |
          cat > V91-LEDGER.txt <<'EOF'
          V9.1 — CORRECTED SHIFTED POSITIVE MOMENT AUDIT

          V9 failed because lambda_max(C) was taken on the full discretized
          space, which includes the two null directions V-perp introduced by
          the pole projection. Those zero modes can dominate when the true
          spectrum of C|V lies below theta.

          V9.1 treats the identity on the constrained subspace:

              A|V = C|V - theta I_V,

          hence

              lambda_max(A|V)
              = lambda_max(C|V) - theta.

          The workflow regression-tests this identity by matching the
          non-null V spectrum.

          The shifted k=2 feasibility bound is

              lambda_max(A|V)
              <= sqrt(Tr_V(C^2)) - theta,

          provided C is the positive shifted operator associated with the
          exact signed LP row.

          This workflow remains a feasibility audit. It does NOT certify T1
          or RH. Exact row/operator reconstruction and rigorous continuum
          rank-2 moment evaluation remain required before a certified cap can
          be charged against the dual margin.
          EOF
          cat V91-LEDGER.txt

      - name: Upload V9.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v91-shifted-moment
          path: |
            v91-targets.json
            v91-shift-scan.json
            V91-LEDGER.txt