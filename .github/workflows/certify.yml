name: T1 L040 Trace Active Caps

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = \
            "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Trace exact active rows
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json
          import hashlib
          import numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run

          L = 0.40

          val, st = run(L, verbose=True)

          r = np.asarray(st["r"], dtype=np.float64)
          cost = np.asarray(st["cost"], dtype=np.float64)
          caps = np.asarray(st["caps"], dtype=np.float64)
          rows = [
              np.asarray(x, dtype=np.float64)
              for x in st["rows"]
          ]
          tail = float(st["tail"])

          A = np.vstack(rows + [np.ones_like(r)])
          b = np.concatenate([caps, [1.0]])

          res = linprog(
              cost - tail,
              A_ub=A,
              b_ub=b,
              bounds=(0, None),
              method="highs"
          )

          if not res.success:
              raise RuntimeError(res.message)

          y = -np.asarray(
              res.ineqlin.marginals[:-1],
              dtype=np.float64
          )

          y_mass = float(
              -res.ineqlin.marginals[-1]
          )

          dual_floor = (
              tail
              - y_mass
              - float(y @ caps)
          )

          if abs(float(val) - dual_floor) > 1e-8:
              raise RuntimeError(
                  "primal/dual mismatch"
              )

          active_indices = [
              i for i, x in enumerate(y)
              if x > 1e-9
          ]

          def sha(a):
              a = np.asarray(
                  a,
                  dtype="<f8"
              )
              return hashlib.sha256(
                  a.tobytes()
              ).hexdigest()

          def breakpoints(a):
              """
              Store locations where the discrete
              slope changes. This is useful for
              reconstructing piecewise-linear sigma.
              """
              a = np.asarray(a)
              d = np.diff(a)

              if len(d) < 2:
                  return []

              dd = np.diff(d)

              ids = np.where(
                  np.abs(dd) > 1e-10
              )[0] + 1

              out = []

              for i in ids:
                  out.append({
                      "index": int(i),
                      "r": float(r[i]),
                      "value": float(a[i])
                  })

              return out

          report = {
              "L": L,
              "reference_commit":
                  "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf",

              "pilot_floor":
                  float(val),

              "dual_floor_float":
                  dual_floor,

              "mass_weight":
                  y_mass,

              "r_sha256":
                  sha(r),

              "cost_sha256":
                  sha(cost),

              "total_rows":
                  len(rows),

              "active_count":
                  len(active_indices),

              "active": []
          }

          arrays = {
              "r": r,
              "cost": cost
          }

          print()
          print("=" * 76)
          print("ACTIVE ROW TRACE")
          print("=" * 76)

          for i in active_indices:

              row = rows[i]

              negative = bool(
                  np.min(row) < -1e-12
              )

              item = {
                  "index": int(i),

                  "dual_weight":
                      float(y[i]),

                  "cap_float":
                      float(caps[i]),

                  "weighted_cap":
                      float(y[i] * caps[i]),

                  "signed":
                      negative,

                  "min":
                      float(np.min(row)),

                  "max":
                      float(np.max(row)),

                  "row_sha256":
                      sha(row),

                  "nonzero_count":
                      int(np.count_nonzero(
                          np.abs(row) > 1e-14
                      )),

                  "breakpoints":
                      breakpoints(row)
              }

              report["active"].append(
                  item
              )

              arrays[
                  f"row_{i}"
              ] = row

              print(
                  f"{i:4d} "
                  f"y={y[i]:.12g} "
                  f"cap={caps[i]:+.12g} "
                  f"signed={negative} "
                  f"min={np.min(row):+.6g} "
                  f"max={np.max(row):+.6g} "
                  f"sha={sha(row)[:16]}"
              )

              if negative:
                  bp = item["breakpoints"]

                  print(
                      "     breakpoints:",
                      [
                          (
                              round(x["r"], 4),
                              round(x["value"], 6)
                          )
                          for x in bp[:30]
                      ]
                  )

          report["active"].sort(
              key=lambda x:
                  x["weighted_cap"],
              reverse=True
          )

          with open(
              "../../../active-trace.json",
              "w"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  sort_keys=True
              )

          np.savez_compressed(
              "../../../active-rows.npz",
              **arrays
          )

          signed = [
              x for x in report["active"]
              if x["signed"]
          ]

          with open(
              "../../../signed-trace.json",
              "w"
          ) as f:
              json.dump(
                  signed,
                  f,
                  indent=2,
                  sort_keys=True
              )

          print()
          print("=" * 76)
          print("SUMMARY")
          print("=" * 76)

          print(
              "pilot:",
              repr(float(val))
          )

          print(
              "dual:",
              repr(dual_floor)
          )

          print(
              "active:",
              len(active_indices)
          )

          print(
              "signed:",
              len(signed)
          )

          print(
              "signed indices:",
              [x["index"] for x in signed]
          )

          expected = {
              396, 341, 326,
              374, 375, 316, 222
          }

          found = {
              x["index"]
              for x in signed
          }

          if found != expected:
              raise RuntimeError(
                  f"Signed-row identity changed: "
                  f"{found} != {expected}"
              )

          print(
              "SIGNED ROW IDENTITY: PASS"
          )

          print()
          print(
              "This trace is FLOAT data used "
              "to identify operators."
          )

          print(
              "It is NOT a mathematical "
              "certificate."
          )
          PY

      - name: Verify Arb available
        run: |
          python - <<'PY'
          from flint import arb

          x = arb("0.4")

          print(
              "Arb:",
              x.sin()
          )

          assert x.sin().is_finite()

          print(
              "ARB READY FOR NEXT STAGE"
          )
          PY

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-active-trace
          path: |
            active-trace.json
            signed-trace.json
            active-rows.npz