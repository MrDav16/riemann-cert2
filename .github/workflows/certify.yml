name: T1 L040 V27 Signed-Cap Operator Identity Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  identity-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install numpy==2.5.3 scipy==1.18.1 mpmath==1.4.1

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Audit exact signed-cap operator identities
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          cat > v27.py <<'PY'
          import json,numpy as np
          from scipy.sparse.linalg import eigsh
          from sharp_floor import build_operator
          from sigma_lp import project_constraints
          from sigma_t1b import profile_operator,tent

          L=.4;N=1200;Rmax=22.;dr=.05
          u,w,v1,v2,K=build_operator(L,N)
          r=np.arange(0.,Rmax+1e-9,dr)
          P=np.eye(N)-np.outer(v1,v1)-np.outer(v2,v2)

          cases=[
            {"index":222,"kind":"signed_tail","slot":[8.1,8.1],"theta":.35,
             "cut":10.1,"R":10.25,"old_cap":0.0012696678181704265},
            {"index":316,"kind":"signed_tail","slot":[7.45,7.5],"theta":.2,
             "cut":9.5,"R":9.5,"old_cap":0.033184100782823724},
            {"index":326,"kind":"signed_wide","slot":[7.45,7.5],"theta":.2,
             "old_cap":0.0340466838117841},
            {"index":341,"kind":"signed_joint","slots":[[8.6,10.5],[17.4,17.45]],
             "theta":1.5,"old_cap":0.052153459324580397},
            {"index":374,"kind":"signed_tail","slot":[18.8,18.85],"theta":2.,
             "cut":20.85,"R":21.0,"old_cap":0.016689842979342586},
            {"index":375,"kind":"signed_tail","slot":[18.8,18.85],"theta":3.,
             "cut":20.85,"R":21.0,"old_cap":0.008404279185219384},
            {"index":396,"kind":"signed_joint","slots":[[0.,9.8],[18.8,18.85]],
             "theta":4.,"old_cap":0.16719921387534403},
          ]

          def top(A):
              return float(np.max(eigsh((A+A.T)/2,k=6,which="LA",
                                        return_eigenvectors=False)))
          def bandop(R):
              KR,_=K(R);return project_constraints(KR,v1,v2)

          out=[]
          for c in cases:
              th=c["theta"]
              if c["kind"]=="signed_tail":
                  lo,hi=c["slot"]; sb=tent(r,lo,hi)
                  Kb=profile_operator(sb,r,u,w,v1,v2)
                  B=bandop(c["R"])
                  constructed=Kb-th*(P-B)
                  sampled=sb-th*(r>c["cut"]).astype(float)
              elif c["kind"]=="signed_wide":
                  lo,hi=c["slot"]; sb=tent(r,lo,hi)
                  Kb=profile_operator(sb,r,u,w,v1,v2)
                  sw=tent(r,max(lo-2.,0.),min(hi+2.,Rmax))
                  Kw=profile_operator(sw,r,u,w,v1,v2)
                  constructed=Kb-th*(P-Kw)
                  sampled=sb-th*(1.-sw)
              else:
                  (a,b),(cc,d)=c["slots"]
                  sab=np.maximum(tent(r,a,b),tent(r,cc,d))
                  Kab=profile_operator(sab,r,u,w,v1,v2)
                  wab=np.maximum(tent(r,max(a-2,0.),min(b+2,Rmax)),
                                 tent(r,max(cc-2,0.),min(d+2,Rmax)))
                  Kw=profile_operator(wab,r,u,w,v1,v2)
                  constructed=Kab-th*(P-Kw)
                  sampled=sab-th*(1.-wab)

              direct=profile_operator(sampled,r,u,w,v1,v2)
              D=direct-constructed

              # Core identity diagnosis:
              # profile_operator(1) need not equal P for the finite r-truncated
              # numerical kernel. The signed constructions explicitly use P,
              # so the discrepancy should be explained by th*(P-K_1).
              ones=np.ones_like(r)
              K1=profile_operator(ones,r,u,w,v1,v2)
              predicted=th*(P-K1)
              resid=D-predicted

              rec=dict(c)
              rec.update({
                "constructed_lambda":top(constructed),
                "direct_sampled_lambda":top(direct),
                "matrix_discrepancy_norm2":float(np.linalg.norm(D,2)),
                "P_minus_K1_norm2":float(np.linalg.norm(P-K1,2)),
                "predicted_discrepancy_norm2":float(np.linalg.norm(predicted,2)),
                "identity_residual_norm2":float(np.linalg.norm(resid,2)),
                "old_cap_error":abs(top(constructed)-c["old_cap"])
              })
              out.append(rec)

          report={"cases":out,
            "hypothesis":
              "signed cap construction uses the exact complement operator P minus a positive band/window operator; naive sampled sigma replaces P by the finite-r numerical profile of 1",
            "max_identity_residual":max(x["identity_residual_norm2"] for x in out),
            "max_old_cap_error":max(x["old_cap_error"] for x in out)}
          open("../../../v27-identities.json","w").write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if report["max_identity_residual"]>1e-10:
              raise RuntimeError("proposed signed-cap identity does not explain discrepancy")
          if report["max_old_cap_error"]>2e-10:
              raise RuntimeError("constructed cap drift")
          print("SIGNED-CAP OPERATOR IDENTITY AUDIT: PASS")
          PY
          python v27.py

      - name: Derive family theorem obligations
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v27-identities.json"))
          out={
            "identity_audit_pass":d["max_identity_residual"]<1e-10,
            "families":{
              "indicator":{
                "representation":"exact band operator K_R projected to pole-constraint complement",
                "continuum_task":"bound u-discretization/projector error for K_R directly; no r-trapezoid surrogate needed"
              },
              "fejer_union":{
                "representation":"profile integral operator for an explicitly piecewise-linear sigma",
                "continuum_task":"r-quadrature plus general u/projector perturbation theorem"
              },
              "signed_tail":{
                "representation":"K_band_profile - theta*(P-K_R)",
                "continuum_task":"combine certified bounds for band profile, exact complement projector, and indicator K_R"
              },
              "signed_wide":{
                "representation":"K_band_profile - theta*(P-K_wide)",
                "continuum_task":"combine certified profile bounds with exact complement projector; row326 is this family"
              },
              "signed_joint":{
                "representation":"K_joint_profile - theta*(P-K_wide_joint)",
                "continuum_task":"same algebraic theorem as signed_wide with union profiles"
              }
            },
            "critical_rule":
              "do not replace P by profile_operator(ones,r-grid); signed caps are algebraic operator constructions, not naive finite-r sampled profiles",
            "next_stage":
              "derive one compositional ValidCap theorem from certified primitive operators, then instantiate it for all 40 active caps"
          }
          open("v27-family-theorems.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Fail-closed V27 verdict
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v27-identities.json"))
          out={
            "T1_certified":False,
            "all_ValidCap_certified":False,
            "operator_identity_explained":bool(d["max_identity_residual"]<1e-10),
            "status":"SIGNED_CAP_ALGEBRA_IDENTIFIED",
            "next_requirement":
              "prove and numerically certify primitive-operator continuum bounds, then compose them with these exact identities"
          }
          open("v27-verdict.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Write ledger
        run: |
          cat > V27-LEDGER.txt <<'EOF'
          V27 — SIGNED-CAP OPERATOR IDENTITY AUDIT

          Goal:
          explain why naive profile_operator(sigma) in V26.1 does not reproduce
          the caps for signed_tail, signed_wide and signed_joint rows.

          The construction uses algebraic operators containing P, the exact
          finite-grid projector onto the pole-constraint complement.

          A naive sampled profile of the constant function 1 instead produces
          a finite-r truncated numerical integral operator K_1. These are not
          interchangeable.

          V27 tests whether the full discrepancy is exactly theta*(P-K_1).
          If so, the signed caps must be certified compositionally from their
          primitive operator pieces rather than by treating the stored sampled
          sigma array as a standalone finite-r profile.

          This is a theorem-discovery/audit stage. It remains fail-closed:
          T1_certified=false and all_ValidCap_certified=false.

          NO RH PROOF CLAIM IS MADE.
          EOF

      - name: Hash and upload V27 evidence
        run: |
          sha256sum v27-identities.json v27-family-theorems.json v27-verdict.json V27-LEDGER.txt > V27-MANIFEST.sha256
          sha256sum -c V27-MANIFEST.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v27-operator-identities
          path: |
            v27-identities.json
            v27-family-theorems.json
            v27-verdict.json
            V27-LEDGER.txt
            V27-MANIFEST.sha256