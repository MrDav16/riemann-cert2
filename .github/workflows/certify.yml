name: T1 L040 V6 Rigorous Remainder Prep

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  remainder:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = \
            "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Reproduce target rows and convergence
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from sigma_t1c import run

          L = 0.40
          TARGETS = [341, 326, 396]
          NS = [600, 1200, 2400]

          report = {
              "L": L,
              "targets": TARGETS,
              "runs": []
          }

          for n in NS:
              print("=" * 72)
              print("n =", n)
              print("=" * 72)

              val, st = run(
                  L,
                  n=n,
                  verbose=False
              )

              caps = np.asarray(
                  st["caps"],
                  dtype=float
              )

              rows = [
                  np.asarray(x, dtype=float)
                  for x in st["rows"]
              ]

              item = {
                  "n": n,
                  "pilot": float(val),
                  "caps": {}
              }

              for idx in TARGETS:
                  item["caps"][str(idx)] = {
                      "cap": float(caps[idx]),
                      "min": float(
                          np.min(rows[idx])
                      ),
                      "max": float(
                          np.max(rows[idx])
                      )
                  }

                  print(
                      idx,
                      repr(float(caps[idx]))
                  )

              report["runs"].append(item)

          with open(
              "../../../v6-convergence.json",
              "w"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2
              )
          PY

      - name: Analytic sinc derivative bounds
        run: |
          python - <<'PY'
          from flint import arb, ctx
          import json

          ctx.prec = 192

          # --------------------------------------------------
          # Kernel:
          #
          # k_R(x) = sin(R x)/(pi x)
          #
          # x in [-2L,2L], L=0.4
          #
          # We derive deliberately conservative global bounds
          # using the power series / integral representation
          #
          # sin(Rx)/x = integral_0^R cos(t x) dt
          #
          # Hence:
          #
          # |k_R|      <= R/pi
          # |k_R'|     <= R^2/pi
          # |k_R''|    <= R^3/(3 pi)
          #
          # The derivative-1 bound is intentionally loose:
          # integral_0^R t dt = R^2/2 would be sharper.
          #
          # We record both safe bounds.
          # --------------------------------------------------

          pi = arb.pi()

          Rs = [
              arb("22"),
              arb("21"),
              arb("20"),
              arb("15"),
              arb("12"),
              arb("10")
          ]

          out = {}

          print("GLOBAL SINC DERIVATIVE BOUNDS")
          print()

          for R in Rs:

              b0 = R / pi
              b1 = R**2 / (2*pi)
              b2 = R**3 / (3*pi)

              key = str(R)

              out[key] = {
                  "abs_k": str(b0),
                  "abs_k_prime": str(b1),
                  "abs_k_second": str(b2)
              }

              print(
                  "R =", R,
                  "|k| <=", b0,
                  "|k'| <=", b1,
                  "|k''| <=", b2
              )

          with open(
              "sinc-derivative-bounds.json",
              "w"
          ) as f:
              json.dump(
                  out,
                  f,
                  indent=2
              )

          print()
          print("ARB ANALYTIC BOUNDS: PASS")
          PY

      - name: Trapezoid theorem budget
        run: |
          python - <<'PY'
          from flint import arb, ctx

          ctx.prec = 192

          # Composite trapezoid theorem:
          #
          # | integral_a^b f(x) dx - T_N |
          # <= (b-a) h^2 / 12 * sup |f''|
          #
          # We evaluate a deliberately conservative
          # scale for the sinc kernel itself.
          #
          # This is NOT yet the full projected-operator
          # delta_N: projection and composed kernels
          # still need to be included.

          L = arb("0.4")
          length = 2 * L
          pi = arb.pi()

          RMAX = arb("22")

          sup_second = (
              RMAX**3
              / (3*pi)
          )

          print(
              "sup |k''| bound =",
              sup_second
          )

          for n in [
              600,
              1200,
              2400
          ]:

              h = (
                  2 * L
                  / arb(n - 1)
              )

              err_1d = (
                  length
                  * h**2
                  * sup_second
                  / 12
              )

              print()
              print("n =", n)
              print("h =", h)
              print(
                  "raw 1D trapezoid bound =",
                  err_1d
              )

          print()
          print(
              "NOTE: these are theorem-based "
              "quadrature scales, not yet "
              "full spectral delta_N."
          )
          PY

      - name: Empirical second-order envelope
        run: |
          python - <<'PY'
          import json

          with open(
              "v6-convergence.json"
          ) as f:
              d = json.load(f)

          targets = [
              "341",
              "326",
              "396"
          ]

          print(
              "SECOND-ORDER DIAGNOSTIC"
          )

          for row in targets:

              vals = [
                  run["caps"][row]["cap"]
                  for run in d["runs"]
              ]

              d1 = abs(
                  vals[1] - vals[0]
              )

              d2 = abs(
                  vals[2] - vals[1]
              )

              ratio = (
                  d1 / d2
                  if d2 != 0
                  else float("inf")
              )

              # If exact second order held:
              #
              # e_2400 approximately d2/3.
              #
              # DIAGNOSTIC ONLY.

              richardson = (
                  d2 / 3
              )

              print()
              print("row", row)
              print("600  =", vals[0])
              print("1200 =", vals[1])
              print("2400 =", vals[2])
              print("d1 =", d1)
              print("d2 =", d2)
              print("d1/d2 =", ratio)
              print(
                  "O(h^2) inferred residual =",
                  richardson
              )

          print()
          print(
              "NO Richardson value above is "
              "used as a proof bound."
          )
          PY

      - name: Conservative operator budget experiment
        run: |
          python - <<'PY'
          # -------------------------------------------------
          # This step answers an engineering question:
          #
          # How coarse could a future rigorous delta_N
          # actually be and still preserve useful margin?
          # -------------------------------------------------

          pilot = 0.0847191143605307

          weights = {
              341: 0.4250449361150816,
              326: 0.3593393877190819,
              396: 0.1389016438184634
          }

          scenarios = [
              1e-4,
              5e-4,
              1e-3,
              2e-3,
              5e-3,
              1e-2
          ]

          print(
              "CONSERVATIVE DELTA SCENARIOS"
          )

          total_y = sum(
              weights.values()
          )

          for delta in scenarios:

              loss = (
                  total_y * delta
              )

              remaining = (
                  pilot - loss
              )

              print(
                  f"delta={delta:.6g}",
                  f"loss={loss:.12g}",
                  f"remaining={remaining:.12g}"
              )

          print()
          print(
              "Even this only accounts for the "
              "three priority signed rows."
          )
          PY

      - name: Generate V6 proof obligations
        run: |
          cat > V6-PROOF-OBLIGATIONS.txt <<'EOF'
          V6 — RIGOROUS REMAINDER PREPARATION

          VERIFIED / REPRODUCED

          1. Pinned reference implementation.
          2. Priority rows 341, 326, 396.
          3. Stable n=600/1200/2400 convergence.
          4. Arb 192-bit arithmetic.
          5. Analytic global derivative bounds for

                 k_R(x)=sin(Rx)/(pi x)

             obtained from

                 k_R(x)
                 = (1/pi) integral_0^R cos(tx) dt.

          6. Composite trapezoid theorem evaluated
             with rigorous Arb arithmetic.

          STILL REQUIRED FOR A TRUE delta_N

          A. Lift scalar quadrature error to a
             Hilbert-Schmidt/operator norm error.

          B. Include the weighted Nyström
             symmetrization.

          C. Include the rank-2 projection onto
             the orthogonal complement of

                 exp(+u/2)
                 exp(-u/2).

          D. Treat signed operators

                 K_band
                 - theta (I - K_wide/cut)

             rather than a single sinc kernel.

          E. Obtain an explicit verified number

                 delta_N

             satisfying

                 ||A - A_N||_op <= delta_N.

          F. Verify the finite matrix eigenvalue
             itself with interval arithmetic or
             a residual-based eigenvalue enclosure.

          G. Only then form

                 Lambda_plus
                 =
                 lambda_N_upper
                 + delta_N

             and charge

                 y_j
                 (Lambda_plus - Lambda_float)

             against the dual margin.

          IMPORTANT

          V6 does not claim T1 or RH has been proved.
          It converts the observed O(h^2) behavior
          into explicit proof obligations and
          theorem-based error components.
          EOF

          cat V6-PROOF-OBLIGATIONS.txt

      - name: Upload V6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v6-remainder-prep
          path: |
            v6-convergence.json
            sinc-derivative-bounds.json
            V6-PROOF-OBLIGATIONS.txt