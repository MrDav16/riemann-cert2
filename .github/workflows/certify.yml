name: T1 L040 V18 Finite Spectral Certificate Row326

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  finite-spectral-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Build exact finite row326 matrix and candidate eigenpair
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigh
          from sigma_t1c import run
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          L=.4; N=1200; ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          sig=rows[ROW]; theta=abs(float(sig.min())); c=sig+theta

          u,w,v1,v2,K=build_operator(L,N)
          Q=null_space(np.column_stack([v1,v2]).T)
          C=profile_operator(c,r,u,w,v1,v2)
          CV=Q.T@C@Q

          # Largest two eigenpairs only.
          vals,vecs=eigh(CV,subset_by_index=[CV.shape[0]-2,CV.shape[0]-1])
          lam2=float(vals[-2]); lam=float(vals[-1])
          v=np.asarray(vecs[:,-1],float)
          v/=np.linalg.norm(v)
          res=CV@v-lam*v
          res2=float(np.linalg.norm(res))
          gap=float(lam-lam2)

          np.save("../../../v18-CV.npy",CV)
          np.save("../../../v18-v.npy",v)

          out={"N":N,"dimension":int(CV.shape[0]),"theta":theta,
               "reference_cap":float(caps[ROW]),"lambda1":lam,
               "lambda2":lam2,"gap":gap,"residual_2":res2,
               "pilot":float(val)}
          with open("../../../v18-candidate.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("FINITE MATRIX/CANDIDATE: PASS")
          PY

      - name: Symmetry and representation audit
        run: |
          python - <<'PY'
          import json,numpy as np
          A=np.load("v18-CV.npy")
          sym=float(np.linalg.norm(A-A.T,np.inf))
          finite=bool(np.isfinite(A).all())
          out={"symmetry_inf_error":sym,"all_finite":finite,
               "dimension":int(A.shape[0])}
          with open("v18-representation-audit.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not finite or sym>1e-10:raise RuntimeError("finite representation audit failed")
          PY

      - name: Rigorous floating input radius budget
        run: |
          python - <<'PY'
          import json,numpy as np,math
          A=np.load("v18-CV.npy")
          n=A.shape[0]

          # Every stored double is treated as an interval centered at its
          # binary64 value. A deliberately conservative absolute entry radius
          # covers conversion/roundoff for the already-built finite matrix.
          #
          # IMPORTANT: this certifies the stored finite matrix neighborhood;
          # V17 separately handles continuum discretization.
          maxabs=float(np.max(np.abs(A)))
          eps=np.finfo(float).eps
          entry_rad=64*eps*max(1.0,maxabs)
          row_rad=n*entry_rad

          out={"max_abs_entry":maxabs,"entry_radius":entry_rad,
               "induced_inf_norm_radius":row_rad}
          with open("v18-input-radius.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Candidate residual interval certificate
        run: |
          python - <<'PY'
          import json,numpy as np,math
          A=np.load("v18-CV.npy"); v=np.load("v18-v.npy")
          with open("v18-candidate.json") as f:c=json.load(f)
          with open("v18-input-radius.json") as f:b=json.load(f)

          lam=float(c["lambda1"])
          r=A@v-lam*v

          # Rigorous engineering enclosure for residual of any matrix in the
          # stored entrywise neighborhood:
          # ||Delta A v||_2 <= ||Delta A||_2 <= ||Delta A||_inf
          # for symmetric Delta A with the uniform row-sum bound used here.
          rr=float(np.linalg.norm(r,2))+float(b["induced_inf_norm_radius"])

          out={"lambda_center":lam,"residual_upper":rr,
               "eigenvalue_nearby_interval":[lam-rr,lam+rr]}
          with open("v18-residual-cert.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("RESIDUAL ENCLOSURE: PASS")
          PY

      - name: Gershgorin upper bound sanity
        run: |
          python - <<'PY'
          import json,numpy as np
          A=np.load("v18-CV.npy")
          diag=np.diag(A)
          rad=np.sum(np.abs(A),axis=1)-np.abs(diag)
          upper=float(np.max(diag+rad))
          with open("v18-gershgorin.json","w") as f:json.dump({"upper":upper},f,indent=2)
          print("Gershgorin upper =",upper)
          print("GERSHGORIN SANITY: PASS")
          PY

      - name: Shifted positive-definiteness certificate via LDL
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import ldl

          A=np.load("v18-CV.npy")
          with open("v18-candidate.json") as f:c=json.load(f)
          with open("v18-input-radius.json") as f:b=json.load(f)

          # Choose mu with substantial room above lambda1 but tiny relative
          # to the continuum budget. If mu I-A is rigorously PD, then
          # lambda_max(A)<mu.
          mu=float(c["lambda1"])+1e-7
          M=mu*np.eye(A.shape[0])-A

          # Numerical LDL diagnostic first.
          L,D,perm=ldl(M,lower=True,hermitian=True)
          evD=np.linalg.eigvalsh(D)
          minD=float(evD[0])

          # Independent direct smallest eigenvalue diagnostic of shifted M.
          mineig=float(np.linalg.eigvalsh(M)[0])

          # Roundoff/input neighborhood budget.
          perturb=float(b["induced_inf_norm_radius"])

          out={"mu":mu,"min_eigenvalue_shifted_numeric":mineig,
               "min_D_numeric":minD,"matrix_neighborhood_norm":perturb,
               "pd_after_input_radius":bool(mineig>perturb),
               "certified_upper_if_roundoff_model_accepted":mu}
          with open("v18-shift-cert.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))

          if mineig<=perturb:
              raise RuntimeError("shift margin too small for stored-matrix radius")
          print("SHIFTED PD NUMERICAL/RADIUS TEST: PASS")
          PY

      - name: Arb block principal-minor prototype
        run: |
          python - <<'PY'
          import json,numpy as np
          from flint import arb,ctx
          ctx.prec=160

          A=np.load("v18-CV.npy")
          with open("v18-shift-cert.json") as f:s=json.load(f)
          mu=float(s["mu"])

          # Full 1198x1198 Arb LDL would be unnecessarily expensive for this
          # prototype. Certify arithmetic on the leading 32x32 shifted block
          # and make the limitation explicit.
          m=32
          B=mu*np.eye(m)-A[:m,:m]

          M=[[arb(str(B[i,j]))+arb("0 +/- 2e-15") for j in range(m)] for i in range(m)]

          # Interval Cholesky without pivoting.
          L=[[arb(0) for _ in range(m)] for __ in range(m)]
          ok=True
          pivots=[]
          for i in range(m):
              s0=M[i][i]
              for k in range(i): s0-=L[i][k]*L[i][k]
              # Midpoint positivity is diagnostic; interval width is recorded.
              mid=float(s0.mid())
              pivots.append(str(s0))
              if mid<=0:
                  ok=False; break
              L[i][i]=s0.sqrt()
              for j in range(i+1,m):
                  z=M[j][i]
                  for k in range(i): z-=L[j][k]*L[i][k]
                  L[j][i]=z/L[i][i]

          out={"block_size":m,"completed":ok,"pivots":pivots,
               "full_matrix_arb_certificate":False}
          with open("v18-arb-block.json","w") as f:json.dump(out,f,indent=2)
          if not ok:raise RuntimeError("Arb block Cholesky failed")
          print("ARB BLOCK CHOLESKY: PASS")
          PY

      - name: Assemble row326 continuum budget
        run: |
          python - <<'PY'
          import json
          with open("v18-candidate.json") as f:c=json.load(f)
          with open("v18-shift-cert.json") as f:s=json.load(f)

          # Formal continuum error from V17 at N=1200.
          continuum_error=1.7962225841646505e-06
          theta=float(c["theta"])
          finite_upper=float(s["mu"])

          continuum_lambda_upper=finite_upper+continuum_error
          shifted_upper=continuum_lambda_upper-theta
          cap=float(c["reference_cap"])

          out={"finite_upper_candidate":finite_upper,
               "V17_continuum_operator_error":continuum_error,
               "continuum_lambda_upper_candidate":continuum_lambda_upper,
               "shifted_continuum_upper_candidate":shifted_upper,
               "reference_cap":cap,
               "inflation_over_original_cap":shifted_upper-cap,
               "within_plus_0p010_budget":bool(shifted_upper<cap+0.010)}
          with open("v18-assembly.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not out["within_plus_0p010_budget"]:
              raise RuntimeError("assembled candidate misses budget")
          print("ROW326 BUDGET ASSEMBLY: PASS")
          PY

      - name: Fail-closed V18 decision
        run: |
          python - <<'PY'
          import json
          with open("v18-assembly.json") as f:a=json.load(f)
          with open("v18-arb-block.json") as f:b=json.load(f)

          decision={
            "row":326,
            "continuum_certified":False,
            "status":"FINITE_SPECTRAL_CERTIFICATE_ARCHITECTURE_PASSES",
            "assembled_shifted_upper_candidate":a["shifted_continuum_upper_candidate"],
            "within_budget":a["within_plus_0p010_budget"],
            "full_arb_matrix_certificate":b["full_matrix_arb_certificate"],
            "remaining_gap":[
              "replace numerical shifted-PD test by a full rigorous certificate for the complete finite matrix",
              "prove the stored finite matrix rounding enclosure from construction operations rather than post-hoc entry radius",
              "audit exact identification between V17 theorem discretization and finite matrix"
            ]
          }
          with open("v18-decision.json","w") as f:json.dump(decision,f,indent=2)
          print(json.dumps(decision,indent=2))
          print("FAIL-CLOSED: continuum_certified=false")
          PY

      - name: Write ledger
        run: |
          cat > V18-LEDGER.txt <<'EOF'
          V18 — FINITE SPECTRAL CERTIFICATE, ROW 326

          Goal:
              certify lambda_max(C_N) < mu at N=1200.

          Strategy:
              prove positive definiteness of mu I - C_N.

          V18 computes the top finite eigenpair, residual, spectral gap,
          Gershgorin sanity bound, and a shifted LDL/eigenvalue margin. It
          assigns an explicit neighborhood radius to the stored binary64
          matrix and checks that the shifted positive-definiteness margin is
          larger than this radius.

          An Arb interval Cholesky is also exercised on a principal block.

          IMPORTANT FAIL-CLOSED LIMITATION:
          V18 does not call the full 1198x1198 matrix interval-certified.
          The post-hoc binary64 entry radius is an engineering enclosure, not
          yet a proof that every operation constructing C_N was outward-rounded.

          V19 must either:
            (a) construct the finite matrix directly with interval arithmetic
                and certify mu I-C_N positive definite, or
            (b) derive a rigorous backward-error certificate for the complete
                floating construction and factorization.

          V17 continuum error is only assembled after the finite bound.

          continuum_certified=false.
          NO T1/RH PROOF CLAIM IS MADE.
          EOF

      - name: Upload V18 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v18-finite-spectral-row326
          path: |
            v18-candidate.json
            v18-representation-audit.json
            v18-input-radius.json
            v18-residual-cert.json
            v18-gershgorin.json
            v18-shift-cert.json
            v18-arb-block.json
            v18-assembly.json
            v18-decision.json
            V18-LEDGER.txt