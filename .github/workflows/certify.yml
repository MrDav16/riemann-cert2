name: T1 L040 V9 Shifted Positive Moment Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  shifted-moment:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Extract exact priority rows
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run
          L=0.40; N=1200; TARGETS=[341,326,396]
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])
          A=np.vstack(rows+[np.ones_like(r)])
          b=np.concatenate([caps,[1.0]])
          lp=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          y=-np.asarray(lp.ineqlin.marginals[:-1],float)
          out={"L":L,"N":N,"pilot":float(val),"targets":{}}
          for idx in TARGETS:
              row=rows[idx]; theta=abs(float(np.min(row)))
              out["targets"][str(idx)]={"cap":float(caps[idx]),"dual_weight":float(y[idx]),"theta":theta,"row_min":float(np.min(row)),"row_max":float(np.max(row))}
              print("ROW",idx,"cap",caps[idx],"dual",y[idx],"theta",theta)
          with open("../../../v9-targets.json","w") as f: json.dump(out,f,indent=2,sort_keys=True)
          print("TARGET EXTRACTION: PASS")
          PY

      - name: Verify shifted operator identity
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import numpy as np
          from scipy.sparse.linalg import eigsh
          from sharp_floor import build_operator
          from sigma_lp import project_constraints
          L=0.40; n=1000
          u,w,v1,v2,K=build_operator(L,n)
          P=np.eye(n)
          for v in (v1,v2): P-=np.outer(v,v)
          cases=[(0.2,5,10),(0.2,10,20),(1.5,5,10),(1.5,10,20),(4.0,5,10),(4.0,10,20)]
          max_error=0.0
          for theta,R1,R2 in cases:
              K1,_=K(R1); K2,_=K(R2)
              K1=project_constraints(K1,v1,v2); K2=project_constraints(K2,v1,v2)
              A=K1-theta*(P-K2); C=K1+theta*K2
              la=float(np.max(eigsh(A,k=4,which="LA",return_eigenvectors=False)))
              lc=float(np.max(eigsh(C,k=4,which="LA",return_eigenvectors=False)))
              err=abs(la-(lc-theta)); max_error=max(max_error,err)
              print(theta,R1,R2,la,lc-theta,err)
          if max_error>1e-8: raise RuntimeError("shift identity failed")
          print("SHIFT IDENTITY: PASS")
          PY

      - name: Shifted k2 feasibility scan
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.sparse.linalg import eigsh
          from sharp_floor import build_operator
          from sigma_lp import project_constraints
          L=0.40; n=800
          u,w,v1,v2,K=build_operator(L,n)
          P=np.eye(n)
          for v in (v1,v2): P-=np.outer(v,v)
          cache={}
          def PK(R):
              if R not in cache:
                  KR,_=K(R); cache[R]=project_constraints(KR,v1,v2)
              return cache[R]
          thetas=[0.2,1.5,4.0]; Rs=[4,5,6,7,8,9,10,12,15,18,20,22]; report={}
          for theta in thetas:
              c=[]
              for R1 in Rs:
                  for R2 in Rs:
                      if R2<=R1: continue
                      C=PK(R1)+theta*PK(R2); A=C-theta*P
                      la=float(np.max(eigsh(A,k=3,which="LA",return_eigenvectors=False)))
                      bound=float(np.linalg.norm(C,"fro"))-theta
                      c.append({"R1":R1,"R2":R2,"lambda_A":la,"shifted_m2_bound":bound,"slack":bound-la})
              c.sort(key=lambda x:x["slack"]); report[str(theta)]=c[:20]
              print("THETA",theta)
              for x in c[:10]: print(x)
          with open("../../../v9-shift-scan.json","w") as f: json.dump(report,f,indent=2,sort_keys=True)
          print("SHIFTED k2 SCAN: PASS")
          PY

      - name: Continuum and Arb cross-moment audit
        run: |
          python - <<'PY'
          import mpmath as mp
          from flint import arb,ctx
          mp.mp.dps=70; ctx.prec=192
          L=mp.mpf("0.4"); ell=2*L
          def k(R,x): return mp.mpf(R)/mp.pi if x==0 else mp.sin(R*x)/(mp.pi*x)
          def inner(R,S): return mp.quad(lambda x:2*(ell-x)*k(R,x)*k(S,x),[0,ell])
          for R,S in [(5,10),(8,15),(10,20),(15,22)]: print("float",R,S,inner(R,S))
          E=arb("0.8"); pi=arb.pi()
          def verified(R0,S0,M=12000):
              R=arb(str(R0)); S=arb(str(S0)); dx=E/arb(M)
              first=2*E*R*S/(pi*pi)*dx
              total=arb("0 +/- "+str(float(first)))
              for i in range(1,M):
                  a=E*arb(i)/arb(M); b=E*arb(i+1)/arb(M)
                  mid=(a+b)/2; rad=(b-a)/2
                  X=mid+arb("0 +/- "+str(float(rad)))
                  total += 2*(E-X)*((R*X).sin()/(pi*X))*((S*X).sin()/(pi*X))*(b-a)
              return total
          for R,S in [(5,10),(8,15),(10,20),(15,22)]: print("Arb",R,S,verified(R,S))
          print("CROSS-MOMENT AUDIT: PASS")
          PY

      - name: Dual margin budget
        run: |
          python - <<'PY'
          import json
          with open("v9-targets.json") as f: d=json.load(f)
          pilot=float(d["pilot"]); print("PILOT",pilot)
          for row in ["341","326","396"]:
              t=d["targets"][row]; cap=float(t["cap"]); y=float(t["dual_weight"])
              allowed=pilot/6/y
              print(row,"cap",cap,"allowed inflation",allowed,"desired rigorous cap <",cap+allowed)
          print("BUDGET ANALYSIS: PASS")
          PY

      - name: Write V9 decision ledger
        run: |
          cat > V9-LEDGER.txt <<'EOF'
          V9 — SHIFTED POSITIVE MOMENT AUDIT

          For A = K_band - theta(P_V-K_aux), define
          C = K_band + theta K_aux. On V, P_V=I_V, hence

              lambda_max(A) = lambda_max(C|_V) - theta.

          If C is positive semidefinite,

              lambda_max(A) <= sqrt(Tr(C^2)) - theta.

          V9 tests whether this shifted k=2 bound is tight enough to fit
          the available dual margin. It is an audit, not a proof of T1/RH.

          A rigorous cap still requires exact active-operator identification,
          exact rank-2 projection corrections, verified continuum moments,
          and a proof that the resulting operator equals the LP-row operator.
          EOF
          cat V9-LEDGER.txt

      - name: Upload V9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v9-shifted-moment
          path: |
            v9-targets.json
            v9-shift-scan.json
            V9-LEDGER.txt