name: T1 L040 V15 Exact Kernel Discretization Prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  exact-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint
      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
      - name: Extract row 326 and exact kernel moments
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, math, numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run
          L=.40; N=1200; ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])
          AA=np.vstack(rows+[np.ones_like(r)])
          bb=np.concatenate([caps,[1.]])
          lp=linprog(cost-tail,A_ub=AA,b_ub=bb,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          dual=-np.asarray(lp.ineqlin.marginals[:-1],float)
          sig=rows[ROW]; theta=abs(float(sig.min())); c=sig+theta
          slope=np.diff(c)/np.diff(r); ids=[0]
          for i in range(1,len(slope)):
              if abs(slope[i]-slope[i-1])>1e-10: ids.append(i)
          ids.append(len(r)-1); ids=sorted(set(ids))
          knots=[[float(r[i]),float(c[i])] for i in ids]
          seg=[]
          for (a,ya),(b,yb) in zip(knots[:-1],knots[1:]):
              if b==a: continue
              A=(yb-ya)/(b-a); B=ya-A*a
              seg.append({"a":a,"b":b,"alpha":A,"beta":B})
          def moment(p):
              s=0.
              for z in seg:
                  a,b,A,B=z["a"],z["b"],z["alpha"],z["beta"]
                  s+=A*(b**(p+2)-a**(p+2))/(p+2)
                  s+=B*(b**(p+1)-a**(p+1))/(p+1)
              return s
          moments={str(p):moment(p) for p in range(17)}
          out={"L":L,"pilot":float(val),"cap":float(caps[ROW]),
               "dual":float(dual[ROW]),"theta":theta,"r":r.tolist(),
               "c":c.tolist(),"knots":knots,"segments":seg,"moments":moments}
          with open("../../../v15-input.json","w") as f: json.dump(out,f,indent=2)
          print("cap",out["cap"],"theta",theta,"knots",knots)
          print("M2",moments["2"])
          print("INPUT/MOMENTS: PASS")
          PY
      - name: Validate analytic kernel against spectral quadrature
        run: |
          python - <<'PY'
          import json, math, numpy as np
          with open("v15-input.json") as f:d=json.load(f)
          seg=d["segments"]; r=np.asarray(d["r"]); c=np.asarray(d["c"])
          M={int(k):v for k,v in d["moments"].items()}
          def kernel(x):
              if abs(x)<1e-4:
                  return sum(((-1)**m)*M[2*m]*x**(2*m)/math.factorial(2*m)
                             for m in range(8))/math.pi
              s=0.
              for z in seg:
                  a,b,A,B=z["a"],z["b"],z["alpha"],z["beta"]
                  def F(q):
                      return A*(q*math.sin(q*x)/x+math.cos(q*x)/x**2)+B*math.sin(q*x)/x
                  s+=F(b)-F(a)
              return s/math.pi
          worst=0.
          for x in np.linspace(-.8,.8,321):
              old=np.trapezoid(c*np.cos(r*x),r)/np.pi
              worst=max(worst,abs(kernel(float(x))-old))
          print("worst analytic-vs-old spectral quadrature",worst)
          if worst>5e-4: raise RuntimeError("kernel mismatch too large")
          with open("v15-kernel-check.json","w") as f:json.dump({"worst":worst},f)
          print("ANALYTIC KERNEL: PASS")
          PY
      - name: Rigorous global derivative and interpolation bound
        run: |
          python - <<'PY'
          import json, math
          with open("v15-input.json") as f:d=json.load(f)
          L=float(d["L"]); M={int(k):float(v) for k,v in d["moments"].items()}
          # c>=0 => |k^(m)(x)| <= M_m/pi.
          deriv={str(m):M[m]/math.pi for m in range(9)}
          K2=deriv["2"]; target=0.009985144429060205
          out={"derivative_bounds":deriv,"target":target,"N":{}}
          for N in [20,40,60,80,100,150,200,300,400,600,800,1200]:
              h=2*L/(N-1)
              sup_err=h*h*K2/8
              # Schur: ||E|| <= 2L ||e||_inf
              op_err=2*L*sup_err
              out["N"][str(N)]={"h":h,"kernel_sup_error":sup_err,
                                "operator_error":op_err,"beats_target":op_err<target}
              print(N,out["N"][str(N)])
          viable=[int(n) for n,x in out["N"].items() if x["beats_target"]]
          out["first_tested_viable_N"]=min(viable) if viable else None
          if not viable: raise RuntimeError("no tested N beats target")
          with open("v15-interpolation-bound.json","w") as f:json.dump(out,f,indent=2)
          print("FIRST VIABLE N",out["first_tested_viable_N"])
          print("UNPROJECTED OPERATOR ERROR BOUND: PASS")
          PY
      - name: Arb kernel primitive audit
        run: |
          python - <<'PY'
          import json, math
          from flint import arb,ctx
          ctx.prec=192
          with open("v15-input.json") as f:d=json.load(f)
          S=[tuple(arb(str(z[k])) for k in ["a","b","alpha","beta"]) for z in d["segments"]]
          pi=arb.pi()
          def moment(p):
              s=arb(0)
              for a,b,A,B in S:
                  s+=A*(b**(p+2)-a**(p+2))/arb(p+2)
                  s+=B*(b**(p+1)-a**(p+1))/arb(p+1)
              return s
          vals={}
          for m in range(9):
              vals[str(m)]=str(moment(m)/pi)
          with open("v15-arb-derivatives.json","w") as f:json.dump(vals,f,indent=2)
          print(vals)
          print("ARB MOMENT BOUNDS: PASS")
          PY
      - name: Projection gap audit
        run: |
          python - <<'PY'
          import json,math
          with open("v15-input.json") as f:d=json.load(f)
          L=float(d["L"])
          out={
            "constraint_functions":["exp(u/2)","exp(-u/2)"],
            "gram_product_exponents":[1,-1,0],
            "trapezoid_second_derivative_bounds":{
              "exp(u)":math.exp(L),
              "exp(-u)":math.exp(L),
              "1":0.0
            },
            "status":"EXPLICIT_PROJECTOR_PERTURBATION_BOUND_REQUIRED"
          }
          with open("v15-projector-audit.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY
      - name: Fail-closed decision
        run: |
          python - <<'PY'
          import json
          with open("v15-interpolation-bound.json") as f:i=json.load(f)
          n=i["first_tested_viable_N"]
          decision={
            "row":326,
            "continuum_certified":False,
            "status":"UNPROJECTED_KERNEL_ERROR_BOUND_AVAILABLE",
            "first_tested_N":n,
            "operator_error_bound":i["N"][str(n)]["operator_error"],
            "target":i["target"],
            "remaining_gap":[
              "continuous-vs-discrete rank-2 projector perturbation",
              "certified finite spectral upper bound for same discretization",
              "combine errors without double counting"
            ]
          }
          with open("v15-decision.json","w") as f:json.dump(decision,f,indent=2)
          print(json.dumps(decision,indent=2))
          print("FAIL-CLOSED: continuum_certified=false")
          PY
      - name: Write ledger
        run: |
          cat > V15-LEDGER.txt <<'EOF'
          V15 â€” EXACT KERNEL DISCRETIZATION PROTOTYPE

          For the nonnegative row-326 profile c(r),

              k(x) = (1/pi) integral c(r) cos(rx) dr.

          Since c(r)>=0,

              |k^(m)(x)| <= (1/pi) integral c(r) r^m dr.

          Thus the exact piecewise-linear spectral moments give global
          derivative bounds without the loose generic sinc estimates of V14.

          For uniform linear interpolation with spacing h,

              ||k-I_h k||_infinity <= h^2 sup|k''| / 8.

          Schur's test then yields on [-L,L]

              ||C-C_h|| <= 2L ||k-I_h k||_infinity.

          V15 checks whether this explicit unprojected-kernel error beats the
          V14 target 0.009985144429.

          Remaining gap: the continuous rank-2 pole projector must be compared
          rigorously with the quadrature-defined finite projector, and a finite
          spectral upper bound must be certified for the same discretization.

          continuum_certified = false.
          NO T1/RH PROOF CLAIM IS MADE.
          EOF
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v15-exact-kernel
          path: |
            v15-input.json
            v15-kernel-check.json
            v15-interpolation-bound.json
            v15-arb-derivatives.json
            v15-projector-audit.json
            v15-decision.json
            V15-LEDGER.txt