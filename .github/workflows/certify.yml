name: T1 L040 V17 Formal Rank2 Projector Bound

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  formal-projector:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Exact continuous Gram and conditioning
        run: |
          python - <<'PY'
          import json
          from flint import arb,ctx
          ctx.prec=192
          L=arb("0.4")
          a=2*L.sinh(); b=2*L
          lmin=a-b; lmax=a+b
          out={"L":"0.4","a":str(a),"b":str(b),
               "lambda_min":str(lmin),"lambda_max":str(lmax)}
          with open("v17-continuous-gram.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("CONTINUOUS GRAM: PASS")
          PY

      - name: Formal sampling map error for constraints
        run: |
          python - <<'PY'
          import json,math
          L=.4; length=2*L

          # Let T:R^2->L2, T(a,b)=a exp(u/2)+b exp(-u/2).
          # Let J_N be piecewise-linear interpolation of nodal samples.
          # For any f=Tz, scalar interpolation gives
          # ||f-J_N f||_inf <= h^2/8 ||f''||_inf.
          #
          # f''=(1/4)f. By Cauchy-Schwarz in coefficient space:
          # |f(u)| <= ||z||_2 sqrt(exp(u)+exp(-u))
          # <= ||z||_2 sqrt(2 cosh(L)).
          #
          # Hence
          # ||(T-J_N S_N T)z||_L2
          # <= sqrt(2L)*h^2/32*sqrt(2 cosh L)*||z||.
          #
          # This is an explicit operator-norm bound delta_T.

          out={"N":{}}
          for N in [200,400,600,800,1200,1600]:
              h=length/(N-1)
              delta=math.sqrt(length)*(h*h/32)*math.sqrt(2*math.cosh(L))
              out["N"][str(N)]={"h":h,"synthesis_operator_error":delta}
              print(N,out["N"][str(N)])
          with open("v17-synthesis-error.json","w") as f:json.dump(out,f,indent=2)
          print("SYNTHESIS ERROR THEOREM: PASS")
          PY

      - name: Formal subspace projector theorem
        run: |
          python - <<'PY'
          import json,math
          with open("v17-synthesis-error.json") as f:s=json.load(f)
          L=.4
          a=2*math.sinh(L); b=2*L
          sigma=math.sqrt(a-b)

          # Lemma used:
          # If T has smallest singular value sigma>0 and ||T-T_N||<=delta<sigma,
          # then for ranges M=Ran(T), M_N=Ran(T_N),
          #
          # gap(M,M_N) <= delta/(sigma-delta).
          #
          # For equal finite dimensions, orthogonal projectors satisfy
          # ||P_M-P_MN|| <= gap bound.
          #
          # Our desired pole-removal projectors are complements, so the same
          # norm difference applies.
          out={"sigma_min_T":sigma,"N":{}}
          for N,x in s["N"].items():
              delta=x["synthesis_operator_error"]
              if delta>=sigma:
                  pp=float("inf")
              else:
                  pp=delta/(sigma-delta)
              out["N"][N]={"delta_T":delta,"projector_bound":pp,
                           "condition_delta_lt_sigma":delta<sigma}
              print(N,out["N"][N])
          with open("v17-formal-projector.json","w") as f:json.dump(out,f,indent=2)
          print("FORMAL PROJECTOR BOUND: PASS")
          PY

      - name: Independent finite-dimensional regression of theorem
        run: |
          python - <<'PY'
          import numpy as np,json
          rng=np.random.default_rng(1701)
          tests=[]
          for m in [10,30,80]:
              for _ in range(4):
                  T=rng.normal(size=(m,2))
                  # Ensure healthy rank.
                  s=np.linalg.svd(T,compute_uv=False)
                  sigma=s[-1]
                  E=rng.normal(size=(m,2))
                  E*=0.02*sigma/np.linalg.norm(E,2)
                  TN=T+E
                  delta=np.linalg.norm(E,2)
                  Q=np.linalg.qr(T)[0][:,:2]
                  QN=np.linalg.qr(TN)[0][:,:2]
                  P=Q@Q.T; PN=QN@QN.T
                  actual=np.linalg.norm(P-PN,2)
                  bound=delta/(sigma-delta)
                  ok=actual<=bound*(1+1e-10)
                  tests.append({"m":m,"actual":float(actual),"bound":float(bound),"pass":bool(ok)})
                  if not ok:raise RuntimeError("projector theorem regression failed")
          with open("v17-theorem-regression.json","w") as f:json.dump(tests,f,indent=2)
          print("THEOREM REGRESSION: PASS")
          PY

      - name: Combine with V15 kernel theorem
        run: |
          python - <<'PY'
          import json,math
          with open("v17-formal-projector.json") as f:p=json.load(f)
          L=.4
          target=0.009985144429060205
          K2=37.407263223336415

          # Exact-profile Schur norm scale from V15:
          # ||B|| <= 2L*k(0), k(0)=M0/pi.
          M0_over_pi=0.6557183655386088
          Bnorm=2*L*M0_over_pi

          out={"target":target,"Bnorm_schur":Bnorm,"N":{}}
          for N in [200,400,600,800,1200,1600]:
              h=2*L/(N-1)
              kernel=2*L*(h*h*K2/8)
              pp=p["N"][str(N)]["projector_bound"]

              # ||PBP-QBQ|| <= 2||B||||P-Q||.
              projector=2*Bnorm*pp
              total=kernel+projector
              out["N"][str(N)]={"kernel_error":kernel,
                                "formal_projector_contribution":projector,
                                "combined_formal_bound":total,
                                "beats_target":bool(total<target)}
              print(N,out["N"][str(N)])

          viable=[int(n) for n,x in out["N"].items() if x["beats_target"]]
          out["first_formally_viable_tested_N"]=min(viable) if viable else None
          with open("v17-combined-formal.json","w") as f:json.dump(out,f,indent=2)
          print("FIRST FORMALLY VIABLE TESTED N =",out["first_formally_viable_tested_N"])
          if out["first_formally_viable_tested_N"] is None:
              raise RuntimeError("formal projector route misses V14 target")
          print("FORMAL COMBINED ERROR BUDGET: PASS")
          PY

      - name: Finite spectral target at N1200
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.optimize import linprog
          from scipy.linalg import null_space,eigvalsh
          from sigma_t1c import run
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          L=.4; N=1200; ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          sig=rows[ROW]; theta=abs(float(sig.min())); c=sig+theta

          u,w,v1,v2,K=build_operator(L,N)
          Q=null_space(np.column_stack([v1,v2]).T)
          CV=Q.T@profile_operator(c,r,u,w,v1,v2)@Q
          ev=eigvalsh(CV)
          emax=float(ev[-1])
          tr8=float(np.sum(np.maximum(ev,0.)**8))
          root8=tr8**(1/8)

          out={"N":N,"lambda_max_C":emax,
               "lambda_max_shifted":emax-theta,
               "trace8":tr8,"root8":root8,
               "trace8_shifted_bound":root8-theta,
               "reference_cap":float(caps[ROW])}
          with open("../../../v17-finite-target.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("FINITE TARGET: PASS")
          PY

      - name: Arb finite spectral architecture audit
        run: |
          python - <<'PY'
          import json
          from flint import arb,ctx
          ctx.prec=192
          with open("v17-finite-target.json") as f:d=json.load(f)

          # V17 does not yet build the full 1200x1200 Arb eigensystem.
          # It establishes the interval target that V18 must certify.
          lam=arb(str(d["lambda_max_C"])) + arb("0 +/- 1e-12")
          tr8=arb(str(d["trace8"])) + arb("0 +/- 1e-14")
          out={"lambda_demo_interval":str(lam),"trace8_demo_interval":str(tr8),
               "full_finite_interval_certificate":False}
          with open("v17-arb-target.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("ARB TARGET ARCHITECTURE: PASS")
          PY

      - name: Fail-closed V17 decision
        run: |
          python - <<'PY'
          import json
          with open("v17-combined-formal.json") as f:c=json.load(f)
          n=c["first_formally_viable_tested_N"]
          decision={
            "row":326,
            "continuum_certified":False,
            "status":"FORMAL_PROJECTOR_BOUND_AVAILABLE",
            "first_formally_viable_tested_N":n,
            "combined_error_at_N1200":c["N"]["1200"]["combined_formal_bound"],
            "V14_target":c["target"],
            "remaining_gap":[
              "certified interval upper bound for the finite N=1200 spectral quantity",
              "audit that finite representation used by spectral certificate matches the theorem discretization",
              "final no-double-counting assembly"
            ]
          }
          with open("v17-decision.json","w") as f:json.dump(decision,f,indent=2)
          print(json.dumps(decision,indent=2))
          print("FAIL-CLOSED: continuum_certified=false")
          PY

      - name: Write ledger
        run: |
          cat > V17-LEDGER.txt <<'EOF'
          V17 â€” FORMAL RANK-2 PROJECTOR BOUND

          The continuous constraint synthesis map is

              T(a,b)=a exp(u/2)+b exp(-u/2).

          Its smallest singular value is known exactly from the 2x2 Gram
          matrix. Piecewise-linear interpolation gives an explicit operator
          error delta = ||T-T_N||.

          For delta < sigma_min(T), the range-subspace perturbation estimate

              ||P-P_N|| <= delta/(sigma_min(T)-delta)

          is used, with P and P_N the orthogonal projectors onto the
          corresponding two-dimensional constraint ranges (or their
          complements).

          This replaces the deliberately loose engineering proxy from V16.1.

          The bound is combined with the V15 kernel interpolation theorem via

              ||PBP-P_N B_N P_N||
              <= ||B-B_N|| + 2||B|| ||P-P_N||,

          under the common-space interpolation model used in this audit.

          V17 remains fail-closed because the finite N=1200 spectral upper
          bound is not yet interval-certified, and the precise identification
          of that finite matrix with the theorem discretization must be audited.

          continuum_certified=false.
          NO T1/RH PROOF CLAIM IS MADE.
          EOF

      - name: Upload V17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v17-formal-projector
          path: |
            v17-continuous-gram.json
            v17-synthesis-error.json
            v17-formal-projector.json
            v17-theorem-regression.json
            v17-combined-formal.json
            v17-finite-target.json
            v17-arb-target.json
            v17-decision.json
            V17-LEDGER.txt