name: T1 L040 V12 k8 Continuum Route Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  k8-continuum-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Extract exact active shifted profiles
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run

          L=.40; N=1200; targets=[341,326,396]
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])

          A=np.vstack(rows+[np.ones_like(r)])
          b=np.concatenate([caps,[1.]])
          lp=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          dual=-np.asarray(lp.ineqlin.marginals[:-1],float)

          out={"L":L,"pilot":float(val),"r":r.tolist(),"targets":{}}
          for j in targets:
              sig=rows[j]
              theta=abs(float(sig.min()))
              c=sig+theta
              if c.min() < -1e-12:
                  raise RuntimeError(f"row {j}: shifted profile negative")
              out["targets"][str(j)]={
                  "cap":float(caps[j]),
                  "dual":float(dual[j]),
                  "theta":theta,
                  "sigma":sig.tolist(),
                  "c":c.tolist()
              }
              print("ROW",j,"cap",caps[j],"dual",dual[j],"theta",theta,
                    "cmin",c.min(),"cmax",c.max())

          with open("../../../v12-input.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("EXACT SHIFTED PROFILE EXTRACTION: PASS")
          PY

      - name: Recover piecewise-linear representation
        run: |
          python - <<'PY'
          import json,numpy as np

          with open("v12-input.json") as f: d=json.load(f)
          r=np.asarray(d["r"],float)
          out={}

          for row,item in d["targets"].items():
              c=np.asarray(item["c"],float)

              # Compress sampled profile into knots where discrete slope changes.
              slope=np.diff(c)/np.diff(r)
              ids=[0]
              for i in range(1,len(slope)):
                  if abs(slope[i]-slope[i-1])>1e-10:
                      ids.append(i)
              ids.append(len(r)-1)
              ids=sorted(set(ids))

              knots=[[float(r[i]),float(c[i])] for i in ids]
              # Verify interpolation reproduces every stored sample.
              recon=np.interp(r,[x[0] for x in knots],[x[1] for x in knots])
              err=float(np.max(np.abs(recon-c)))

              out[row]={"knots":knots,"sample_reconstruction_error":err}
              print("\nROW",row,"knots",len(knots),"error",err)
              print(knots)

              if err>1e-10:
                  raise RuntimeError(f"row {row}: piecewise-linear recovery failed")

          with open("v12-knots.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("\nPIECEWISE-LINEAR RECOVERY: PASS")
          PY

      - name: Finite k6 k8 reference moments
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigvalsh
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          with open("../../../v12-input.json") as f: d=json.load(f)
          r=np.asarray(d["r"],float)
          n=1200
          u,w,v1,v2,K=build_operator(.40,n)
          Q=null_space(np.column_stack([v1,v2]).T)

          out={}
          for row,item in d["targets"].items():
              c=np.asarray(item["c"],float)
              theta=float(item["theta"])
              CV=Q.T@profile_operator(c,r,u,w,v1,v2)@Q
              ev=eigvalsh(CV)
              ep=np.maximum(ev,0.)
              emax=float(ev[-1])

              rec={}
              for k in [6,8]:
                  tr=float(np.sum(ep**k))
                  root=float(tr**(1.0/k))
                  rec[str(k)]={
                      "trace_power":tr,
                      "root_trace_power":root,
                      "shifted_bound":root-theta
                  }
              out[row]=rec
              print("ROW",row,rec)

          with open("../../../v12-finite-reference.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("FINITE k6/k8 REFERENCE: PASS")
          PY

      - name: Validate rank-2 trace identity algebraically
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          with open("../../../v12-input.json") as f: d=json.load(f)
          r=np.asarray(d["r"],float)
          n=300
          u,w,v1,v2,K=build_operator(.40,n)
          U=np.column_stack([v1,v2])
          P=np.eye(n)-U@U.T

          # For T=PBP, Tr_V(T^k)=Tr((PBP)^k) on full space:
          # the two V-perp zero modes contribute nothing.
          out={}

          for row,item in d["targets"].items():
              c=np.asarray(item["c"],float)
              B=profile_operator(c,r,u,w,v1,v2)

              # profile_operator is already projected in the reference code;
              # verify idempotent compression and full-space trace equivalence.
              T=P@B@P
              proj_err=float(np.linalg.norm(T-B,"fro"))

              rec={"projection_error":proj_err}
              X=np.eye(n)
              for k in range(1,9):
                  X=X@T
                  if k in [2,4,6,8]:
                      rec[f"trace_{k}"]=float(np.trace(X))
              out[row]=rec
              print("ROW",row,rec)

              if proj_err>1e-8:
                  raise RuntimeError(f"row {row}: projection consistency failed")

          with open("../../../v12-rank2-identity.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("RANK-2 TRACE IDENTITY: PASS")
          PY

      - name: Derive unprojected kernel quadrature convergence
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigvalsh
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          with open("../../../v12-input.json") as f: d=json.load(f)
          r=np.asarray(d["r"],float)

          # This stage is deliberately diagnostic: determine how quickly
          # Tr((PBP)^8) converges with spatial quadrature n.
          ns=[120,180,240,320,480,640]
          out={}

          for n in ns:
              u,w,v1,v2,K=build_operator(.40,n)
              Q=null_space(np.column_stack([v1,v2]).T)
              out[str(n)]={}
              for row,item in d["targets"].items():
                  c=np.asarray(item["c"],float)
                  CV=Q.T@profile_operator(c,r,u,w,v1,v2)@Q
                  ev=np.maximum(eigvalsh(CV),0.)
                  tr6=float(np.sum(ev**6))
                  tr8=float(np.sum(ev**8))
                  out[str(n)][row]={"tr6":tr6,"tr8":tr8}
                  print("n",n,"row",row,"tr6",tr6,"tr8",tr8)

          with open("../../../v12-quadrature-convergence.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("QUADRATURE CONVERGENCE AUDIT: PASS")
          PY

      - name: Interval arithmetic primitive audit
        run: |
          python - <<'PY'
          from flint import arb,ctx
          ctx.prec=192

          # V12 does not pretend to certify the 8-fold trace integral yet.
          # It verifies the interval primitives needed for a fail-closed V13:
          # sinc evaluation including x=0, interval multiplication, and
          # piecewise-linear spectral profile evaluation.

          pi=arb.pi()

          def sinc_kernel(R,x):
              if x==0:
                  return arb(str(R))/pi
              R=arb(str(R))
              return (R*x).sin()/(pi*x)

          vals=[]
          for R in [1,5,10,22]:
              vals.append(str(sinc_kernel(R,arb("0"))))
              vals.append(str(sinc_kernel(R,arb("0.1 +/- 1e-8"))))

          for x in vals: print(x)
          print("ARB PRIMITIVES: PASS")
          PY

      - name: Compute k8 certification error budget
        run: |
          python - <<'PY'
          import json
          with open("v12-input.json") as f: inp=json.load(f)
          with open("v12-finite-reference.json") as f: ref=json.load(f)

          pilot=float(inp["pilot"])
          loss=0.
          rows={}

          for row in ["341","326","396"]:
              cap=float(inp["targets"][row]["cap"])
              y=float(inp["targets"][row]["dual"])
              b=float(ref[row]["8"]["shifted_bound"])
              infl=max(b-cap,0.)
              wl=y*infl
              loss+=wl
              rows[row]={"cap":cap,"k8_bound":b,"inflation":infl,
                         "dual":y,"weighted_loss":wl}

          reserve=pilot-loss

          # Translate remaining dual reserve into a conservative equal
          # per-row cap-error budget (weighted equally in objective loss).
          per_loss=reserve/6.0
          for row in rows:
              y=rows[row]["dual"]
              rows[row]["suggested_extra_cap_budget"]=per_loss/y

          out={"pilot":pilot,"finite_k8_loss":loss,
               "finite_k8_remaining":reserve,
               "suggested_reserved_loss_per_priority_row":per_loss,
               "rows":rows}

          with open("v12-error-budget.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)

          print(json.dumps(out,indent=2))
          if reserve<=0:
              raise RuntimeError("k8 no longer has positive finite reserve")
          print("K8 ERROR BUDGET: PASS")
          PY

      - name: Write V12 decision ledger
        run: |
          cat > V12-LEDGER.txt <<'EOF'
          V12 — k=8 CONTINUUM ROUTE AUDIT

          V11 established finite-dimensional numerical viability at k=6 and
          a substantially larger reserve at k=8.

          V12 therefore selects k=8 as the primary certification target and
          k=6 as a cross-check.

          For each exact shifted positive profile c_j, the desired rigorous
          inequality is

              lambda_max(C_j|V)
              <= Tr_V((C_j|V)^8)^(1/8).

          The active signed cap is then bounded by

              Lambda_j
              <= Tr_V((C_j|V)^8)^(1/8) - theta_j.

          V12 performs the prerequisites:
            * exact stored-profile extraction;
            * piecewise-linear knot recovery;
            * finite k=6 and k=8 reference values;
            * explicit rank-2/projector trace identity checks;
            * quadrature convergence diagnostics;
            * Arb primitive checks;
            * a fail-closed error budget for future rigorous enclosures.

          V12 DOES NOT claim that an 8-fold continuum integral has been
          rigorously evaluated. It is an architecture/feasibility audit.

          A future rigorous stage must derive and interval-enclose the
          continuum trace of (P C P)^8, or an equivalent rigorously justified
          upper bound, and keep the resulting cap inflation inside the V12
          dual error budget.

          NO T1/RH CERTIFICATION CLAIM IS MADE BY V12.
          EOF
          cat V12-LEDGER.txt

      - name: Upload V12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v12-k8-continuum-route
          path: |
            v12-input.json
            v12-knots.json
            v12-finite-reference.json
            v12-rank2-identity.json
            v12-quadrature-convergence.json
            v12-error-budget.json
            V12-LEDGER.txt