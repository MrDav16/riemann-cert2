name: T1 L040 V4 Spectral Enclosures

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  spectral:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = \
            "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Reconstruct and analyze priority signed operators
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json
          import numpy as np

          from scipy.optimize import linprog
          from flint import arb, ctx

          from sigma_t1c import run

          ctx.prec = 160

          L = 0.40
          TARGETS = [341, 326, 396]

          val, st = run(L, verbose=True)

          r = np.asarray(
              st["r"],
              dtype=float
          )

          rows = [
              np.asarray(x, dtype=float)
              for x in st["rows"]
          ]

          caps = np.asarray(
              st["caps"],
              dtype=float
          )

          cost = np.asarray(
              st["cost"],
              dtype=float
          )

          tail = float(st["tail"])

          A = np.vstack(
              rows + [np.ones_like(r)]
          )

          b = np.concatenate(
              [caps, [1.0]]
          )

          lp = linprog(
              cost - tail,
              A_ub=A,
              b_ub=b,
              bounds=(0, None),
              method="highs"
          )

          if not lp.success:
              raise RuntimeError(
                  lp.message
              )

          y = -np.asarray(
              lp.ineqlin.marginals[:-1],
              dtype=float
          )

          print(
              "state keys:",
              sorted(st.keys())
          )

          report = {
              "L": L,

              "pilot_floor":
                  float(val),

              "targets": [],

              "arb_precision_bits":
                  int(ctx.prec),

              "status":
                  "FINITE_DIMENSIONAL_ENCLOSURE_ONLY"
          }

          print()
          print("=" * 72)
          print("PRIORITY SIGNED ROWS")
          print("=" * 72)

          for idx in TARGETS:

              sigma = rows[idx]

              item = {
                  "row":
                      idx,

                  "dual_weight":
                      float(y[idx]),

                  "published_cap_float":
                      float(caps[idx]),

                  "sigma_min":
                      float(
                          np.min(sigma)
                      ),

                  "sigma_max":
                      float(
                          np.max(sigma)
                      )
              }

              print()
              print(
                  "ROW",
                  idx
              )

              print(
                  "dual y =",
                  y[idx]
              )

              print(
                  "published cap =",
                  caps[idx]
              )

              print(
                  "sigma range =",
                  np.min(sigma),
                  np.max(sigma)
              )

              # ---------------------------------------
              # Arb enclosure of the stored FLOAT cap.
              #
              # IMPORTANT:
              # This encloses representation/rounding
              # only. It is NOT yet an operator-level
              # spectral certificate.
              # ---------------------------------------

              c = arb(
                  str(caps[idx])
              )

              # python-flint 0.9-compatible
              # interval inflation.
              c_ball = (
                  c
                  + arb("0 +/- 1e-14")
              )

              item[
                  "float_cap_arb_ball"
              ] = str(c_ball)

              print(
                  "Arb ball around stored cap:",
                  c_ball
              )

              report[
                  "targets"
              ].append(item)

          with open(
              "../../../v4-priority.json",
              "w"
          ) as f:

              json.dump(
                  report,
                  f,
                  indent=2,
                  sort_keys=True
              )

          print()
          print("=" * 72)
          print("IMPORTANT")
          print("=" * 72)

          print(
              "These Arb balls enclose stored "
              "floating-point caps only."
          )

          print(
              "They DO NOT yet prove "
              "Lambda <= cap."
          )

          print(
              "The remaining theorem obligation "
              "is an operator-level continuum "
              "upper bound."
          )
          PY

      - name: Derive perturbation budget
        run: |
          python - <<'PY'
          from flint import arb, ctx

          ctx.prec = 160

          # For self-adjoint operators:
          #
          # lambda_max(A)
          # <= lambda_max(B)
          #    + ||A-B||_op
          #
          # and
          #
          # ||A-B||_op
          # <= ||A-B||_HS

          pilot = arb(
              "0.0847191143605307"
          )

          target_budget = arb(
              "0.04"
          )

          print(
              "float pilot ball =",
              pilot
          )

          print(
              "target total spectral-error "
              "budget <",
              target_budget
          )

          weights = {
              341:
                  arb("0.425044936115"),

              326:
                  arb("0.359339387719"),

              396:
                  arb("0.138901643818")
          }

          # Engineering allocation only.
          # Not itself part of the proof.

          per = (
              target_budget
              / arb(6)
          )

          print()
          print(
              "Suggested delta targets:"
          )

          for row, y in weights.items():

              delta = (
                  per / y
              )

              print(
                  row,
                  "delta <",
                  delta,
                  "gives weighted loss <",
                  per
              )

          print()
          print(
              "NEXT REQUIREMENT:"
          )

          print(
              "Construct proven delta_N "
              "with ||K-K_N|| <= delta_N."
          )
          PY

      - name: Inspect exact spectral implementation
        run: |
          echo "===== sigma_t1c spectral calls ====="

          grep -n \
            -E "eig|eigh|lambda|cap|project|kernel|signed|theta" \
            reference-riemann/experiments/weil_positivity/sigma_t1c.py \
            | head -n 250 \
            | tee spectral-source-map.txt || true

          echo "" >> spectral-source-map.txt
          echo "===== sigma_lp helpers =====" \
            >> spectral-source-map.txt

          grep -n \
            -E "eig|eigh|project|kernel|cap|sigma" \
            reference-riemann/experiments/weil_positivity/sigma_lp.py \
            | head -n 250 \
            >> spectral-source-map.txt || true

          echo "" >> spectral-source-map.txt
          echo "===== sharp_floor helpers =====" \
            >> spectral-source-map.txt

          grep -n \
            -E "eig|eigh|project|kernel|cap|moment|rank" \
            reference-riemann/experiments/weil_positivity/sharp_floor.py \
            | head -n 250 \
            >> spectral-source-map.txt || true

          cat spectral-source-map.txt

      - name: Write V4 status
        run: |
          cat > V4-STATUS.txt <<'EOF'
          V4 STATUS

          Expected PASS conditions:

          - pinned reference reproduced
          - rows 341, 326 and 396 recovered
          - Arb running at 160-bit precision
          - stored FLOAT caps enclosed by Arb balls
          - spectral implementation source map exported

          IMPORTANT

          This is NOT yet a continuum spectral
          certificate.

          Remaining mathematical obligation:

              lambda_max(A_continuous)
              <=
              lambda_max(A_N)
              + delta_N

          where delta_N is a rigorously proved
          approximation-error bound.

          Only after such a delta_N exists may
          rigorous Lambda+ values be charged
          against the positive dual margin.
          EOF

          cat V4-STATUS.txt

      - name: Upload V4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v4-spectral
          path: |
            v4-priority.json
            spectral-source-map.txt
            V4-STATUS.txt