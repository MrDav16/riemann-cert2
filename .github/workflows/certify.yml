name: T1 L040 V7 Operator Bound Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  operator-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = \
            "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Reproduce dual and signed targets
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run

          L = 0.40
          N = 2400
          TARGETS = [341, 326, 396]

          val, st = run(
              L,
              n=N,
              verbose=False
          )

          r = np.asarray(
              st["r"],
              dtype=float
          )

          rows = [
              np.asarray(x, dtype=float)
              for x in st["rows"]
          ]

          caps = np.asarray(
              st["caps"],
              dtype=float
          )

          cost = np.asarray(
              st["cost"],
              dtype=float
          )

          tail = float(
              st["tail"]
          )

          A = np.vstack(
              rows + [np.ones_like(r)]
          )

          b = np.concatenate(
              [caps, [1.0]]
          )

          lp = linprog(
              cost - tail,
              A_ub=A,
              b_ub=b,
              bounds=(0, None),
              method="highs"
          )

          if not lp.success:
              raise RuntimeError(
                  lp.message
              )

          y = -np.asarray(
              lp.ineqlin.marginals[:-1],
              dtype=float
          )

          report = {
              "L": L,
              "N": N,
              "pilot_floor": float(val),
              "targets": {}
          }

          print(
              "pilot floor =",
              repr(float(val))
          )

          for idx in TARGETS:

              report[
                  "targets"
              ][str(idx)] = {
                  "cap_N":
                      float(caps[idx]),

                  "dual_weight":
                      float(y[idx]),

                  "sigma_min":
                      float(
                          np.min(rows[idx])
                      ),

                  "sigma_max":
                      float(
                          np.max(rows[idx])
                      )
              }

              print()
              print(
                  "row",
                  idx
              )

              print(
                  "cap_N =",
                  repr(
                      float(caps[idx])
                  )
              )

              print(
                  "dual weight =",
                  repr(
                      float(y[idx])
                  )
              )

              print(
                  "sigma range =",
                  np.min(rows[idx]),
                  np.max(rows[idx])
              )

          with open(
              "../../../v7-targets.json",
              "w"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  sort_keys=True
              )
          PY

      - name: Verify projection contraction theorem numerically
        run: |
          python - <<'PY'
          import numpy as np

          rng = np.random.default_rng(
              20260916
          )

          # Mathematical theorem used later:
          #
          # for orthogonal projection P,
          #
          # ||P E P||_op <= ||E||_op
          # ||P E P||_HS <= ||E||_HS
          #
          # Numerical tests here are only
          # regression checks of implementation.

          for n in [20, 50, 100]:

              X = rng.normal(
                  size=(n, n)
              )

              E = (
                  X + X.T
              ) / 2

              Q, _ = np.linalg.qr(
                  rng.normal(
                      size=(n, 2)
                  )
              )

              P = (
                  np.eye(n)
                  - Q @ Q.T
              )

              PE = (
                  P @ E @ P
              )

              op_E = np.linalg.norm(
                  E,
                  2
              )

              op_PE = np.linalg.norm(
                  PE,
                  2
              )

              hs_E = np.linalg.norm(
                  E,
                  "fro"
              )

              hs_PE = np.linalg.norm(
                  PE,
                  "fro"
              )

              print(
                  n,
                  "op:",
                  op_PE,
                  "<=",
                  op_E,
                  "HS:",
                  hs_PE,
                  "<=",
                  hs_E
              )

              if op_PE > op_E + 1e-10:
                  raise RuntimeError(
                      "operator contraction failed"
                  )

              if hs_PE > hs_E + 1e-10:
                  raise RuntimeError(
                      "HS contraction failed"
                  )

          print(
              "PROJECTION CONTRACTION: PASS"
          )
          PY

      - name: Derive rigorous scalar kernel bounds
        run: |
          python - <<'PY'
          from flint import arb, ctx
          import json

          ctx.prec = 192

          pi = arb.pi()
          L = arb("0.4")
          ell = 2 * L

          # sinc kernel
          #
          # k_R(x)
          # = sin(Rx)/(pi x)
          # = (1/pi) int_0^R cos(tx) dt
          #
          # Therefore:
          #
          # |k|   <= R/pi
          # |k'|  <= R^2/(2pi)
          # |k''| <= R^3/(3pi)

          def bounds(R):

              R = arb(str(R))

              return {
                  "b0":
                      R / pi,

                  "b1":
                      R**2
                      / (2*pi),

                  "b2":
                      R**3
                      / (3*pi)
              }

          out = {}

          for R in [
              5, 8, 10, 12,
              15, 18, 20, 22
          ]:

              z = bounds(R)

              out[str(R)] = {
                  k: str(v)
                  for k, v in z.items()
              }

              print(
                  "R=",
                  R,
                  z
              )

          with open(
              "v7-kernel-bounds.json",
              "w"
          ) as f:
              json.dump(
                  out,
                  f,
                  indent=2
              )

          print()
          print(
              "interval length =",
              ell
          )

          print(
              "KERNEL DERIVATIVE BOUNDS: PASS"
          )
          PY

      - name: Build signed-combination error envelopes
        run: |
          python - <<'PY'
          from flint import arb, ctx
          import json

          ctx.prec = 192

          # ------------------------------------------------
          # For a signed combination
          #
          # K = sum_i a_i K_{R_i},
          #
          # triangle inequality gives
          #
          # |K''|
          # <= sum_i |a_i| R_i^3/(3 pi).
          #
          # We do NOT yet claim that every active
          # profile operator is exactly such a finite
          # sinc combination.
          #
          # This stage computes safe envelopes for
          # candidate combinations and records the
          # missing representation obligation.
          # ------------------------------------------------

          pi = arb.pi()
          L = arb("0.4")
          ell = 2 * L

          N = 2400

          h = (
              ell
              / arb(N - 1)
          )

          # Worst-case envelope:
          #
          # band term coefficient 1
          # plus signed theta term.
          #
          # Use R <= 22 throughout.
          #
          # theta inferred safely from row minimum:
          # 341 -> 1.5
          # 326 -> 0.2
          # 396 -> 4.0

          theta = {
              341: arb("1.5"),
              326: arb("0.2"),
              396: arb("4.0")
          }

          out = {}

          for row, th in theta.items():

              R = arb("22")

              b2_single = (
                  R**3
                  / (3*pi)
              )

              # Conservative triangle envelope.
              #
              # Identity contribution has zero
              # quadrature error in this derivative
              # model; the extra band operator is
              # bounded by theta times the same
              # worst-case R=22 kernel.

              b2_signed = (
                  (1 + th)
                  * b2_single
              )

              trap = (
                  ell
                  * h**2
                  * b2_signed
                  / 12
              )

              out[
                  str(row)
              ] = {
                  "theta":
                      str(th),

                  "sup_second_candidate":
                      str(b2_signed),

                  "scalar_trapezoid_candidate":
                      str(trap)
              }

              print()
              print(
                  "row",
                  row
              )

              print(
                  "theta =",
                  th
              )

              print(
                  "candidate sup second =",
                  b2_signed
              )

              print(
                  "candidate scalar trap =",
                  trap
              )

          with open(
              "v7-signed-envelope.json",
              "w"
          ) as f:
              json.dump(
                  out,
                  f,
                  indent=2
              )

          print()
          print(
              "IMPORTANT:"
          )

          print(
              "These are rigorous scalar "
              "triangle bounds conditional on "
              "the stated sinc representation."
          )

          print(
              "They are NOT yet full "
              "operator-norm delta_N values."
          )
          PY

      - name: Test tensor and Hilbert-Schmidt scaling
        run: |
          python - <<'PY'
          from flint import arb, ctx

          ctx.prec = 192

          # ------------------------------------------------
          # Suppose a kernel error e(u,v) satisfies
          #
          # |e(u,v)| <= eps uniformly
          #
          # on T x T, |T| = ell.
          #
          # Then
          #
          # ||E||_HS^2
          # = int_T int_T |e|^2
          # <= ell^2 eps^2
          #
          # hence
          #
          # ||E||_op <= ||E||_HS <= ell eps.
          #
          # This implication itself is rigorous.
          #
          # The unresolved step is proving that the
          # scalar trapezoid remainder from the prior
          # step is a UNIFORM kernel error eps for the
          # Nyström approximation.
          # ------------------------------------------------

          ell = arb("0.8")

          eps_examples = [
              arb("1e-5"),
              arb("1e-4"),
              arb("1e-3"),
              arb("1e-2")
          ]

          print(
              "UNIFORM KERNEL ERROR -> HS/OP"
          )

          for eps in eps_examples:

              hs = (
                  ell * eps
              )

              print(
                  "eps =",
                  eps,
                  "=> ||E||op <=",
                  hs
              )

          print()
          print(
              "THEOREM IMPLICATION: PASS"
          )
          PY

      - name: Candidate delta budget table
        run: |
          python - <<'PY'
          import json

          with open(
              "v7-targets.json"
          ) as f:
              targets = json.load(f)

          pilot = float(
              targets["pilot_floor"]
          )

          # These are hypothetical delta values
          # for budget analysis ONLY.

          deltas = [
              1e-5,
              1e-4,
              5e-4,
              1e-3,
              5e-3,
              1e-2
          ]

          print(
              "DUAL MARGIN STRESS TEST"
          )

          for delta in deltas:

              loss = 0.0

              for row in [
                  "341",
                  "326",
                  "396"
              ]:

                  y = (
                      targets[
                          "targets"
                      ][row][
                          "dual_weight"
                      ]
                  )

                  loss += (
                      y * delta
                  )

              print(
                  "delta each =",
                  delta,
                  "weighted loss =",
                  loss,
                  "remaining =",
                  pilot - loss
              )

          print()
          print(
              "DIAGNOSTIC ONLY."
          )
          PY

      - name: Create fail-closed proof ledger
        run: |
          cat > V7-PROOF-LEDGER.txt <<'EOF'
          T1 L=0.40 — V7 OPERATOR BOUND AUDIT

          ESTABLISHED MATHEMATICAL FACTS USED

          [A] For an orthogonal projection P:

              ||P E P||op <= ||E||op

              ||P E P||HS <= ||E||HS.

          Therefore the pole projection itself
          cannot enlarge an already-proved
          operator error.

          [B] For an integral operator with
          kernel error e on T x T:

              ||E||op <= ||E||HS.

          If

              |e(u,v)| <= eps

          uniformly and |T| = ell, then

              ||E||HS <= ell * eps.

          [C] For

              k_R(x)
              = sin(Rx)/(pi x)
              = (1/pi) int_0^R cos(tx) dt,

          rigorous derivative bounds are

              |k_R|   <= R/pi
              |k_R'|  <= R^2/(2pi)
              |k_R''| <= R^3/(3pi).

          [D] For a finite signed combination

              K = sum_i a_i K_Ri,

          triangle inequality gives

              |K''|
              <=
              sum_i |a_i| Ri^3/(3pi).

          NOT YET ESTABLISHED

          [1] A theorem identifying the finite
          weighted Nyström matrix used by the
          reference code with an operator
          approximation whose kernel error is
          uniformly bounded by the scalar
          trapezoid remainder.

          This is the principal missing link.

          [2] Exact finite-sinc representations
          for every active profile/tent operator.

          [3] Rigorous finite-matrix eigenvalue
          upper enclosures.

          [4] Bounds for all 40 active dual rows.

          CONSEQUENCE

          V7 MUST NOT output

              "T1 CERTIFIED"
              "RH PROVED"

          as a rigorous mathematical conclusion.

          A valid Lambda_plus requires:

              Lambda_plus
              =
              lambda_N_upper
              +
              delta_N

          where BOTH terms are rigorous.

          NEXT TARGET

          Prove or replace missing link [1].

          A promising alternative is to bypass
          Nyström convergence entirely and use
          an analytic Hilbert-Schmidt / moment
          upper bound directly on the continuum
          operator, because this avoids needing
          to prove spectral convergence of the
          discretization.
          EOF

          cat V7-PROOF-LEDGER.txt

      - name: Decide next mathematical route
        run: |
          python - <<'PY'
          # Fail-closed route decision.
          #
          # We deliberately do NOT manufacture
          # a rigorous delta_N from the scalar
          # trapezoid bound.

          print("=" * 72)
          print("V7 DECISION")
          print("=" * 72)

          print()
          print(
              "Nyström route remains numerically "
              "excellent."
          )

          print(
              "However the uniform operator-error "
              "link is not yet proved."
          )

          print()
          print(
              "NEXT PRIMARY ROUTE:"
          )

          print(
              "continuum Hilbert-Schmidt / "
              "moment bound with verified "
              "1-D integrals and rank-2 "
              "projection corrections."
          )

          print()
          print(
              "NYSTROM ROUTE:"
          )

          print(
              "retain as independent numerical "
              "cross-check."
          )

          print()
          print(
              "NO RIGOROUS CERTIFICATION CLAIM."
          )
          PY

      - name: Upload V7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v7-operator-audit
          path: |
            v7-targets.json
            v7-kernel-bounds.json
            v7-signed-envelope.json
            V7-PROOF-LEDGER.txt