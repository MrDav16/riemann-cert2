name: T1 L040 V10.1 Direct Shifted Active Rows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  direct-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Extract exact rows and dual
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run

          L=0.40; N=1200; TARGETS=[341,326,396]
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])
          A=np.vstack(rows+[np.ones_like(r)])
          b=np.concatenate([caps,[1.0]])
          lp=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          y=-np.asarray(lp.ineqlin.marginals[:-1],float)

          out={"L":L,"N":N,"pilot":float(val),"r":r.tolist(),"targets":{}}
          for idx in TARGETS:
              sig=rows[idx]; theta=abs(float(sig.min()))
              out["targets"][str(idx)]={
                  "cap":float(caps[idx]),
                  "dual_weight":float(y[idx]),
                  "theta":theta,
                  "sigma":sig.tolist()
              }
              print(idx,"cap",caps[idx],"y",y[idx],"theta",theta)

          with open("../../../v101-input.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("INPUT EXTRACTION: PASS")
          PY

      - name: Direct shifted reconstruction at multiple n
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.linalg import null_space, eigvalsh
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          with open("../../../v101-input.json") as f: d=json.load(f)
          r=np.asarray(d["r"],float)
          ns=[400,600,800,1200]
          report={}

          for key,item in d["targets"].items():
              sig=np.asarray(item["sigma"],float)
              theta=float(item["theta"])
              c=sig+theta
              if c.min() < -1e-12:
                  raise RuntimeError(f"{key}: shifted profile negative")
              report[key]={"theta":theta,"cap_reference":float(item["cap"]),"by_n":{}}

              for n in ns:
                  u,w,v1,v2,K=build_operator(0.40,n)
                  U=np.column_stack([v1,v2])
                  Q=null_space(U.T)
                  C=profile_operator(c,r,u,w,v1,v2)
                  CV=Q.T@C@Q

                  lamC=float(eigvalsh(
                      CV,
                      subset_by_index=[CV.shape[0]-1,CV.shape[0]-1]
                  )[0])
                  shifted=lamC-theta
                  k2=float(np.linalg.norm(CV,"fro"))-theta

                  z={
                      "lambda_C_minus_theta":shifted,
                      "k2_bound":k2,
                      "cap_error":shifted-float(item["cap"]),
                      "k2_inflation_over_reference":k2-float(item["cap"])
                  }
                  report[key]["by_n"][str(n)]=z
                  print("ROW",key,"n",n,z)

          with open("../../../v101-direct-shift.json","w") as f:
              json.dump(report,f,indent=2,sort_keys=True)
          print("DIRECT SHIFTED RECONSTRUCTION: PASS")
          PY

      - name: Convergence sanity check
        run: |
          python - <<'PY'
          import json
          with open("v101-direct-shift.json") as f: d=json.load(f)

          for row,x in d.items():
              vals=[x["by_n"][str(n)]["lambda_C_minus_theta"] for n in [400,600,800,1200]]
              ref=x["cap_reference"]
              print("\nROW",row,"reference",ref)
              print("shifted caps",vals)
              print("n1200 error",vals[-1]-ref)

              # At n=1200, direct shifted construction should reproduce
              # the same cap to a tight numerical tolerance.
              if abs(vals[-1]-ref)>5e-6:
                  raise RuntimeError(
                      f"row {row}: direct shifted n1200 does not reproduce cap"
                  )

          print("\nDIRECT SHIFT CAP REPRODUCTION: PASS")
          PY

      - name: Compute exact priority dual impact
        run: |
          python - <<'PY'
          import json
          with open("v101-input.json") as f: inp=json.load(f)
          with open("v101-direct-shift.json") as f: d=json.load(f)

          pilot=float(inp["pilot"])
          total=0.0
          out={}

          for row in ["341","326","396"]:
              cap=float(inp["targets"][row]["cap"])
              y=float(inp["targets"][row]["dual_weight"])
              k2=float(d[row]["by_n"]["1200"]["k2_bound"])
              inflation=max(k2-cap,0.0)
              loss=y*inflation
              total+=loss
              out[row]={
                  "cap":cap,"dual_weight":y,
                  "k2_bound_n1200":k2,
                  "inflation":inflation,
                  "weighted_loss":loss
              }
              print("ROW",row,out[row])

          remaining=pilot-total
          out["pilot"]=pilot
          out["total_priority_loss"]=total
          out["remaining_margin"]=remaining

          print("\npilot =",pilot)
          print("total priority k2 loss =",total)
          print("remaining margin =",remaining)

          if remaining>0:
              verdict="VIABLE_PRIORITY_K2"
          else:
              verdict="PRIORITY_K2_EXHAUSTS_MARGIN"

          out["verdict"]=verdict
          print("VERDICT =",verdict)

          with open("v101-dual-impact.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          PY

      - name: Fail-closed interpretation
        run: |
          python - <<'PY'
          import json
          with open("v101-dual-impact.json") as f: d=json.load(f)

          print("="*72)
          print("V10.1 RESULT")
          print("="*72)
          print("Priority finite-dimensional verdict:",d["verdict"])
          print("Remaining pilot margin:",d["remaining_margin"])
          print()
          print("This does NOT certify the continuum caps.")
          print("If viable, next step is rigorous continuum k=2 evaluation")
          print("with rank-2 projection corrections for the exact shifted profiles.")
          PY

      - name: Write ledger
        run: |
          cat > V101-LEDGER.txt <<'EOF'
          V10.1 — DIRECT SHIFTED ACTIVE-ROW TEST

          V10 showed that profile_operator(sigma) is not the original signed
          operator construction. Therefore V10.1 does not use it.

          Instead, for each exact stored active profile sigma and
          theta = -min(sigma), it forms

              c = sigma + theta >= 0

          and directly constructs C_c.

          The numerical test checks whether

              lambda_max(C_c|V) - theta

          reproduces the reference active cap at n=1200.

          Only if that reproduction succeeds do we use

              sqrt(Tr_V(C_c^2)) - theta

          as a finite-dimensional k=2 feasibility bound and charge its
          inflation against the exact LP dual weights.

          This is still NOT a rigorous continuum certificate and NOT a proof
          of T1 or RH. A successful V10.1 only justifies proceeding to
          rigorous continuum moment evaluation and rank-2 corrections.
          EOF
          cat V101-LEDGER.txt

      - name: Upload V10.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v101-direct-shift
          path: |
            v101-input.json
            v101-direct-shift.json
            v101-dual-impact.json
            V101-LEDGER.txt