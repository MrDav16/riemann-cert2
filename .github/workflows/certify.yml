name: T1 L040 V14 Rigorous Discretization Bound Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  discretization-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint sympy

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Extract exact row 326 data
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json, numpy as np
          from scipy.optimize import linprog
          from sigma_t1c import run

          L=.40; N=1200; ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          cost=np.asarray(st["cost"],float); tail=float(st["tail"])

          A=np.vstack(rows+[np.ones_like(r)])
          b=np.concatenate([caps,[1.]])
          lp=linprog(cost-tail,A_ub=A,b_ub=b,bounds=(0,None),method="highs")
          if not lp.success: raise RuntimeError(lp.message)
          dual=-np.asarray(lp.ineqlin.marginals[:-1],float)

          sigma=rows[ROW]
          theta=abs(float(sigma.min()))
          c=sigma+theta
          slope=np.diff(c)/np.diff(r)
          ids=[0]
          for i in range(1,len(slope)):
              if abs(slope[i]-slope[i-1])>1e-10: ids.append(i)
          ids.append(len(r)-1)
          ids=sorted(set(ids))
          knots=[[float(r[i]),float(c[i])] for i in ids]

          out={
              "L":L,"ell":2*L,"pilot":float(val),"row":ROW,
              "cap":float(caps[ROW]),"dual":float(dual[ROW]),
              "theta":theta,"r":r.tolist(),"c":c.tolist(),"knots":knots
          }
          with open("../../../v14-input.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps({k:out[k] for k in ["cap","dual","theta","knots"]},indent=2))
          print("ROW 326 INPUT: PASS")
          PY

      - name: Inspect reference quadrature construction
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import inspect,json
          import sharp_floor
          import sigma_t1b

          data={
              "build_operator_source":inspect.getsource(sharp_floor.build_operator),
              "profile_operator_source":inspect.getsource(sigma_t1b.profile_operator)
          }
          with open("../../../v14-reference-source.json","w") as f:
              json.dump(data,f,indent=2)
          print(data["build_operator_source"])
          print(data["profile_operator_source"])
          print("REFERENCE SOURCE CAPTURE: PASS")
          PY

      - name: Derive sinc derivative envelopes with Arb
        run: |
          python - <<'PY'
          from flint import arb,ctx
          import json,math
          ctx.prec=192

          with open("v14-input.json") as f: d=json.load(f)
          ell=float(d["ell"])
          pi=arb.pi()

          # k_R(x)=sin(Rx)/(pi*x), removable at x=0.
          # Power-series absolute derivative bounds valid for |x|<=ell:
          #
          # |k^(m)(x)| <= 1/pi sum_{q>=ceil(m/2)}
          # R^(2q+1) (2q)! / ((2q+1)! (2q-m)!) |x|^(2q-m)
          #
          # We evaluate a conservative finite series plus geometric-style
          # exponential tail using exp(R*ell).

          def deriv_bound(R,m):
              R=arb(str(R)); E=arb(str(ell))
              # Direct entire-function series, many terms at high precision.
              s=arb(0)
              for q in range(0,90):
                  p=2*q
                  if p<m: continue
                  # sin(Rx)/x = sum (-1)^q R^(2q+1)x^(2q)/(2q+1)!
                  coeff=(R**(2*q+1))/arb(math.factorial(2*q+1))
                  fall=arb(math.factorial(2*q))/arb(math.factorial(2*q-m))
                  s += coeff*fall*(E**(2*q-m))
              # Terms beyond q=89 are negligible numerically here, but V14
              # remains an audit rather than claiming this truncation alone
              # as the final proof. Record a deliberately huge safe tail proxy.
              tail=(R**181)*(E**max(180-m,0))/arb(math.factorial(181))
              tail *= arb(math.factorial(180))/arb(math.factorial(max(180-m,0)))
              tail *= (R*E).exp()
              return (s+tail)/pi

          Rs=[4,5,6,7,8,9,10,11,12]
          out={}
          for R in Rs:
              out[str(R)]={}
              for m in range(0,5):
                  b=deriv_bound(R,m)
                  out[str(R)][str(m)]=str(b)
                  print("R",R,"m",m,"bound",b)

          with open("v14-sinc-derivative-bounds.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print("SINC DERIVATIVE ENVELOPES: PASS")
          PY

      - name: Empirical order diagnostic only
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigvalsh
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          with open("../../../v14-input.json") as f:d=json.load(f)
          r=np.asarray(d["r"],float); c=np.asarray(d["c"],float)
          theta=float(d["theta"])
          ns=[100,150,200,300,400,600,800,1200]
          vals={}

          for n in ns:
              u,w,v1,v2,K=build_operator(.40,n)
              Q=null_space(np.column_stack([v1,v2]).T)
              CV=Q.T@profile_operator(c,r,u,w,v1,v2)@Q
              ev=np.maximum(eigvalsh(CV),0.)
              tr8=float(np.sum(ev**8))
              vals[str(n)]={"tr8":tr8,"bound":tr8**(1/8)-theta}
              print(n,vals[str(n)])

          # Estimate observed p from successive differences. Diagnostic only.
          diffs=[]
          for a,b in zip(ns[:-1],ns[1:]):
              diffs.append([a,b,abs(vals[str(a)]["tr8"]-vals[str(b)]["tr8"])])
          with open("../../../v14-convergence.json","w") as f:
              json.dump({"values":vals,"differences":diffs},f,indent=2)
          print("EMPIRICAL CONVERGENCE (NON-RIGOROUS): PASS")
          PY

      - name: Conservative midpoint quadrature theorem budget
        run: |
          python - <<'PY'
          import json,math

          with open("v14-input.json") as f:d=json.load(f)
          ell=float(d["ell"])
          cap=float(d["cap"]); theta=float(d["theta"])

          # For scalar midpoint quadrature on interval length ell:
          # |int f - h sum f(mid)| <= ell*h^2/24 * sup|f''|.
          #
          # The actual trace-8 integrand is multivariate and projected.
          # V14 does NOT silently apply the scalar formula to the full problem.
          # Instead compute the derivative budget that a rigorous derivation
          # would have to beat for several N.

          reference_tr8=9.008250529367287e-6
          max_cap=cap+0.010
          max_root=theta+max_cap
          max_tr8=max_root**8
          trace_allowance=max_tr8-reference_tr8

          out={
              "reference_tr8":reference_tr8,
              "max_tr8_under_local_cap_budget":max_tr8,
              "absolute_trace8_allowance":trace_allowance,
              "N":{}
          }

          # If an eventual 8-D/product midpoint estimate has form
          # error <= 8 * ell^8 * h^2/24 * M2,
          # solve for the maximum admissible M2. This is a TARGET,
          # not an asserted theorem for our kernel.
          for N in [100,200,400,800,1200,1600,2400]:
              h=ell/N
              coeff=8*(ell**8)*(h**2)/24
              admissible=trace_allowance/coeff
              out["N"][str(N)]={
                  "h":h,
                  "hypothetical_product_midpoint_coefficient":coeff,
                  "max_admissible_second_derivative_sum_scale":admissible
              }

          with open("v14-derivative-budget.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2))
          print("DERIVATIVE BUDGET: PASS")
          PY

      - name: Projection perturbation algebra audit
        run: |
          python - <<'PY'
          import numpy as np,json

          # Verify generic trace-power perturbation numerically:
          # |Tr(A^8)-Tr(B^8)| <= 8*d*M^7*||A-B||_2
          # for finite d and M=max(||A||,||B||), via telescoping +
          # |Tr X| <= d||X||. This bound is intentionally crude.
          rng=np.random.default_rng(12345)
          tests=[]
          for d in [4,8,16]:
              X=rng.normal(size=(d,d)); A=(X+X.T)/(4*d)
              E=rng.normal(size=(d,d)); E=(E+E.T)/(2*d)*1e-5
              B=A+E
              lhs=abs(np.trace(np.linalg.matrix_power(A,8))-
                      np.trace(np.linalg.matrix_power(B,8)))
              M=max(np.linalg.norm(A,2),np.linalg.norm(B,2))
              eps=np.linalg.norm(A-B,2)
              rhs=8*d*(M**7)*eps
              tests.append({"d":d,"lhs":float(lhs),"rhs":float(rhs),"pass":bool(lhs<=rhs*(1+1e-10))})
              print(tests[-1])
              if lhs>rhs*(1+1e-10): raise RuntimeError("perturbation regression failed")
          with open("v14-perturbation.json","w") as f:json.dump(tests,f,indent=2)
          print("PERTURBATION ALGEBRA: PASS")
          PY

      - name: Compute required operator error threshold
        run: |
          python - <<'PY'
          import json,math

          with open("v14-input.json") as f:d=json.load(f)
          cap=float(d["cap"]); theta=float(d["theta"])
          tr8=9.008250529367287e-6
          root=tr8**(1/8)

          # Allocate +0.010 cap error to continuum certification.
          target_root=theta+cap+0.010
          delta_root=target_root-root

          # For positive compact operators, eigenvalue perturbations obey
          # |lambda_max(C)-lambda_max(C_N)| <= ||C-C_N||.
          # This gives a direct and much cleaner sufficient target:
          #
          # ||C-C_N|| <= delta_root
          #
          # would preserve the local +0.010 cap allowance when using a
          # certified finite spectral upper bound. This does not itself
          # establish the required norm error.
          out={
              "finite_root8":root,
              "finite_shifted_bound":root-theta,
              "target_root_under_plus_0p010":target_root,
              "available_root_slack":delta_root,
              "sufficient_operator_norm_error_target":delta_root
          }
          with open("v14-operator-error-target.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2))
          if delta_root<=0:raise RuntimeError("no operator error budget")
          print("OPERATOR ERROR TARGET: PASS")
          PY

      - name: Fail-closed V14 decision
        run: |
          python - <<'PY'
          import json
          with open("v14-operator-error-target.json") as f:t=json.load(f)
          with open("v14-derivative-budget.json") as f:b=json.load(f)

          decision={
              "row":326,
              "continuum_certified":False,
              "status":"DERIVATIVE_BOUND_DERIVATION_REQUIRED",
              "operator_norm_error_target":t["sufficient_operator_norm_error_target"],
              "trace8_allowance":b["absolute_trace8_allowance"],
              "what_is_proved":[
                  "exact active shifted profile is fixed",
                  "finite k8 target and available cap slack are quantified",
                  "Arb derivative primitives can be evaluated",
                  "a sufficient operator-norm accuracy target is explicit"
              ],
              "missing_proof":[
                  "explicit continuum kernel formula for the exact piecewise-linear profile",
                  "rigorous derivative bounds for that full projected kernel",
                  "a theorem converting those derivative bounds into ||C-C_N||",
                  "certified finite operator upper bound combined with that norm error"
              ]
          }
          with open("v14-decision.json","w") as f:json.dump(decision,f,indent=2,sort_keys=True)
          print(json.dumps(decision,indent=2))
          print("FAIL-CLOSED: NO CONTINUUM CERTIFICATION CLAIM")
          PY

      - name: Write V14 ledger
        run: |
          cat > V14-LEDGER.txt <<'EOF'
          V14 — RIGOROUS DISCRETIZATION BOUND AUDIT

          PURPOSE
          -------
          V13 validated interval arithmetic but left the central continuum gap:

              ||C - C_N|| <= epsilon_N.

          V14 quantifies exactly how small epsilon_N needs to be for row 326
          and audits the analytic ingredients needed to prove such a bound.

          KEY PRINCIPLE
          -------------
          Observed convergence in N is diagnostic only. It is never promoted
          to a proof.

          For a self-adjoint operator, a sufficient perturbation statement is

              |lambda_max(C)-lambda_max(C_N)| <= ||C-C_N||.

          Therefore a rigorously proved operator norm error smaller than the
          available root/cap slack can close the continuum gap once the finite
          matrix spectral bound is itself certified.

          V14 records sinc derivative envelopes, midpoint-rule budgets,
          perturbation algebra checks, and the explicit required norm target.

          WHAT REMAINS
          ------------
          The full exact continuum kernel generated by the row-326
          piecewise-linear spectral profile must be written analytically.
          Its derivatives, including projection/rank-2 terms, must then be
          bounded rigorously. Those bounds must feed a proved Nyström or
          quadrature error theorem.

          V14 is fail-closed:
          continuum_certified = false.

          NO T1 OR RH PROOF CLAIM IS MADE.
          EOF
          cat V14-LEDGER.txt

      - name: Upload V14 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v14-discretization-bound-audit
          path: |
            v14-input.json
            v14-reference-source.json
            v14-sinc-derivative-bounds.json
            v14-convergence.json
            v14-derivative-budget.json
            v14-perturbation.json
            v14-operator-error-target.json
            v14-decision.json
            V14-LEDGER.txt