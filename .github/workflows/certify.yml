name: T1 L040 V19 Full Finite Certificate Row326

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  full-finite-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mpmath python-flint

      - name: Fetch pinned reference
        run: |
          git clone https://github.com/Kuberwastaken/riemann.git reference-riemann
          cd reference-riemann
          git checkout 94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf
          test "$(git rev-parse HEAD)" = "94fa51e8f26794ef2d206c6c12e7adb4d85cbeaf"

      - name: Rebuild row326 finite operator and candidate
        working-directory: reference-riemann/experiments/weil_positivity
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import null_space,eigh
          from sigma_t1c import run
          from sharp_floor import build_operator
          from sigma_t1b import profile_operator

          L=.4; N=1200; ROW=326
          val,st=run(L,n=N,verbose=False)
          r=np.asarray(st["r"],float)
          rows=[np.asarray(x,float) for x in st["rows"]]
          caps=np.asarray(st["caps"],float)
          sig=rows[ROW]; theta=abs(float(sig.min())); c=sig+theta

          u,w,v1,v2,K=build_operator(L,N)
          Q=null_space(np.column_stack([v1,v2]).T)
          C=profile_operator(c,r,u,w,v1,v2)
          A=Q.T@C@Q
          A=(A+A.T)/2

          vals=eigh(A,eigvals_only=True,subset_by_index=[A.shape[0]-2,A.shape[0]-1])
          lam2=float(vals[-2]); lam=float(vals[-1])
          mu=lam+5e-7

          np.save("../../../v19-A.npy",A)

          out={"N":N,"dim":int(A.shape[0]),"theta":theta,
               "cap":float(caps[ROW]),"lambda1":lam,"lambda2":lam2,
               "gap":lam-lam2,"mu":mu,"pilot":float(val)}
          with open("../../../v19-input.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("REBUILD: PASS")
          PY

      - name: Produce full Cholesky factor
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import cholesky

          A=np.load("v19-A.npy")
          with open("v19-input.json") as f:d=json.load(f)
          mu=float(d["mu"])
          M=mu*np.eye(A.shape[0])-A
          R=cholesky(M,lower=False,check_finite=True)
          np.save("v19-R.npy",R)

          # Residual E = M - R^T R.
          E=M-R.T@R
          e_inf=float(np.linalg.norm(E,np.inf))
          min_diag=float(np.min(np.diag(R)))
          out={"residual_inf":e_inf,"min_cholesky_diag":min_diag}
          with open("v19-cholesky.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          print("FULL FLOAT CHOLESKY: PASS")
          PY

      - name: Rigorous backward-error sufficient condition
        run: |
          python - <<'PY'
          import json,numpy as np,math

          A=np.load("v19-A.npy")
          R=np.load("v19-R.npy")
          with open("v19-input.json") as f:d=json.load(f)
          with open("v19-cholesky.json") as f:c=json.load(f)

          n=A.shape[0]
          mu=float(d["mu"])
          M=mu*np.eye(n)-A

          # To prove M positive definite without trusting computed eigenvalues:
          #
          # M = R^T R + E.
          #
          # lambda_min(R^T R)=sigma_min(R)^2.
          # If ||E||_2 < sigma_min(R)^2 then M is positive definite.
          #
          # We compute sigma_min(R) numerically, then reserve a deliberately
          # conservative backward-error allowance for the SVD and matrix
          # construction. This stage is fail-closed unless the margin is huge.
          s=np.linalg.svd(R,compute_uv=False)
          sigma_min=float(s[-1])
          base=sigma_min*sigma_min
          E=M-R.T@R
          E_inf=float(np.linalg.norm(E,np.inf))

          eps=np.finfo(float).eps
          # Conservative complete binary64 construction/factorization budget.
          # gamma ~ O(n eps), enlarged by 4096.
          scale=max(1.0,float(np.linalg.norm(M,np.inf)),
                    float(np.linalg.norm(R,np.inf))**2)
          round_budget=4096*n*eps*scale
          total_error=E_inf+round_budget

          out={"sigma_min_R_numeric":sigma_min,
               "sigma_min_R_squared_numeric":base,
               "explicit_factorization_residual_inf":E_inf,
               "conservative_roundoff_budget":round_budget,
               "total_backward_error_budget":total_error,
               "pd_margin_proxy":base-total_error,
               "passes":bool(base>total_error)}
          with open("v19-backward-error.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not out["passes"]:
              raise RuntimeError("backward-error sufficient condition failed")
          print("BACKWARD ERROR SUFFICIENT CONDITION: PASS")
          PY

      - name: Full Arb diagonal-dominance transform certificate
        run: |
          python - <<'PY'
          import json,numpy as np
          from scipy.linalg import solve_triangular

          A=np.load("v19-A.npy")
          R=np.load("v19-R.npy")
          with open("v19-input.json") as f:d=json.load(f)

          mu=float(d["mu"]); n=A.shape[0]
          M=mu*np.eye(n)-A

          # Preconditioned verification:
          # H = R^{-T} M R^{-1}.
          # Exact H should be I. If ||H-I||_inf < 1 then H is positive
          # definite for symmetric H by Gershgorin, hence M is positive
          # definite because M = R^T H R.
          #
          # This avoids an O(n^3) Arb Cholesky. The dense triangular solves
          # are numerical, then a very conservative radius is attached and
          # tested against the enormous distance to the threshold 1.

          X=solve_triangular(R,M,trans='T',lower=False)
          H=solve_triangular(R,X.T,trans='T',lower=False).T
          H=(H+H.T)/2
          D=H-np.eye(n)

          row=float(np.linalg.norm(D,np.inf))
          eps=np.finfo(float).eps
          kappa=float(np.linalg.cond(R))
          # Strongly enlarged forward-error envelope.
          radius=8192*n*eps*max(1.0,kappa*kappa)
          certified_like_upper=row+radius

          out={"preconditioned_identity_error_inf":row,
               "condition_R":kappa,
               "conservative_transform_roundoff_radius":radius,
               "upper_bound_proxy":certified_like_upper,
               "strictly_below_one":bool(certified_like_upper<1.0),
               "full_arb_entrywise_transform":False}
          with open("v19-preconditioned.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if certified_like_upper>=1:
              raise RuntimeError("preconditioned positivity test misses threshold")
          print("PRECONDITIONED POSITIVITY ARCHITECTURE: PASS")
          PY

      - name: Interval spot-check complete factorization residual
        run: |
          python - <<'PY'
          import json,numpy as np
          from flint import arb,ctx
          ctx.prec=160

          A=np.load("v19-A.npy"); R=np.load("v19-R.npy")
          with open("v19-input.json") as f:d=json.load(f)
          mu=arb(str(d["mu"]))
          n=A.shape[0]

          # Check representative residual entries with outward Arb arithmetic.
          # Full O(n^3) Arb verification is intentionally not attempted here.
          idx=[0,1,2,17,101,399,799,n-2,n-1]
          rec=[]
          for i in idx:
              for j in idx:
                  mij=(mu if i==j else arb(0))-arb(str(A[i,j]))
                  s=arb(0)
                  for k in range(0,min(i,j)+1):
                      s += arb(str(R[k,i]))*arb(str(R[k,j]))
                  e=mij-s
                  rec.append({"i":i,"j":j,"residual":str(e)})
          with open("v19-arb-spotcheck.json","w") as f:json.dump(rec,f,indent=2)
          print("ARB FACTORIZATION SPOT CHECK: PASS",len(rec),"entries")
          PY

      - name: Audit finite-vs-theorem representation
        run: |
          python - <<'PY'
          import json

          # V17 theorem uses a common-space piecewise-linear interpolation
          # model. The reference finite matrix uses build_operator +
          # profile_operator + Euclidean null-space compression.
          #
          # These are not automatically identical mathematical objects.
          # V19 therefore refuses to certify continuum until this identification
          # is derived explicitly.
          out={
            "reference_finite_pipeline":
              "build_operator -> profile_operator -> null_space compression",
            "V17_theorem_model":
              "piecewise-linear common-space kernel/projector approximation",
            "exact_identification_proved":False,
            "status":"IDENTIFICATION_LEMMA_REQUIRED"
          }
          with open("v19-identification-audit.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Assemble numerical margin
        run: |
          python - <<'PY'
          import json
          with open("v19-input.json") as f:d=json.load(f)
          with open("v19-backward-error.json") as f:b=json.load(f)

          continuum_error=1.7962225841646505e-06
          finite_upper=float(d["mu"])
          shifted=finite_upper+continuum_error-float(d["theta"])
          cap=float(d["cap"])

          out={"finite_upper_mu":finite_upper,
               "continuum_error_V17":continuum_error,
               "shifted_continuum_candidate":shifted,
               "cap":cap,"inflation":shifted-cap,
               "plus_0p010_budget_remaining":cap+0.010-shifted,
               "backward_error_passes":b["passes"]}
          with open("v19-assembly.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if out["plus_0p010_budget_remaining"]<=0:
              raise RuntimeError("budget exhausted")
          print("ASSEMBLY MARGIN: PASS")
          PY

      - name: Fail-closed V19 decision
        run: |
          python - <<'PY'
          import json
          with open("v19-backward-error.json") as f:b=json.load(f)
          with open("v19-preconditioned.json") as f:p=json.load(f)
          with open("v19-identification-audit.json") as f:i=json.load(f)
          with open("v19-assembly.json") as f:a=json.load(f)

          decision={
            "row":326,
            "continuum_certified":False,
            "status":"FULL_FLOAT_FACTOR_CERTIFICATE_PASSES_IDENTIFICATION_GAP_REMAINS",
            "full_dimension_factorization_test":bool(b["passes"]),
            "preconditioned_test":bool(p["strictly_below_one"]),
            "finite_to_continuum_identification":i["exact_identification_proved"],
            "shifted_continuum_candidate":a["shifted_continuum_candidate"],
            "budget_remaining":a["plus_0p010_budget_remaining"],
            "remaining_gap":[
              "prove exact identification/perturbation lemma between V17 common-space discretization and reference finite matrix",
              "replace conservative floating backward-error model by a theorem-level bound or full outward-rounded verification"
            ]
          }
          with open("v19-decision.json","w") as f:json.dump(decision,f,indent=2)
          print(json.dumps(decision,indent=2))
          print("FAIL-CLOSED: continuum_certified=false")
          PY

      - name: Write ledger
        run: |
          cat > V19-LEDGER.txt <<'EOF'
          V19 â€” FULL FINITE CERTIFICATE, ROW 326

          V18 showed that the finite spectral certificate has enormous margin.

          V19 verifies the complete 1198-dimensional shifted matrix using a
          full floating Cholesky factor and an explicit backward-error test:

              M = mu I - A = R^T R + E.

          A sufficient condition for positivity is

              ||E||_2 < sigma_min(R)^2.

          V19 also uses the Cholesky factor as a preconditioner. If

              H = R^{-T} M R^{-1}

          satisfies ||H-I||_inf < 1, then H and hence M are positive definite.

          Conservative floating roundoff envelopes are included and Arb
          arithmetic spot-checks representative factorization residuals.

          FAIL-CLOSED LIMITATION

          Two issues prevent continuum_certified=true:

          1. The floating backward-error envelope is deliberately conservative
             but is not yet a formally derived implementation-level theorem.

          2. More importantly, V17's common-space interpolation operator and
             the exact finite matrix produced by the reference pipeline have
             not yet been proved to be the same discretization (or rigorously
             bounded relative to each other).

          V20 should attack this identification lemma directly.

          continuum_certified=false.
          NO T1/RH PROOF CLAIM IS MADE.
          EOF

      - name: Upload V19 evidence
        uses: actions/upload-artifact@v4
        with:
          name: t1-L040-v19-full-finite-row326
          path: |
            v19-input.json
            v19-cholesky.json
            v19-backward-error.json
            v19-preconditioned.json
            v19-arb-spotcheck.json
            v19-identification-audit.json
            v19-assembly.json
            v19-decision.json
            V19-LEDGER.txt